<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#4c1d95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fluid Run">
<meta name="description" content="Offline helper for a daily fluid run. Data stays on this phone.">
<title>Fluid Run</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f3f6f8; --card:#fff; --ink:#12202a; --muted:#5b6b75; --line:#e2e8eb;
  --teal:#0f766e; --teal-d:#0b5c56; --teal-s:#e6f4f2; --amber:#d97706; --amber-s:#fff7ed;
  --red:#dc2626; --red-s:#fef2f2; --ok:#15803d; --ok-s:#ecfdf3; --chip:#eef3f5;
  --nav-h:64px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 1px 2px rgba(18,32,42,.06), 0 4px 12px rgba(18,32,42,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{padding:0}
button,input,select,textarea{font:inherit;color:inherit}
button{appearance:none;-webkit-appearance:none}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:8px;top:8px;z-index:80;background:#fff;padding:8px}
.appbar{position:sticky;top:0;z-index:40;background:var(--teal);color:#fff;
  padding:calc(10px + var(--safe-t)) 14px 12px;display:flex;align-items:center;gap:10px}
.appbar h1{margin:0;font-size:1.15rem;letter-spacing:-.02em;flex:1}
.appbar .sub{margin:0;color:#d1eeea;font-size:.78rem;font-weight:600}
.appbar .back{min-width:44px;min-height:44px;border:0;background:transparent;color:#fff;border-radius:10px;font-size:1.2rem}
.appbar .back:active{background:rgba(255,255,255,.15)}
#banners{padding:0 12px}
.banner{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--amber-s);border:1px solid #f6d19a;color:#7c4a00;font-size:.9rem}
.banner.late{background:var(--red-s);border-color:#fecaca;color:#991b1b}
.banner b{display:block}
main{max-width:520px;margin:0 auto;padding:12px 12px calc(var(--nav-h) + 22px + var(--safe-b))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:.82rem}
h2{font-size:1rem;margin:0 0 8px}
h3{font-size:.86rem;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.btn{min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-weight:650;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
a.btn:visited{color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary,a.btn.primary,a.btn.primary:visited{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:var(--red-s);border-color:#fecaca;color:var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.progress{height:6px;background:#d5e5e3;border-radius:99px;overflow:hidden;margin-top:8px}
.progress>span{display:block;height:100%;background:#fff;border-radius:99px}
.appbar .progress{background:rgba(255,255,255,.25);margin:0}
.appbar .progress>span{background:#fff}
.ward{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;min-height:56px;
  border:1px solid var(--line);background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.ward:active{transform:scale(.99)}
.ward .name{font-weight:700;font-size:1.05rem}
.ward .meta{font-size:.8rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:700;background:var(--chip);color:var(--muted)}
.chip.ok{background:var(--ok-s);color:var(--ok)}
.chip.warn{background:var(--amber-s);color:var(--amber)}
.chip.idle{background:#eef1f3}
.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.codebtn{min-height:52px;border:1px solid var(--line);background:var(--chip);border-radius:12px;
  font-weight:700;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.codebtn .cn{font-size:.68rem;font-weight:600;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codebtn.on{background:var(--teal-s);border-color:var(--teal);color:var(--teal-d)}
.codebtn.hot{box-shadow:inset 0 0 0 2px var(--teal)}
.fluid-search{margin:12px 0 8px}
.fluid-search-wrap{position:relative;margin:0 0 10px}
.fluid-search-wrap .fluid-search{margin:0;padding-right:44px}
.fluid-search-wrap .search-clear{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;
  font-size:1.35rem;line-height:1;color:var(--muted);cursor:pointer;border-radius:10px}
.fluid-search-wrap .search-clear:active{background:#eef3f5}
.fluid-search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.fluid-nomatch{margin:8px 0 4px;color:var(--muted);font-weight:800;text-align:center}
.wardtabs{display:flex;gap:3px;margin:0 0 10px;background:#e6eeef;border-radius:12px;padding:3px}
.wardtabs button{flex:1;min-height:44px;border:0;background:transparent;font-weight:800;border-radius:10px;cursor:pointer;color:var(--muted)}
.wardtabs button.on{background:#fff;color:var(--teal-d);box-shadow:var(--shadow)}
.wardjumps{position:sticky;top:var(--bar-h,96px);z-index:30;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;background:var(--bg);padding:8px 12px 10px;margin:0 -12px 10px;scrollbar-width:none}
.wardjumps::-webkit-scrollbar{display:none}
.wardjumps button{flex:0 0 auto;min-height:40px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);
  background:#fff;font-weight:800;font-size:.82rem;white-space:nowrap;color:inherit;cursor:pointer}
.wardjumps button.on{background:var(--teal-s);border-color:var(--teal);color:var(--teal-d)}
.loadward,section.trolley{scroll-margin-top:calc(var(--bar-h,96px) + 52px)}
.allload-btn{width:28px;height:28px;padding:0;border:0;background:transparent;display:grid;place-items:center;flex:none;cursor:pointer}
.allload-btn .tick{width:22px;height:22px}
.allload-btn.done .tick{background:var(--teal);border-color:var(--teal);color:#fff}
.codewrap{position:relative;min-width:0}
.codewrap .starbtn{position:absolute;top:0;right:0;width:28px;height:28px;border:0;background:transparent;
  font-size:14px;line-height:1;color:var(--muted);cursor:pointer;padding:0;z-index:1}
.codewrap .starbtn.on{color:#c9a227}
.fluid-group h3,.favblock h3{margin:14px 0 6px;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.wardbar{height:3px;background:#e8ecef;border-radius:99px;margin-top:6px;overflow:hidden}
.wardbar>span{display:block;height:100%;background:var(--teal);border-radius:99px}
.streakchip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:800;color:var(--teal-d);margin-top:4px}
.quicktaps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.quicktaps button{min-height:40px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:.82rem}
.missrow,.loadrow,.co-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:8px}
.var-ok{color:var(--ok)}.var-short{color:var(--red)}.var-over{color:var(--amber)}
@keyframes wardpop{0%{transform:scale(.86);opacity:0}35%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:0}}
.ward-pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:80;pointer-events:none;
  width:88px;height:88px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:2.2rem;font-weight:800;
  animation:wardpop .7s ease both;box-shadow:0 8px 24px rgba(18,32,42,.18)}
@media (prefers-reduced-motion:reduce){
  .ward-pop{animation:none;opacity:0;display:none}
}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .code{font-weight:800;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.stepper button{width:44px;height:44px;border:0;background:#f3f6f8;font-size:1.2rem;font-weight:700;cursor:pointer}
.stepper button:active{background:#e6eeef}
.stepper .q{min-width:42px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.trolley{margin-bottom:12px}
.trolley h2{display:flex;align-items:center;gap:8px}
.tickrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px;min-height:56px;
  border:1px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:8px}
.tickrow.open{background:var(--amber-s);border-color:#f3c77a;box-shadow:0 0 0 2px rgba(217,119,6,.12)}
.tickrow.done{opacity:.62}
.tickrow.done .code{text-decoration:line-through}
.tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--teal);flex:none;display:grid;place-items:center;background:#fff}
.tickrow.done .tick{background:var(--teal);color:#fff}
.low{color:var(--red);font-weight:700;font-size:.75rem}
.stockrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.stockrow:last-child{border-bottom:0}
.rank{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar{flex:1;height:8px;background:#e6eeef;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--teal);border-radius:99px}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-size:.78rem;font-weight:700;color:var(--muted)}
.field input,.field select{min-height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff}

.setup-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
/* ===== v1.4.0 POW schedule ===== */
.bldg{margin:16px 2px 6px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bldg:first-child{margin-top:8px}
.wardnote{font-size:.75rem;color:var(--ink);opacity:.72;margin-top:2px;line-height:1.3}
.oncall-sec{margin-top:8px;padding-top:4px}
.oncall-head{margin:18px 2px 4px}
.oncall-head p{font-size:.78rem;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);margin:4px 0 0}
.ward.oncall{border-left-color:#94a3b8}
.daychip{display:inline-block;font-size:.68rem;font-weight:700;color:var(--teal-d);background:var(--teal-s);border-radius:99px;padding:1px 7px;margin-right:4px}
.privbox{margin-top:12px}
.privbox label{font-size:.78rem;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.privbox textarea,.notesbox{width:100%;min-height:64px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font:inherit;background:#fff}
.notesbox{min-height:0;margin:8px 0 0;color:var(--ink)}
.setup-ward{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.setup-ward .setup-item{border-bottom:0;padding-bottom:4px}
.setup-sub{display:grid;gap:6px;padding:0 0 6px 32px}
.setup-sub input[type="text"]{min-height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:.85rem;background:#fff}
.daypicks{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.daypicks button{min-width:36px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:.68rem;font-weight:700;padding:0 6px;cursor:pointer}
.daypicks button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.daypicks button:disabled{opacity:.4}
.oncall-lab{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 12px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:#12202a;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:90%;display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast .toast-undo{background:#fff;color:#12202a;border:0;border-radius:8px;font-weight:800;padding:6px 10px;min-height:36px;cursor:pointer}
.tickwrap{display:flex;align-items:stretch;gap:6px;margin-bottom:6px}
.tickwrap .tickrow{flex:1;min-width:0;margin:0}
.movebtn{flex:none;align-self:stretch;min-width:52px;padding:0 10px;font-size:.75rem;font-weight:800}
.trolley-acts{margin:6px 0 12px}
.moved{display:block;font-size:.7rem;color:var(--muted);font-weight:650;font-style:italic}
.pickdays{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pickdays button{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:.82rem;cursor:pointer}
.pickdays button:hover,.pickdays button:focus{border-color:var(--teal)}
.dlg-any{display:flex;gap:8px;align-items:center;margin-top:8px}
.dlg-any input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:4px 2px var(--safe-b);height:calc(var(--nav-h) + var(--safe-b))}
nav.tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:700;
  padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
nav.tabbar a svg{width:22px;height:22px}
nav.tabbar a.on{color:var(--teal)}
.brandfoot{margin-top:18px;text-align:center;color:var(--muted);font-size:.75rem}
.brandfoot img{width:12px;height:12px;vertical-align:-1px;margin-right:4px}
dialog{border:0;border-radius:16px;padding:16px;width:min(420px,calc(100vw - 32px));box-shadow:0 16px 50px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(18,32,42,.4)}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.hidden{display:none !important}
.site-tag{font-size:.7rem;color:var(--teal);font-weight:700}
.sitetog{flex:1 0 100%;display:flex;gap:3px;margin-top:8px;background:rgba(0,0,0,.18);border-radius:11px;padding:3px}
.sitetog button{flex:1;min-height:40px;border:0;background:transparent;color:#d1eeea;font-weight:750;border-radius:9px;cursor:pointer;font-size:.9rem}
.sitetog button.on{background:#fff;color:var(--teal-d)}
.unitpair{display:flex;align-items:center;gap:6px;flex:none}
.unitbtn{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800;font-size:.72rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:0 8px}
.unitbtn.on{background:var(--teal-s);border-color:var(--teal);color:var(--teal-d)}
.chip.kcl{background:var(--red-s);color:var(--red)}
.codebtn .kcl{display:inline-block;margin-top:2px;padding:1px 6px;border-radius:99px;background:var(--red-s);color:var(--red);font-size:.62rem;font-weight:800;letter-spacing:.04em}
.shelfnote{color:var(--amber);font-weight:700;font-size:.72rem}
.line{flex-wrap:wrap}
.appbar{flex-wrap:wrap}
/* ===== v1.2.0 game theme ===== */
:root{
  --bg:#eef2f8; --line:#dfe6ee; --teal:#0d9488; --teal-d:#0f5f59; --teal-s:#dcfaf5;
  --vio:#7c3aed; --vio-s:#f1eaff; --gold:#f59e0b; --gold-s:#fff6dd; --pink:#ec4899;
  --grad:linear-gradient(135deg,#0d9488 0%,#0e7490 45%,#6d28d9 100%);
  --grad-gold:linear-gradient(135deg,#fbbf24,#f97316);
  --grad-ok:linear-gradient(135deg,#16a34a,#0d9488);
  --shadow:0 1px 2px rgba(18,32,42,.06),0 6px 18px rgba(30,41,80,.07);
}
body{background:radial-gradient(1200px 400px at 50% -120px,#dbe9ff 0%,rgba(219,233,255,0) 70%),var(--bg)}
.appbar{background:var(--grad);box-shadow:0 6px 20px rgba(76,29,149,.25)}
.appbar h1{font-weight:850;font-size:1.25rem}
.appbar .sub{color:#e0f2fe}
.appbar .gchip{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:.85rem;border:0}
.appbar .gchip.snd{min-width:44px;min-height:44px;justify-content:center;font-size:1.1rem;cursor:pointer}

.appbar .syncchip{display:inline-flex;align-items:center;min-height:28px;padding:0 8px;margin-right:4px;border-radius:99px;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:.68rem;letter-spacing:.01em;cursor:pointer;max-width:48vw;white-space:nowrap}
.appbar .syncchip.err{background:#fecaca;color:#991b1b}
.appbar .syncchip.off{opacity:.9}
.wardwrap{margin:0 0 8px}
.usual-lab{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}
.usual-chips{display:flex;flex-wrap:wrap;gap:6px}
.usual-chip{display:inline-flex;align-items:baseline;gap:6px;min-height:36px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:.82rem}
.usual-chip .uqty{font-weight:600;color:var(--muted);font-size:.72rem}
.usual-more{min-height:36px;padding:4px 10px;border-radius:99px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:.78rem}
.usualcard{padding-bottom:12px}
.wardwrap .usual{padding:2px 12px 10px}
.sitetog{background:rgba(0,0,0,.22)}
.sitetog button{color:#e0f2fe}
.sitetog button.on{background:#fff;color:#4c1d95;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.card{border-radius:18px}
.btn{border-radius:13px}
.btn.primary,a.btn.primary,a.btn.primary:visited{background:var(--grad);border:0}
.btn.ok{background:var(--grad-ok);border:0}
.btn.big{min-height:56px;font-size:1.05rem;font-weight:800}
/* hero */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;margin-bottom:12px;
  background:linear-gradient(135deg,#1e1b4b 0%,#312e81 45%,#0f766e 100%);color:#fff;box-shadow:0 10px 28px rgba(49,46,129,.28)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.35),rgba(251,191,36,0) 70%)}
.hero.win{background:linear-gradient(135deg,#7c2d12 0%,#b45309 40%,#16a34a 100%)}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .rt b{font-size:1.45rem;font-weight:900;font-variant-numeric:tabular-nums}
.ring .rt span{font-size:.68rem;font-weight:700;color:#c7d2fe;text-transform:uppercase;letter-spacing:.06em}
.ring circle.fg{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}

.nextup{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:10px 14px;margin-bottom:12px;border:0;border-radius:18px;

.nextup .grow small{display:block;font-weight:700;font-size:.75rem;opacity:.8}

/* ward cards */
.ward{border-radius:16px;border-left:6px solid #cbd5e1;position:relative}
.ward.prog{border-left-color:var(--gold);background:linear-gradient(90deg,#fff8e6,#fff 60%)}
.ward.done{border-left-color:#16a34a;background:linear-gradient(90deg,#e9fbef,#fff 60%)}
.ward.done .name::after{content:" ✓";color:#16a34a}
.ward .medal{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.8rem;background:#eef2f7;color:#64748b}
.ward.done .medal{background:var(--grad-ok);color:#fff}
.ward.prog .medal{background:var(--grad-gold);color:#3b1d00}

.wardhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wardhead .progress{flex:1;height:10px;margin:0;background:#e2e8f0}
.wardhead .progress>span{background:var(--grad)}
.codes{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.codebtn{min-width:0;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 0 rgba(18,32,42,.04);transition:transform .12s}

.stepper button{background:#eef2f7}
.unitbtn.on{background:var(--vio-s);border-color:var(--vio);color:#5b21b6}
.tick{border-color:var(--vio)}
.tickrow.done .tick{background:var(--grad-ok);border-color:#16a34a}
.bar>span{background:var(--grad)}
nav.tabbar{background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}
nav.tabbar a.on{color:#5b21b6;background:var(--vio-s)}
/* trophies */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trophy{border-radius:14px;padding:10px 6px;text-align:center;background:#f1f5f9;border:1px dashed #cbd5e1;color:#94a3b8}
.trophy .ic{font-size:1.7rem;filter:grayscale(1);opacity:.45}
.trophy b{display:block;font-size:.78rem;margin-top:2px}
.trophy small{display:block;font-size:.66rem;line-height:1.2;margin-top:2px}
.trophy.got{background:linear-gradient(160deg,#fff7d6,#ffe8f3);border:1px solid #fcd34d;color:#78350f}
.trophy.got .ic{filter:none;opacity:1}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f8fafc;border-radius:14px;padding:10px}
.stat b{display:block;font-size:1.3rem;font-weight:900;color:#312e81}
.stat span{font-size:.75rem;color:var(--muted);font-weight:700}

#celebrate{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(.9);z-index:92;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;
  width:min(330px,calc(100vw - 40px));border-radius:24px;padding:20px 16px;text-align:center;color:#fff;background:var(--grad);box-shadow:0 20px 60px rgba(49,46,129,.45)}
#celebrate.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#celebrate .big{font-size:3rem;line-height:1}

#celebrate p{margin:0;color:#e0e7ff;font-weight:600}
#celebrate button{margin-top:14px;min-height:48px;padding:0 26px;border:0;border-radius:99px;background:var(--grad-gold);color:#3b1d00;font-weight:900;font-size:1rem}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
@keyframes pulse{0%{background:#ede9fe}100%{background:transparent}}

.bump{animation:bump .35s ease}
@media (prefers-reduced-motion: reduce){

.vbox.over{background:#fef3c7;color:#92400e}
.vbox.ok{background:#dcfce7;color:#166534}

.phone-note{margin-bottom:6px}

.rpt-head h2{font-size:.98rem;margin:0 0 2px;letter-spacing:-.02em;text-transform:none;color:var(--ink)}

.rpt-total{display:flex;justify-content:space-between;gap:8px;font-weight:850;padding-top:6px;margin-top:4px;border-top:2px solid var(--ink)}

function dayReport(iso, siteFilter){
  const r = S.rounds[iso];
  const out = {iso, wards:[], hasAnything:false, units:{box:0, ea:0}, spend:emptySpend()};
  if (!r) return out;
  const ids = Object.keys(r.wards||{});
  ids.sort((a,b) => {
    const wa = wardById(a), wb = wardById(b);
    const sa = entrySiteId(a, r.wards[a])||"";
    const sb = entrySiteId(b, r.wards[b])||"";
    if (sa!==sb) return sa.localeCompare(sb);
    return ((wa&&wa.order)!=null?wa.order:99) - ((wb&&wb.order)!=null?wb.order:99) || String((wa&&wa.name)||a).localeCompare(String((wb&&wb.name)||b));
  });
  ids.forEach(wid => {
    const e = r.wards[wid];
    const wRec = wardById(wid);
    if (isRetiredWard(wRec) || isRetiredWard({id:wid, name:(wRec&&wRec.name)||""})) return;
    const sid = entrySiteId(wid, e);
    if (siteFilter && siteFilter!=="all" && sid!==siteFilter) return;
    const lines = deliveredLines(e);
    const nothing = e.status==="nothing";
    const checkedEmpty = e.status==="checked" && !lines.length && !nothing;
    if (!lines.length && !nothing && !checkedEmpty) return;
    const w = wardById(wid);
    const site = sid ? siteById(sid) : null;
    out.hasAnything = true;
    out.units = addUnits(out.units, unitsOf(lines));
    out.spend = mergeSpend(out.spend, spendOfLines(lines));
    out.wards.push({
      id:wid,
      name:(w && w.name) || wid,
      siteId:sid,
      siteName:site ? site.name : "",
      lines,
      nothing,
      emptyChecked:checkedEmpty,
      status:e.status||"",
      savedAt:e.savedAt||""
    });
  });
  return out;
}

function dayShort(iso){

function itemGroups(days){

function itemUnitRows(days){

    (rep.wards||[]).forEach(w => {

        const key = itemKey(l);

        const g = map.get(key);

        if (!g.byDay[rep.iso]) g.byDay[rep.iso] = {packets:0, known:true, boxes:0};
        const cell = g.byDay[rep.iso];

function formatGridCell(cell){

function wardGroups(days){
  const map = new Map();
  (days||[]).forEach(rep => {
    (rep.wards||[]).forEach(w => {
      if (!map.has(w.id)) map.set(w.id, {id:w.id, name:w.name, items:[], nothing:false, emptyChecked:false, lines:[]});
      const g = map.get(w.id);
      const itemMap = new Map(g.items.map(it => [itemKey(it), it]));
      (w.lines||[]).forEach(l => {
        const key = itemKey(l);
        if (!itemMap.has(key)){
          const it = {codeId:l.codeId, code:l.code||"", name:l.name||"", label:l.label, lines:[]};
          itemMap.set(key, it);
          g.items.push(it);
        }
        itemMap.get(key).lines.push(l);
        g.lines.push(l);
      });
      if (w.nothing && !(w.lines||[]).length) g.nothing = true;
      if (w.emptyChecked && !(w.lines||[]).length) g.emptyChecked = true;
    });
  });
  return [...map.values()].map(g => {
    g.items.forEach(it => { it.spend = spendOfLines(it.lines); });

  return isos.filter(iso => {
    const dow = dowOf(iso);
    if (dow>=1 && dow<=5) return true;
    if (dow===6) return !!has.sat;
    if (dow===0) return !!has.sun;
    return false;
  });
}

function sheetNameFor(site, used){

  while (used.has(out.toLowerCase())){
    const suffix = " " + n;
    out = name.slice(0, 31 - suffix.length) + suffix;
    n++;
  }
  used.add(out.toLowerCase());
  return out;
}

function bareProductCode(code){
  return String(code||"").toUpperCase().replace(/^(AHB|AHF|AHK)/,"").replace(/A$/,"");
}
function isExactPlainCode(value, want){
  return String(value||"").trim().toLowerCase() === String(want||"").trim().toLowerCase();
}
function officialNameFor(code){
  const bare = bareProductCode(code);
  return CH_OFFICIAL_NAMES[bare] || CH_OFFICIAL_NAMES[String(code||"").trim()] || "";
}
function powNameFor(shortCode){
  const official = officialNameFor(shortCode);
  if (official) return official;
  const bare = bareProductCode(shortCode);
  if (CH_CODE_ONLY[bare]) return "";
  const row = POW_CATALOG.find(p => bareProductCode(p.code)===bare);
  return row ? row.name : "";
}
function applyOfficialNames(s){
  (s.codes||[]).forEach(c => {
    if (!c || c.tickOnly) return;
    const official = officialNameFor(c.code);

    const cur = String(c.name||"").trim();

    if (/kcl/i.test(c.name||n||"")) c.kcl = true;

}

  {id:"first-ward", ic:"🥇", name:"First Ward", how:"Finish your first ward"},
  {id:"full-round", ic:"🏆", name:"Full Round", how:"Finish every ward on a round"},
  {id:"speed-runner", ic:"⚡", name:"Speed Runner", how:"Beat your best round time"},
  {id:"lucky-star", ic:"🍀", name:"Lucky Star", how:"Land a lucky 2× ward"},
  {id:"on-fire", ic:"🔥", name:"On Fire", how:"3-day streak"},
  {id:"week-warrior", ic:"💪", name:"Week Warrior", how:"10-day streak"},
  {id:"order-ace", ic:"📨", name:"Order Ace", how:"Send an order before the cut-off"},
  {id:"both-sites", ic:"🏥", name:"Two Sites", how:"Full round at both sites"},
  {id:"century", ic:"💯", name:"Century", how:"100 wards done"},
  {id:"level-5", ic:"👑", name:"Level 5", how:"Reach level 5"}
];
const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
let G = null;
let lastTap = null;
let audioCtx = null;

function gDefault(){ return {v:1, banked:0, bonus:{}, runs:{}, best:{}, badges:{}, sound:false, haptic:true, bestStreak:0, lastLevel:0, fresh:true}; }
function gLoad(){
  try{ G = Object.assign(gDefault(), JSON.parse(localStorage.getItem(GSTORE)||"{}")); }
  catch(e){ G = gDefault(); }
  if (!G.bonus || typeof G.bonus!=="object") G.bonus = {};
  if (!G.runs || typeof G.runs!=="object") G.runs = {};
  if (!G.best || typeof G.best!=="object") G.best = {};
  if (!G.badges || typeof G.badges!=="object") G.badges = {};
  if (G.haptic == null) G.haptic = true;
  if (G.sound == null) G.sound = false;
  // Fold bonus entries older than 45 days into a single banked total so the store stays small.
  const cutoff = addDays(zonedNow().iso, -45);
  Object.keys(G.bonus).forEach(k => {
    const iso = (k.split("|")[1]||"");
    if (/^\d{4}-\d{2}-\d{2}$/.test(iso) && iso < cutoff){ G.banked += Number(G.bonus[k])||0; delete G.bonus[k]; }
  });
  Object.keys(G.runs).forEach(k => { if (k.slice(0,10) < cutoff) delete G.runs[k]; });
  if (G.fresh){ G.fresh = false; G.lastLevel = levelInfo(totalXp()).level; G.bestStreak = Math.max(G.bestStreak||0, streakDays()); gSave(); }
}
function gSave(){ try{ localStorage.setItem(GSTORE, JSON.stringify(G)); }catch(e){} }

function isDone(e){ return !!e && (e.status==="checked" || e.status==="nothing"); }
function wardXp(e){ return XP_WARD + Math.min(XP_LINE_CAP, (e.lines||[]).length*XP_LINE); }
function baseXp(){
  let xp = 0;
  Object.values(S.rounds||{}).forEach(r => Object.values(r.wards||{}).forEach(e => { if (isDone(e)) xp += wardXp(e); }));
  Object.values(S.trolley||{}).forEach(day => Object.values(day||{}).forEach(v => { if (v) xp += 1; }));
  return xp;
}
function totalXp(){ return baseXp() + (Number(G.banked)||0) + Object.values(G.bonus).reduce((a,b)=>a+(Number(b)||0),0); }
function xpForLevel(L){ return 75*L*(L-1); }
function levelInfo(xp){
  let L = 1;
  while (xp >= xpForLevel(L+1)) L++;
  const lo = xpForLevel(L), hi = xpForLevel(L+1);
  return {level:L, title:LEVEL_TITLES[Math.min(L-1, LEVEL_TITLES.length-1)], into:xp-lo, need:hi-lo, next:hi, pct:Math.round((xp-lo)/(hi-lo)*100)};
}
function todayXp(iso){
  let xp = 0;
  const r = S.rounds[iso];
  if (r) Object.values(r.wards||{}).forEach(e => { if (isDone(e)) xp += wardXp(e); });
  Object.values(S.trolley[iso]||{}).forEach(v => { if (v) xp += 1; });
  Object.entries(G.bonus).forEach(([k,v]) => { if (k.split("|")[1]===iso) xp += Number(v)||0; });
  return xp;
}
function closeoutDays(){
  return [...new Set((S.closeouts||[]).map(c => c && c.day).filter(Boolean))];
}
function activeDays(){
  const fromRounds = Object.keys(S.rounds||{}).filter(d => Object.values((S.rounds[d]||{}).wards||{}).some(isDone));
  const days = [...new Set(fromRounds.concat(closeoutDays()))].sort();
  return days;
}
// Streak of working days in a row. Weekends never break it.
function onlyWeekendBetween(a, b){
  for (let d = addDays(a,1); d < b; d = addDays(d,1)){ const w = dowOf(d); if (w!==0 && w!==6) return false; }
  return true;
}
function streakDays(){
  const days = activeDays();
  if (!days.length) return 0;
  const today = zonedNow().iso;
  let cur = days[days.length-1];
  if (cur !== today && !onlyWeekendBetween(cur, today)) return 0;
  let n = 1;
  for (let i = days.length-2; i >= 0; i--){
    if (onlyWeekendBetween(days[i], cur)){ n++; cur = days[i]; } else break;
  }
  return n;
}
function totalWardsDone(){
  let n = 0;
  Object.values(S.rounds||{}).forEach(r => Object.values(r.wards||{}).forEach(e => { if (isDone(e)) n++; }));
  return n;
}
function runKey(iso, siteId){ return iso + "|" + siteId; }
function runFor(iso, siteId){
  const k = runKey(iso, siteId);
  if (!G.runs[k]) G.runs[k] = {start:0, end:0, ms:0, complete:false};
  return G.runs[k];
}
function touchRun(siteId){
  const run = runFor(zonedNow().iso, siteId);
  if (!run.start && !run.complete){ run.start = Date.now(); gSave(); }
}
function siteProgress(siteId, iso){
  const day = iso || zonedNow().iso;
  const r = S.rounds[day];
  const wards = scheduledWards(siteId, day);
  const done = wards.filter(w => r && isDone(r.wards[w.id])).length;
  return {done, total:wards.length};
}
function fmtDur(ms){
  if (!ms || ms < 0) return "—";
  const m = Math.round(ms/60000);
  if (m < 1) return "<1m";
  if (m < 60) return m + "m";
  return Math.floor(m/60) + "h " + String(m%60).padStart(2,"0") + "m";
}
function award(id){
  if (G.badges[id]) return null;
  G.badges[id] = zonedNow().iso;
  return BADGES.find(b => b.id===id) || null;
}

/* ---- feedback: sound, vibration, floating XP, confetti, banner ---- */
function sfx(kind){
  if (!G || !G.sound) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const notes = kind==="win" ? [660,880,1100,1320] : kind==="done" ? [740,1110] : kind==="lucky" ? [990,1320,990,1320] : [1200];
    const step = kind==="tick" ? 0 : 0.09;
    notes.forEach((f,i) => {
      const t = audioCtx.currentTime + i*step;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = kind==="tick" ? "square" : "triangle";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(kind==="tick"?0.025:0.06, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==="tick"?0.05:0.18));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+0.2);
    });
  }catch(e){}
}
function hapticOn(){ return !G || G.haptic!==false; }
function buzz(p){
  if (!hapticOn()) return;
  try{ if (navigator.vibrate) navigator.vibrate(typeof p==="number" ? p : (p||12)); }catch(e){}
}
function floatText(text, cls){
  const layer = document.getElementById("pops");
  if (!layer) return;
  const el = document.createElement("div");
  el.className = "pop" + (cls ? " "+cls : "");
  el.textContent = text;
  const x = lastTap ? lastTap.x : window.innerWidth/2;
  const y = lastTap ? lastTap.y : window.innerHeight/2;
  el.style.left = Math.max(60, Math.min(window.innerWidth-60, x)) + "px";
  el.style.top = Math.max(80, y) + "px";
  layer.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}
function confetti(){
  if (REDUCED) return;
  const cv = document.getElementById("fx");
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = window.innerWidth*dpr; cv.height = window.innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ["#f59e0b","#ec4899","#7c3aed","#0d9488","#22c55e","#3b82f6","#fde047"];
  const W = window.innerWidth, H = window.innerHeight;
  const parts = Array.from({length:140}, () => ({
    x: W/2 + (Math.random()-.5)*60, y: H*0.3,
    vx: (Math.random()-.5)*12, vy: -Math.random()*11-4,
    r: 4+Math.random()*5, c: cols[Math.floor(Math.random()*cols.length)],
    a: Math.random()*6.28, va: (Math.random()-.5)*.3
  }));
  const t0 = performance.now();
  (function frame(t){
    const el = t - t0;
    ctx.clearRect(0,0,W,H);
    parts.forEach(p => {
      p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.globalAlpha = Math.max(0, 1 - el/2400);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore();
    });
    if (el < 2400) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })(t0);
}
let celebrateTimer = 0;
function celebrate(icon, title, sub){
  const el = document.getElementById("celebrate");
  if (!el) return;
  el.innerHTML = `<div class="big" aria-hidden="true">${esc(icon)}</div><h2>${esc(title)}</h2><p>${esc(sub||"")}</p><button type="button" data-act="celebrate-close">Nice!</button>`;
  el.classList.add("show");
  clearTimeout(celebrateTimer);
  celebrateTimer = setTimeout(() => el.classList.remove("show"), 4500);
}
function afterXpChange(){
  const info = levelInfo(totalXp());
  const queue = [];
  if (info.level > (G.lastLevel||1)){
    queue.push(["⭐","Level " + info.level + "!", "You're now a " + info.title + "."]);
    if (info.level >= 5){ const b = award("level-5"); if (b) queue.push([b.ic, "Badge: " + b.name, b.how]); }
  }
  G.lastLevel = Math.max(G.lastLevel||1, info.level);
  const s = streakDays();
  if (s > (G.bestStreak||0)) G.bestStreak = s;
  if (s >= 3){ const b = award("on-fire"); if (b) queue.push([b.ic, "Badge: " + b.name, s + " days in a row."]); }
  if (s >= 10){ const b = award("week-warrior"); if (b) queue.push([b.ic, "Badge: " + b.name, s + " days in a row."]); }
  if (totalWardsDone() >= 100){ const b = award("century"); if (b) queue.push([b.ic, "Badge: " + b.name, b.how + "."]); }
  gSave();
  return queue;
}
function playQueue(queue, delay){
  queue.forEach((q,i) => setTimeout(() => celebrate(q[0], q[1], q[2]), (delay||0) + i*2600));
}

/* ---- game hooks called from the stock actions ---- */
function gameWardDone(wid){
  const w = wardById(wid); if (!w) return;
  const iso = zonedNow().iso;
  const e = S.rounds[iso] && S.rounds[iso].wards[wid];
  if (!isDone(e)) return;
  let gain = wardXp(e);
  const queue = [];
  const lk = "lucky|" + iso + "|" + wid;
  if (!(lk in G.bonus)){
    const lucky = Math.random() < 0.12;
    G.bonus[lk] = lucky ? gain : 0;
    if (lucky){
      gain *= 2;
      const b = award("lucky-star");
      setTimeout(() => { floatText("🍀 LUCKY 2×!", "gold"); sfx("lucky"); }, 350);
      if (b) queue.push([b.ic, "Badge: " + b.name, "Lucky ward, double XP!"]);
    }
  }
  floatText("+" + gain + " XP");
  sfx("done"); buzz([12,40,18]);
  { const b = award("first-ward"); if (b) queue.push([b.ic, "Badge: " + b.name, "First ward done. Keep rolling!"]); }
  // Full round?
  const p = siteProgress(w.siteId);
  const run = runFor(iso, w.siteId);
  if (p.total && p.done===p.total && !run.complete){
    run.complete = true;
    run.end = Date.now();
    run.ms = run.start ? run.end - run.start : 0;
    const site = siteById(w.siteId);
    G.bonus["full|" + iso + "|" + w.siteId] = XP_FULL;
    const streak = streakDays();
    const sb = Math.min(50, 5*streak);
    if (sb) G.bonus["streak|" + iso + "|" + w.siteId] = sb;
    let sub = (site?site.name+" · ":"") + "+" + (XP_FULL+sb) + " XP" + (sb?" (incl. "+streak+"-day streak)":"");
    const prev = G.best[w.siteId];
    if (run.ms > 0){
      sub += " · " + fmtDur(run.ms);
      if (prev && run.ms < prev){
        G.bonus["pb|" + iso + "|" + w.siteId] = XP_PB;
        sub += " · NEW BEST! +" + XP_PB;
        const b = award("speed-runner"); if (b) queue.push([b.ic, "Badge: " + b.name, "Beat your best by " + fmtDur(prev-run.ms) + "."]);
      }
      if (!prev || run.ms < prev) G.best[w.siteId] = run.ms;
    }
    const fr = award("full-round");
    queue.unshift(["🏆","Round complete!", sub]);
    if (fr) queue.push([fr.ic, "Badge: " + fr.name, fr.how + "."]);
    const fullSites = new Set(Object.keys(G.runs).filter(k => G.runs[k].complete).map(k => k.split("|")[1]));
    if (fullSites.size >= 2){ const b = award("both-sites"); if (b) queue.push([b.ic, "Badge: " + b.name, b.how + "."]); }
    setTimeout(() => { confetti(); sfx("win"); buzz([30,60,30,60,80]); }, 150);
  }
  gSave();
  playQueue(queue.concat(afterXpChange()), 300);
}
function gameOrderSent(z, siteId){
  const k = z.iso + "|" + siteId;
  const queue = [];
  if (!(("order|" + k) in G.bonus)){
    G.bonus["order|" + k] = XP_ORDER;
    let gain = XP_ORDER;
    if (isOrderDay(z) && beforeCutoff(z)){
      G.bonus["early|" + k] = XP_ORDER_EARLY; gain += XP_ORDER_EARLY;
      const b = award("order-ace"); if (b) queue.push([b.ic, "Badge: " + b.name, "Order in before the cut-off."]);
    }
    floatText("+" + gain + " XP");
    sfx("done"); buzz([12,40,18]);
  }
  gSave();
  playQueue(queue.concat(afterXpChange()), 300);
}

/* ---- views ---- */
function ringSvg(done, total){
  const R = 40, C = 2*Math.PI*R;
  const pct = total ? done/total : 0;
  return `<svg viewBox="0 0 96 96" aria-hidden="true">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
    <circle cx="48" cy="48" r="${R}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10"/>
    <circle class="fg" cx="48" cy="48" r="${R}" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}"/></svg>`;
}
function renderHero(z){
  const sid = currentSiteId();
  const p = siteProgress(sid);
  const status = (p.total && p.done===p.total)
    ? "Round done"
    : (p.total - p.done) + " ward" + (p.total-p.done===1?"":"s") + " to go";
  return `<section class="hero" aria-label="Today's progress">
    <div class="ring" role="img" aria-label="${p.done} of ${p.total} wards done">${ringSvg(p.done, p.total)}
      <div class="rt"><b>${p.done}/${p.total}</b><span>wards</span></div></div>
    <div class="grow">
      <div class="hs">${esc(status)}</div>
      <div class="streakchip" title="Days with a finished round or a close-out. Weekends do not break the streak.">${streakDays()||0} day streak</div>
    </div>
  </section>`;
}
function renderTrophies(z){
  const xp = totalXp();
  const info = levelInfo(xp);
  const got = BADGES.filter(b => G.badges[b.id]).length;
  const bestLines = S.sites.map(s => `${esc(s.name)} ${esc(fmtDur(G.best[s.id]))}`).join(" · ");
  const shelf = BADGES.map(b => {
    const on = !!G.badges[b.id];
    return `<div class="trophy${on?" got":""}" title="${esc(b.how)}"><div class="ic" aria-hidden="true">${b.ic}</div><b>${esc(b.name)}</b><small>${on?esc(shortDate(G.badges[b.id])):esc(b.how)}</small></div>`;

  return `${renderHero(z)}
    <div class="card"><h2>Your stats</h2>
      <div class="statgrid">
        <div class="stat"><b>${xp}</b><span>Total XP · Lv ${info.level}</span></div>
        <div class="stat"><b>${streakDays()}🔥</b><span>Streak (best ${Math.max(G.bestStreak||0, streakDays())})</span></div>
        <div class="stat"><b>${totalWardsDone()}</b><span>Wards done, all time</span></div>
        <div class="stat"><b>${Object.values(G.runs).filter(r=>r.complete).length}</b><span>Full rounds (45 days)</span></div>
      </div>
      <p class="muted" style="margin:8px 0 0">Best round time: ${bestLines}. Weekends don't break your streak.</p>
    </div>
    <div class="card"><h2>Trophy shelf <span class="chip xp">${got}/${BADGES.length}</span></h2><div class="shelf">${shelf}</div></div>`;

/* ===== v1.2.0 stocktake: barcode scan, variance, manager export ===== */
const BSTORE = "ward-run-barcodes-v1";
function bLoad(){
  try{
    const o = JSON.parse(localStorage.getItem(BSTORE)||"{}");
    if (!o || typeof o!=="object") return {map:{}, at:{}, gone:{}};
    if (!o.map || typeof o.map!=="object") o.map = {};
    if (!o.at || typeof o.at!=="object") o.at = {};
    if (!o.gone || typeof o.gone!=="object") o.gone = {};
    return o;
  }catch(e){ return {map:{}, at:{}, gone:{}}; }
}
function bSave(o){ try{ localStorage.setItem(BSTORE, JSON.stringify(o||bLoad())); }catch(e){} }
function shareTouchBarcode(raw){
  if (shareApplying) return;
  const key = String(raw||"").trim();
  if (!key) return;
  const sh = ensureShare();
  sh.barcodeAt[key] = shareNow();
  sh.status = navigator.onLine ? "pending" : "offline";
}
function linkBarcode(raw, codeId, replace){
  const key = String(raw||"").trim();
  if (!key || !codeId) return false;
  const o = bLoad();
  const prev = o.map[key];
  if (prev && prev!==codeId && !replace) return false;
  if (prev===codeId && o.at[key]) return true;
  o.map[key] = codeId;
  o.at[key] = shareNow();
  if (o.gone) delete o.gone[key];
  bSave(o);
  shareTouchBarcode(key);
  return true;
}
function applyRemoteBarcode(row){
  const key = String((row && (row.barcode||row.code))||"").trim();
  if (!key) return false;
  const sh = ensureShare();
  if (!tsNewer(row.updated_at, sh.barcodeAt[key] || (bLoad().at||{})[key])) {
    shareRemoteAt.barcodes[key] = row.updated_at;
    return false;
  }
  /* Merge only. Never wipe other local links. A remote delete does not remove a local link. */
  if (row.deleted){
    sh.barcodeAt[key] = row.updated_at;
    shareRemoteAt.barcodes[key] = row.updated_at;
    return false;
  }
  const codeId = row.code_id;
  if (!codeId) return false;
  const o = bLoad();
  const prev = o.map[key];
  if (prev===codeId){
    o.at[key] = row.updated_at;
    bSave(o);
    sh.barcodeAt[key] = row.updated_at;
    shareRemoteAt.barcodes[key] = row.updated_at;
    return false;
  }
  /* If we already have a different local link and it is newer, keep local. */
  if (prev && tsNewer(o.at[key], row.updated_at)) {
    shareRemoteAt.barcodes[key] = row.updated_at;
    return false;
  }
  o.map[key] = codeId;
  o.at[key] = row.updated_at;
  bSave(o);
  sh.barcodeAt[key] = row.updated_at;
  shareRemoteAt.barcodes[key] = row.updated_at;
  return true;
}
function collectPushBarcodes(){
  const sh = ensureShare();
  const o = bLoad();
  const rows = [];
  Object.keys(sh.barcodeAt||{}).forEach(key => {
    const codeId = o.map[key];
    if (!codeId) return;
    const c = codeById(codeId);
    rows.push({
      barcode: key,
      code_id: codeId,
      site_id: (c && c.siteId) || currentSiteId(),
      deleted: false,
      updated_at: sh.barcodeAt[key] || o.at[key] || shareNow(),
      device_id: sh.deviceId,
      actor: staffName()||null
    });
  });
  return rows;
}
function gerardCatalogueCodes(){
  /* Gerard's lists only. Never include the hidden Prabin area. */
  const sites = [SITE_POW, SITE_CH];
  const out = [];
  const seen = new Set();
  sites.forEach(sid => {
    siteCodes(sid).forEach(c => {
      if (!c || c.tickOnly || seen.has(c.id)) return;
      seen.add(c.id);
      out.push(c);
    });
  });
  return out;
}
function linkedCodeIds(){
  const ids = new Set(Object.values(bLoad().map||{}));
  return ids;
}
function missingBarcodeCodes(){
  const have = linkedCodeIds();
  return gerardCatalogueCodes().filter(c => !have.has(c.id));
}

function loadVendor(src, globalName){
  if (window[globalName]) return Promise.resolve(window[globalName]);
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => window[globalName] ? resolve(window[globalName]) : reject(new Error("load"));
    s.onerror = () => reject(new Error("load"));
    document.head.appendChild(s);
  });
}

/* Match a scanned value to this site's codes: saved link, exact, then contains. */
function matchScan(raw, siteId){
  const val = String(raw||"").trim();
  const up = val.toUpperCase();
  const digits = val.replace(/\D+/g,"");
  const list = siteCodes(siteId);
  const linked = bLoad().map[val];
  if (linked){ const c = list.find(x => x.id===linked); if (c) return {code:c, how:"saved"}; }
  const exact = list.filter(c => !c.tickOnly && c.code && (String(c.code).toUpperCase()===up || bareProductCode(c.code)===bareProductCode(up)));
  if (exact.length===1) return {code:exact[0], how:"exact"};
  if (exact.length>1) return {candidates:exact};
  const contains = list.filter(c => {
    if (c.tickOnly || !c.code) return false;
    const code = String(c.code).toUpperCase(), bare = bareProductCode(code);
    if (code.length>=4 && up.includes(code)) return true;
    if (/^\d{4,}$/.test(bare) && digits.includes(bare)) return true;
    return false;
  });
  if (contains.length===1) return {code:contains[0], how:"contains"};
  return {candidates:contains};
}

/* Decode one still image (photo or test image). */
async function decodeImageFile(file){
  const url = URL.createObjectURL(file);
  try{
    if ("BarcodeDetector" in window){
      try{
        const img = new Image(); img.src = url; await img.decode();
        const found = await new window.BarcodeDetector().detect(img);
        if (found && found.length) return found[0].rawValue;
      }catch(e){}
    }
    const Z = await loadVendor("vendor/zxing.min.js", "ZXing");
    const hints = new Map();
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.BrowserMultiFormatReader(hints);
    const res = await reader.decodeFromImageUrl(url);
    return res ? res.getText() : "";
  }finally{
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
}

async function startCamera(done){
  const sess = {stopped:false};
  scanSession = sess;
  const video = document.getElementById("scan-video");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    scanStatus("Camera not available here. Use Photo of barcode or Type code.");
    return;
  }
  let useNative = false;
  if ("BarcodeDetector" in window){
    try{
      const fm = window.BarcodeDetector.getSupportedFormats ? await window.BarcodeDetector.getSupportedFormats() : ["code_128"];
      useNative = fm && fm.length > 0;
    }catch(e){ useNative = false; }
  }
  try{
    if (useNative){
      sess.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false});
      if (sess.stopped){ sess.stream.getTracks().forEach(t=>t.stop()); return; }
      video.srcObject = sess.stream;
      await video.play().catch(()=>{});
      scanStatus("Point at the barcode. It scans by itself.");
      const det = new window.BarcodeDetector();
      const tick = async () => {
        if (sess.stopped) return;
        try{
          if (video.readyState >= 2){
            const found = await det.detect(video);
            if (found && found.length && found[0].rawValue){ done(found[0].rawValue); return; }
          }
        }catch(e){}
        sess.timer = setTimeout(tick, 180);
      };
      tick();
    } else {
      scanStatus("Loading scanner…");
      const Z = await loadVendor("vendor/zxing.min.js", "ZXing");
      if (sess.stopped) return;
      const hints = new Map();
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      sess.reader = new Z.BrowserMultiFormatReader(hints, 200);
      scanStatus("Point at the barcode. It scans by itself.");
      await sess.reader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}, audio:false}, video, (res) => {
        if (res && !sess.stopped) done(res.getText());
      });
    }
  }catch(e){
    scanStatus("Camera blocked or not found. Use Photo of barcode or Type code.");
  }
}

/* ---- variance ---- */
function stockVariance(c){
  const par = Number(c.par)||0, n = Number(c.stock)||0;
  if (par <= 0) return {status:"nopar", diff:0, expected:null, counted:n};
  const diff = n - par;
  return {status: diff<0 ? "short" : diff>0 ? "over" : "ok", diff, expected:par, counted:n};
}
function usualQty(wid, cid, beforeIso){
  let sum = 0, k = 0;
  Object.values(S.rounds).forEach(r => {
    if (r.date >= beforeIso) return;
    const e = (r.wards||{})[wid];
    const l = e && (e.lines||[]).find(x => x.codeId===cid);
    const q = l ? qtyNum(l.qty) : null;
    if (q!=null){ sum += q; k++; }
  });
  return k ? Math.round(sum/k) : null;
}
function lineVariance(wid, line, iso){
  const exp = usualQty(wid, line.codeId, iso);
  const n = qtyNum(line.qty);
  if (exp==null || n==null) return {status:"nopar", diff:0, expected:exp, counted:n};
  const diff = n - exp;
  return {status: diff<0 ? "short" : diff>0 ? "over" : "ok", diff, expected:exp, counted:n};
}
function signed(n){ return (n>0?"+":n<0?"−":"±") + Math.abs(n); }
function varChip(v, kind){
  if (v.status==="nopar") return kind==="ward" ? "" : `<span class="var nopar">No par</span>`;
  const label = v.status==="short" ? "Short" : v.status==="over" ? "Over" : "OK";
  const ref = kind==="ward" ? "usual " + v.expected : "par " + v.expected;
  return `<span class="var ${v.status}">${label}${v.status==="ok"?"":" "+signed(v.diff)}<small> · ${esc(ref)}</small></span>`;
}
function statusWord(v, kind){
  if (v.status==="nopar") return kind==="ward" ? "No history" : "No par";
  return v.status==="short" ? "Short" : v.status==="over" ? "Over" : "OK";
}
function varianceSummary(siteId, iso){
  const store = {short:0, over:0, ok:0, nopar:0, shortUnits:0, overUnits:0};
  siteCodes(siteId).forEach(c => {
    const v = stockVariance(c);
    store[v.status]++;
    if (v.status==="short") store.shortUnits += -v.diff;
    if (v.status==="over") store.overUnits += v.diff;
  });
  const r = S.rounds[iso];
  const wards = S.wards.filter(w => w.siteId===siteId && w.enabled).sort((a,b)=>a.order-b.order).map(w => {
    const e = r && r.wards[w.id];
    const t = {ward:w, short:0, over:0, ok:0, nohist:0, lines:0};
    ((e&&e.lines)||[]).forEach(l => {
      if (!codeById(l.codeId)) return;
      t.lines++;
      const v = lineVariance(w.id, l, iso);
      if (v.status==="nopar") t.nohist++; else t[v.status]++;
    });
    return t;
  }).filter(t => t.lines);
  return {store, wards};
}

function wardFromDef(def, i, siteId, enabled){

  if (w.onCall) w.days = [];
  else if (def.days) w.days = def.days.slice();
  else if (siteId===SITE_POW || siteId===SITE_PRABIN) w.days = [2,4];

}
function applyPowDef(w, def, i){

  w.name = def.name;
  w.order = i;
  w.siteId = SITE_POW;
  w.building = def.building||"";
  w.notes = def.notes||"";
  w.onCall = !!def.onCall;
  w.days = w.onCall ? [] : (def.days ? def.days.slice() : [2,4]);

function isPowPlaceholder(w){

function wardIsOnCall(w){ return !!(w && w.onCall); }
function wardScheduledOn(w, dow){
  if (!w || w.enabled===false) return false;

function fmtDays(w){
  if (!w) return "";
  if (w.onCall) return "On call";
  if (!Array.isArray(w.days)) return "Every day";
  if (!w.days.length) return "Not scheduled";
  if (w.days.length===3 && w.days[0]===1 && w.days[1]===3 && w.days[2]===5) return "Mon, Wed, Fri";

function buildingRank(name){

function remapCodeId(s, idMap){

  };
  Object.values(s.rounds||{}).forEach(round => {
    Object.values((round && round.wards)||{}).forEach(entry => {
      (entry.lines||[]).forEach(touchLine);
    });
  });
  (s.orders||[]).forEach(o => (o.lines||[]).forEach(touchLine));
  if (s.draftOrder && Array.isArray(s.draftOrder.lines)) s.draftOrder.lines.forEach(touchLine);
  if (s.undoMove){
    (s.undoMove.items||[]).forEach(touchLine);
    (s.undoMove.dest||[]).forEach(d => { if (d && idMap.has(d.codeId)) d.codeId = idMap.get(d.codeId); });
  }
  Object.keys(s.trolley||{}).forEach(day => {
    const bag = s.trolley[day];
    if (!bag || typeof bag!=="object") return;
    Object.keys(bag).forEach(key => {
      const parts = String(key).split("|");
      if (parts.length===3 && idMap.has(parts[2])){
        const nk = parts[0]+"|"+parts[1]+"|"+idMap.get(parts[2]);
        if (bag[nk]==null) bag[nk] = bag[key];
        delete bag[key];
      }
    });
  });
  try{
    const o = bLoad();
    let changed = false;
    Object.keys(o.map||{}).forEach(k => {
      const v = o.map[k];
      if (idMap.has(v)){ o.map[k] = idMap.get(v); changed = true; }
    });
    if (changed) bSave(o);
  }catch(e){}
}

function renamePlain1306(s){
  if (s.codeRename1306a === 1) return;
  const codes = s.codes||[];
  const olds = codes.filter(c => !c.tickOnly && isExactPlainCode(c.code, "1306"));
  const news = codes.filter(c => !c.tickOnly && isExactPlainCode(c.code, "1306a"));
  if (olds.length && news.length){
    s.codeRename1306a = "conflict";
    return;
  }
  if (!olds.length){
    s.codeRename1306a = 1;
    return;
  }
  const idMap = new Map();
  olds.forEach(c => {
    const oldId = c.id;
    c.code = "1306a";
    if (oldId === "c-1306" && !codes.some(x => x.id === "c-1306a")) c.id = "c-1306a";
    if (oldId && c.id !== oldId) idMap.set(oldId, c.id);
  });
  remapCodeId(s, idMap);
  (s.rounds ? Object.values(s.rounds) : []).forEach(round => {
    Object.values((round && round.wards)||{}).forEach(entry => {
      (entry.lines||[]).forEach(line => {
        if (isExactPlainCode(line.code, "1306")) line.code = "1306a";
      });
    });
  });
  s.codeRename1306a = 1;
}

function migrate(s){
  if (!s.sites) s.sites = [];
  if (!s.wards) s.wards = [];
  if (!s.codes) s.codes = [];
  if (!s.rounds) s.rounds = {};
  if (!s.orders) s.orders = [];
  if (!s.trolley) s.trolley = {};
  if (!s.trolleyLoad) s.trolleyLoad = {};
  if (!s.settings) s.settings = {};
  const st = s.settings;
  if (st.partnerName == null) st.partnerName = "";
  if (st.waNumber == null) st.waNumber = "";
  if (!st.orderWeekdays) st.orderWeekdays = [2,4];
  if (st.orderHour == null) st.orderHour = 11;

  if (!siteExists(s, SITE_POW)) s.sites.push({id:SITE_POW, name:"POW"});
  else {
    const pow = s.sites.find(x => x.id===SITE_POW);
    if (pow && (!pow.name || pow.name==="Main")) pow.name = "POW";
  }
  if (!siteExists(s, SITE_CH)) s.sites.push({id:SITE_CH, name:"Children's"});
  else {
    const ch = s.sites.find(x => x.id===SITE_CH);
    if (ch && !ch.name) ch.name = "Children's";
  }
  const powS = s.sites.find(x => x.id===SITE_POW);
  const chS = s.sites.find(x => x.id===SITE_CH);
  const rest = s.sites.filter(x => x.id!==SITE_POW && x.id!==SITE_CH && x.id!=="s-main");
  s.sites = [powS, chS, ...rest].filter(Boolean);

  const chIds = new Set(CH_WARD_DEFS.concat(CH_EXTRA_WARDS).map(w => w.id));
  const chNames = new Set(CH_WARD_DEFS.concat(CH_EXTRA_WARDS).map(w => w.name.toLowerCase()));
  Object.keys(CH_RENAME).forEach(k => chNames.add(k.toLowerCase()));
  chNames.add("rec 2 room a"); chNames.add("rec 2 room b");

  s.wards.forEach((w,i) => {
    if (w.order == null) w.order = i;
    if (w.enabled == null) w.enabled = true;
    if (CH_RENAME[w.name]) w.name = CH_RENAME[w.name];
    if (isOt2Name(w.name)) w.enabled = false;
    if (!w.siteId || w.siteId==="s-main" || !siteExists(s, w.siteId)){
      w.siteId = SITE_CH;
    }
  });
  s.orders.forEach(o => {
    if (!o.siteId || o.siteId==="s-main") o.siteId = SITE_CH;
  });

  const haveId = new Set(s.wards.map(w => w.id));
  const haveName = new Set(s.wards.filter(w => w.siteId===SITE_CH).map(w => String(w.name||"").toLowerCase()));
  CH_WARD_DEFS.forEach((def, i) => {
    if (isOt2Name(def.name)) return;
    const exists = haveId.has(def.id) || haveName.has(def.name.toLowerCase());
    if (exists){
      const w = s.wards.find(x => x.id===def.id) || s.wards.find(x => x.siteId===SITE_CH && String(x.name).toLowerCase()===def.name.toLowerCase());
      if (w && w.siteId!==SITE_CH) w.siteId = SITE_CH;
      return;
    }
    s.wards.push({id:def.id, name:def.name, order:i, siteId:SITE_CH, enabled:!isRetiredWard(def)});
    haveId.add(def.id); haveName.add(def.name.toLowerCase());
  });
  CH_EXTRA_WARDS.forEach((def, i) => {
    if (haveId.has(def.id) || haveName.has(def.name.toLowerCase())) return;
    s.wards.push({id:def.id, name:def.name, order:CH_WARD_DEFS.length+i, siteId:SITE_CH, enabled:false});
  });
  const chIndex = Object.fromEntries(CH_WARD_DEFS.concat(CH_EXTRA_WARDS).map((w,i)=>[w.id,i]));
  const chByName = Object.fromEntries(CH_WARD_DEFS.concat(CH_EXTRA_WARDS).map((w,i)=>[w.name.toLowerCase(),i]));
  Object.keys(CH_RENAME).forEach(k => { chByName[k.toLowerCase()] = chByName[CH_RENAME[k].toLowerCase()]; });
  const chWards = s.wards.filter(w => w.siteId===SITE_CH);
  const known = chWards.filter(w => chIndex[w.id]!=null || chByName[String(w.name||"").toLowerCase()]!=null)
    .sort((a,b) => (chIndex[a.id]??chByName[String(a.name||"").toLowerCase()]??99) - (chIndex[b.id]??chByName[String(b.name||"").toLowerCase()]??99));
  const unknown = chWards.filter(w => !known.includes(w)).sort((a,b)=>a.order-b.order);
  known.concat(unknown).forEach((w,i) => { w.order = i; });
  const chSeed = Number(s.chRetiredSeed)||0;
  if (chSeed < 2){
    s.wards.forEach(w => {
      if (CH_RESTORE_IDS.includes(w.id) || ["rec 2 station","rec 2 room a","rec 2 room b"].includes(String(w.name||"").toLowerCase().replace(/\s+/g," ").trim())){
        w.enabled = true;
      }
    });
    s.chRetiredSeed = 2;
  }
  s.wards.forEach(w => { if (isRetiredWard(w)) w.enabled = false; });

  const seed = Number(s.powWardSeed)||0;
  if (seed < POW_WARD_SEED){
    s.wards.forEach(w => {
      if (w.siteId===SITE_POW && isPowPlaceholder(w)) w.enabled = false;
    });
    const haveId = new Set(s.wards.map(w => w.id));
    POW_WARD_DEFS.forEach((def,i) => {
      let w = s.wards.find(x => x.id===def.id);
      if (!w){
        s.wards.push(wardFromDef(def,i,SITE_POW,true));
        haveId.add(def.id);
      } else {
        applyPowDef(w, def, i);
        if (w.enabled == null) w.enabled = true;
      }
    });
    s.powWardSeed = POW_WARD_SEED;
  }
  const powOfficial = new Set(POW_WARD_DEFS.map(d => d.id));
  const powKnown = s.wards.filter(w => w.siteId===SITE_POW && powOfficial.has(w.id))
    .sort((a,b) => (POW_WARD_DEFS.findIndex(d => d.id===a.id)) - (POW_WARD_DEFS.findIndex(d => d.id===b.id)));
  const powRest = s.wards.filter(w => w.siteId===SITE_POW && !powOfficial.has(w.id)).sort((a,b)=>(a.order||0)-(b.order||0));
  powKnown.concat(powRest).forEach((w,i) => { w.order = i; });
  s.wards.forEach(w => {
    if (w.building == null) w.building = "";
    if (w.notes == null) w.notes = "";
    if (w.privateNote == null) w.privateNote = "";
    if (w.onCall == null) w.onCall = false;
  });

  s.sites = s.sites.filter(x => x.id!=="s-main");

  s.codes.forEach(c => {
    if (c.par == null) c.par = 0;
    if (c.stock == null) c.stock = 0;
    if (c.name == null) c.name = "";
    if (c.note == null) c.note = "";
    if (c.kcl == null) c.kcl = false;
    if (c.tickOnly == null) c.tickOnly = !String(c.code||"").trim() && !!c.name;
    if (c.seed == null) c.seed = 0;
    if (!c.unit || c.unit==="EA" || c.unit==="ea") c.unit = "box";
    if (!c.siteId || c.siteId==="s-main") c.siteId = SITE_CH;
  });

  const seedAt = Object.fromEntries(CH_SEED.map((c,i)=>[c, CH_SEED.length-i]));
  renamePlain1306(s);
  CH_CODES.forEach(code => {
    let c = findSiteCode(s, SITE_CH, code);
    if (!c){
      c = {id:"c-"+code, code, name:powNameFor(code), note:"", kcl:false, tickOnly:false, unit:"box", par:0, stock:0, siteId:SITE_CH, seed:seedAt[code]||0};
      s.codes.push(c);
    } else {
      if (!c.name) c.name = powNameFor(code);
      if (seedAt[code] && !c.seed) c.seed = seedAt[code];
      if (bareProductCode(c.code)===code && c.code.toUpperCase()!==code) c.code = code;
    }
  });
  applyOfficialNames(s);
  CH_TICKS.forEach(name => {
    let c = findTick(s, SITE_CH, name);
    if (!c){
      s.codes.push({id:"c-"+slug(name), code:"", name, note:"", kcl:false, tickOnly:true, unit:"box", par:0, stock:0, siteId:SITE_CH, seed:0});
    } else {
      c.tickOnly = true;
      c.name = name;
      if (c.code && c.code.toLowerCase()===name.toLowerCase()) c.code = "";
    }
  });
  POW_CATALOG.forEach(p => {
    let c = findSiteCode(s, SITE_POW, p.code);
    if (!c){
      s.codes.push({id:"c-pow-"+p.code, code:p.code, name:p.name||"", note:p.note||"", kcl:!!p.kcl, tickOnly:false, unit:"box", par:0, stock:0, siteId:SITE_POW, seed:0});
    } else {
      if (!c.name) c.name = p.name||"";
      if (p.note && !c.note) c.note = p.note;
      if (p.kcl) c.kcl = true;
    }
  });

  Object.values(s.rounds).forEach(round => {
    Object.entries(round.wards||{}).forEach(([wid, entry]) => {
      const w = (s.wards||[]).find(x => x.id===wid);
      if (w && !entry.siteId) entry.siteId = w.siteId;
      (entry.lines||[]).forEach(line => {
        if (!line.unit || line.unit==="EA") line.unit = "box";
        const c = (s.codes||[]).find(x => x.id===line.codeId);
        if (c){
          if (!line.code) line.code = displayCode(c);
          if (line.name==null || line.name==="") line.name = c.name||"";
        }
      });
    });
  });
  (s.orders||[]).forEach(o => {
    (o.lines||[]).forEach(line => {
      if (!line.unit || line.unit==="EA") line.unit = "box";
    });
  });

  if (!st.currentSiteId || st.currentSiteId==="s-main" || !siteExists(s, st.currentSiteId)){
    st.currentSiteId = SITE_CH;
  }
  if (!s.stockDraft || typeof s.stockDraft!=="object") s.stockDraft = {};
  if (!s.stocktake || typeof s.stocktake!=="object") s.stocktake = {};
  if (!Array.isArray(s.stockDeliveries)) s.stockDeliveries = [];
  if (!s.stockRestored || typeof s.stockRestored!=="object") s.stockRestored = {};
  if (!s.stockDeliveryDraft || typeof s.stockDeliveryDraft!=="object") s.stockDeliveryDraft = {};
  if (st.staffName == null) st.staffName = "";
  initStocktakeFromExisting(s);
  if (!s.stars || typeof s.stars!=="object") s.stars = {};
  if (!Array.isArray(s.closeouts)) s.closeouts = [];
  if (!Array.isArray(s.spotChecks)) s.spotChecks = [];
  if (s.settings && s.settings.showPrabinArea == null) s.settings.showPrabinArea = false;
  seedPrabinArea(s);
  ensureShare(s);
  shareSeedLocal(s);
  (function seedBarcodes(s){
    const sh = ensureShare(s);
    if (sh.barcodesSeeded) return;
    const o = bLoad();
    Object.keys(o.map||{}).forEach(k => {
      if (!sh.barcodeAt[k]) sh.barcodeAt[k] = o.at[k] || shareNow();
    });
    sh.barcodesSeeded = true;
  })(s);
  s.version = Math.max(Number(s.version)||1, 2);
  s.appVersion = VERSION;
}

  if (!sh.status) sh.status = navigator.onLine ? "pending" : "offline";

function shareSeedLocal(s){
  const sh = ensureShare(s);
  if (sh.seeded) return;
  const at = shareNow();
  Object.keys(s.trolley||{}).forEach(day => {
    Object.keys(s.trolley[day]||{}).forEach(key => {
      if (!s.trolley[day][key]) return;
      const parts = String(key).split("|");
      if (parts.length<3) return;
      sh.tickAt[parts[0]+"|"+parts[1]+"|"+parts[2]] = at;
    });
  });
  Object.keys(s.rounds||{}).forEach(day => {
    const wards = (s.rounds[day]||{}).wards||{};
    Object.keys(wards).forEach(wid => {
      const e = wards[wid];
      sh.wardAt[day+"|"+wid] = e && e.savedAt || at;
      (e.lines||[]).forEach(l => {
        if (!l || !l.codeId) return;
        sh.lineAt[day+"|"+wid+"|"+l.codeId] = at;
      });
    });
  });
  Object.keys(s.stocktake||{}).forEach(siteId => {
    const st = s.stocktake[siteId];
    if (!st || !st.savedAt) return;
    sh.stockAt[siteId] = st.savedAt;
    Object.keys(st.baseline||{}).forEach(cid => { sh.baselineAt[siteId+"|"+cid] = st.savedAt; });
    Object.keys(st.tickedAtSave||{}).forEach(k => { sh.tickedSaveAt[siteId+"|"+k] = st.savedAt; });
  });
  (s.stockDeliveries||[]).forEach(d => {
    if (d && d.id) sh.deliveryAt[d.id] = d.addedAt || at;
  });
  Object.keys(s.stockRestored||{}).forEach(siteId => {
    Object.keys(s.stockRestored[siteId]||{}).forEach(cid => {
      if (s.stockRestored[siteId][cid]) sh.restoredAt[siteId+"|"+cid] = at;
    });
  });
  (s.codes||[]).forEach(c => {
    if (c && c.id && c.eachPerBox) sh.packAt[(c.siteId||"")+"|"+c.id] = at;
    if (c && c.id && Number(c.par)>0) sh.parAt[(c.siteId||"")+"|"+c.id] = at;
  });
  sh.seeded = 1;
  sh.status = navigator.onLine ? "pending" : "offline";
}

async function shareRequest(method, path, body, extra){
  const headers = Object.assign({
    apikey: SHARE_ANON,
    Authorization: "Bearer " + SHARE_ANON,
    Accept: "application/json",
    "Content-Type": "application/json"
  }, extra||{});
  const res = await fetch(SHARE_URL + "/rest/v1/" + path, {
    method,
    headers,
    body: body==null ? undefined : JSON.stringify(body)
  });
  if (!res.ok){
    const t = await res.text();
    throw new Error(res.status + " " + String(t||"").slice(0,240));
  }
  if (res.status===204) return null;
  const ct = res.headers.get("content-type")||"";
  if (ct.indexOf("json")>=0){
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }
  return null;
}
async function shareSelect(table){
  const rows = [];
  let from = 0;
  const size = 1000;
  for (;;){
    const chunk = await shareRequest("GET", table + "?select=*&order=updated_at.asc", null, {
      Range: from + "-" + (from+size-1),
      Prefer: "count=exact"
    });
    const list = Array.isArray(chunk) ? chunk : [];
    rows.push.apply(rows, list);
    if (list.length < size) break;
    from += size;
    if (from > 20000) break;
  }
  return rows;
}
async function shareUpsert(table, conflict, rows){
  if (!rows || !rows.length) return;
  for (let i=0;i<rows.length;i+=80){
    const part = rows.slice(i, i+80);
    await shareRequest("POST", table + "?on_conflict=" + conflict, part, {
      Prefer: "resolution=merge-duplicates,return=minimal"
    });
  }
}
function shareTableMissing(err){
  const msg = String((err && err.message) || err || "");
  return /\b404\b|PGRST205|schema cache|does not exist|Could not find the table/i.test(msg);
}
async function shareSelectOptional(table){
  try { return await shareSelect(table); }
  catch(e){ if (shareTableMissing(e)) return []; throw e; }
}
async function shareUpsertOptional(table, conflict, rows){
  try { await shareUpsert(table, conflict, rows); }
  catch(e){ if (shareTableMissing(e)) return; throw e; }
}

async function shareSync(){
  if (shareBusy){ shareAgain = true; return; }
  if (typeof navigator!=="undefined" && !navigator.onLine){
    setShareStatus("offline");
    return;
  }
  shareBusy = true;
  setShareStatus("syncing");
  try{
    const changed = await sharePull();
    await sharePush();
    const sh = ensureShare();
    sh.lastOkAt = shareNow();
    sh.lastError = "";
    setShareStatus("synced");
    save();
    if (changed){
      const ae = document.activeElement;
      const typing = ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA" || ae.tagName==="SELECT");
      if (!typing) renderStay();
    }
  }catch(e){
    const sh = ensureShare();
    sh.lastError = String((e && e.message) || e || "sync failed");
    setShareStatus(typeof navigator!=="undefined" && !navigator.onLine ? "offline" : "error");
  } finally {
    shareBusy = false;
    if (shareAgain){
      shareAgain = false;
      shareKick();
    }
  }
}
function shareKick(){
  if (typeof navigator!=="undefined" && !navigator.onLine){
    setShareStatus("offline");
    return;
  }
  const sh = ensureShare();
  if (sh.status!=="syncing") sh.status = "pending";
  renderSyncChip();
  clearTimeout(shareTimer);
  shareTimer = setTimeout(() => { shareSync(); }, 400);
}
function shareStart(){
  if (shareStarted) return;
  shareStarted = true;
  ensureShare();
  window.addEventListener("online", () => { setShareStatus("pending"); shareKick(); });
  window.addEventListener("offline", () => setShareStatus("offline"));
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState==="visible") shareKick();
  });
  setInterval(() => {
    if (document.visibilityState!=="hidden") shareSync();
  }, 5000);
  shareKick();
}

function popularity(){
  const overall = {};
  const byWard = {};
  const bySite = {};
  function bump(bag, id, qty, day){
    if (!bag[id]) bag[id] = {qty:0, hits:0, last:"", seed:0};
    bag[id].qty += qty;
    bag[id].hits += 1;
    if (day > bag[id].last) bag[id].last = day;
  }
  Object.values(S.rounds).forEach(round => {
    const day = round.date;
    Object.entries(round.wards||{}).forEach(([wid, entry]) => {
      const ward = wardById(wid);
      const siteId = ward ? ward.siteId : SITE_CH;
      if (!byWard[wid]) byWard[wid] = {};
      if (!bySite[siteId]) bySite[siteId] = {};
      (entry.lines||[]).forEach(line => {
        const q = usageQty(line.qty);
        bump(overall, line.codeId, q, day);
        bump(byWard[wid], line.codeId, q, day);
        bump(bySite[siteId], line.codeId, q, day);
      });
    });
  });
  S.codes.forEach(c => {
    if (!c.seed) return;
    const sid = c.siteId;
    if (!bySite[sid]) bySite[sid] = {};
    if (!overall[c.id]) overall[c.id] = {qty:0, hits:0, last:"", seed:c.seed};
    else overall[c.id].seed = c.seed;
    if (!bySite[sid][c.id]) bySite[sid][c.id] = {qty:0, hits:0, last:"", seed:c.seed};
    else bySite[sid][c.id].seed = c.seed;
  });
  return {overall, byWard, bySite};
}
function rankedIds(bag, fallback){
  const ids = Object.keys(bag||{});
  ids.sort((a,b) => {
    const A = bag[a]||{}, B = bag[b]||{};
    return (B.qty||0)-(A.qty||0) || (B.hits||0)-(A.hits||0) || String(B.last||"").localeCompare(String(A.last||"")) || (B.seed||0)-(A.seed||0) || a.localeCompare(b);
  });
  (fallback||[]).forEach(id => { if (!ids.includes(id)) ids.push(id); });
  return ids;
}
function codesForWard(wardId, pop){
  const w = wardById(wardId);
  const sid = w ? w.siteId : currentSiteId();
  const wardRank = rankedIds(pop.byWard[wardId]||{}, rankedIds(pop.bySite[sid]||pop.overall, codeOrder(sid)));
  return wardRank.map(id => codeById(id)).filter(c => c && c.siteId===sid);
}
function wardHitBag(wardId, excludeIso){
  const bag = {};
  function hit(id, day){
    if (!id || !day) return;
    if (!bag[id]) bag[id] = {hits:0, last:"", days:{}};
    if (bag[id].days[day]) return;
    bag[id].days[day] = 1;
    bag[id].hits += 1;
    if (day > bag[id].last) bag[id].last = day;
  }
  Object.values(S.rounds||{}).forEach(round => {
    const day = round.date;
    if (!day || day===excludeIso) return;
    const entry = (round.wards||{})[wardId];
    const ticks = (S.trolley||{})[day] || {};
    const tickPrefix = day+"|"+wardId+"|";
    const hasTickData = Object.keys(ticks).some(k => k.indexOf(tickPrefix)===0);
    ((entry && entry.lines)||[]).forEach(l => {
      if (!l || !l.codeId) return;
      if (hasTickData){
        if (ticks[tickKey(day, wardId, l.codeId)]) hit(l.codeId, day);
      } else {
        hit(l.codeId, day);
      }
    });
    Object.keys(ticks).forEach(k => {
      if (!ticks[k] || k.indexOf(tickPrefix)!==0) return;
      hit(k.slice(tickPrefix.length), day);
    });
  });
  return bag;
}

    if (today && round.date === today) return;

      const ward = wardById(wid);
      if (!ward || ward.siteId!==siteId) return;
      (entry.lines||[]).forEach(line => {

function favouriteCodes(siteId){

    .filter(id => hits[id]>0 && codeById(id) && codeById(id).siteId===siteId && !bag.hide.includes(id))
    .sort((a,b) => hits[b]-hits[a] || a.localeCompare(b))
    .slice(0, 8);
  const seen = new Set();

  bag.pin.forEach(id => {
    const c = codeById(id);
    if (c && c.siteId===siteId && !seen.has(id)){ seen.add(id); out.push(c); }

    if (c && !seen.has(id)){ seen.add(id); out.push(c); }

function codesForWardSections(wardId){
  const w = wardById(wardId);
  const sid = w ? w.siteId : currentSiteId();

  const popularIds = Object.keys(bag).filter(id => (bag[id].hits||0)>0 && codeById(id) && codeById(id).siteId===sid);
  popularIds.sort((a,b) => (bag[b].hits||0)-(bag[a].hits||0) || String(bag[b].last||"").localeCompare(String(bag[a].last||"")) || a.localeCompare(b));
  const seen = new Set(popularIds);
  const popular = popularIds.map(codeById).filter(Boolean);
  const rest = [];
  codeOrder(sid).forEach(id => {
    const c = codeById(id);
    if (c && c.siteId===sid && !seen.has(c.id)){ seen.add(c.id); rest.push(c); }

  return {popular, rest};

      const ward = wardById(wid);
      if (siteId && ward && ward.siteId !== siteId) return;
      (entry.lines||[]).forEach(line => {
        bag[line.codeId] = (bag[line.codeId]||0) + usageQty(line.qty);
      });
    });
  });
  return bag;
}
function defaultDelivery(iso, urgent){
  if (urgent) return addDays(iso, 1);
  const dow = dowOf(iso);
  if (dow===2 || dow===4) return addDays(iso, 1);
  for (let i=1;i<=8;i++){
    const next = addDays(iso, i);
    const d = dowOf(next);
    if (d===3 || d===5) return next;
  }
  return addDays(iso, 1);
}
function parBoxes(c){
  const n = Number(c && c.par);
  return Number.isFinite(n) && n>0 ? Math.floor(n) : 0;
}
function setCodePar(c, value){
  if (!c) return;
  const n = Number(value);
  if (value==="" || !Number.isFinite(n) || n<=0) c.par = 0;
  else c.par = Math.floor(n);
  shareTouchPar(c);
  save();
  shareKick();
}
function suggestedOrderQty(siteId, c){
  const par = parBoxes(c);
  if (!par) return "";
  return Math.max(0, par - closingBoxesFor(siteId, c.id));
}
function orderQtyValue(line){
  if (!line || line.qty==="" || line.qty==null) return "";
  const n = Number(line.qty);
  return Number.isFinite(n) && n>=0 ? n : "";
}
function orderHasQty(line){
  const n = Number(line && line.qty);
  return Number.isFinite(n) && n>0;
}
function formatOrderLineText(line, c){
  if (!c || !orderHasQty(line)) return "";
  const label = (c.tickOnly || !c.code) ? (c.name||"") : (c.code + (c.name?" "+c.name:""));
  return label + " x " + Number(line.qty) + " box";
}
function orderCatalogLines(siteId, prev){
  const pop = popularity();
  const sitePop = pop.bySite[siteId] || {};
  const rank = rankedIds(sitePop, codeOrder(siteId));
  const seen = new Set();
  const lines = [];
  function add(c){
    if (!c || c.tickOnly || seen.has(c.id)) return;
    if (c.siteId && c.siteId!==siteId) return;
    seen.add(c.id);
    const p = prev && prev[c.id];
    const sug = suggestedOrderQty(siteId, c);
    const edited = !!(p && p.edited);
    lines.push({
      codeId:c.id,
      qty: edited ? (p.qty==null?"":p.qty) : sug,
      suggested: sug,
      edited,
      unit: "box"
    });
  }
  rank.forEach(id => add(codeById(id)));
  stockCodes(siteId).forEach(add);
  if (prev){
    Object.keys(prev).forEach(id => add(codeById(id)));
  }
  return lines;
}
function suggestOrder(siteId){
  /* kept name: builds the To order list, most-used first, with empty qtys */
  return {lines: orderCatalogLines(siteId, null)};
}

function parseRoute(){
  const h = (location.hash||"#round").replace(/^#/, "");
  const parts = h.split("/");
  const page = parts[0] || "round";
  if (page==="round" && parts[1]) route = {page:"round-ward", wardId:decodeURIComponent(parts[1]), day:null, week:null};
  else if (page==="history") route = {page:"history", wardId:null, day:parts[1] ? decodeURIComponent(parts[1]) : null, week:null};
  else if (page==="report") route = {page:"report", wardId:null, day:null, week:parts[1] ? decodeURIComponent(parts[1]) : null};
  else if (page==="setup") route = {page:"setup", wardId:null, day:null, week:null};
  else if (page==="closeouts") route = {page:"closeouts", wardId:null, day:parts[1] ? decodeURIComponent(parts[1]) : null, week:null};
  else if (page==="spotcheck") route = {page:"spotcheck", wardId:null, day:null, week:null};
  else route = {page, wardId:null, day:null, week:null};
}
