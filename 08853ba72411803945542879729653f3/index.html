function medianInt(nums){
  const a = (nums||[]).filter(n => n!=null && Number.isFinite(n) && n>0).slice().sort((x,y)=>x-y);
  if (!a.length) return null;
  const mid = Math.floor((a.length-1)/2);
  if (a.length%2) return a[mid];
  return Math.round((a[mid]+a[mid+1])/2) || a[mid];
}
function usualNeedsForWard(wid, hideIso){
  const samples = {};
  const hits = {};
  Object.keys(S.rounds||{}).forEach(day => {
    if (hideIso && day===hideIso) return;
    const e = S.rounds[day] && S.rounds[day].wards && S.rounds[day].wards[wid];
    if (!e) return;
    const ticks = (S.trolley && S.trolley[day]) || {};
    (e.lines||[]).forEach(line => {
      if (!line || !line.codeId) return;
      if (!ticks[tickKey(day, wid, line.codeId)]) return;
      if (!samples[line.codeId]) samples[line.codeId] = [];
      samples[line.codeId].push({qty:qtyNum(line.qty), unit:lineUnit(line)});
      hits[line.codeId] = (hits[line.codeId]||0) + 1;
    });
  });
  const today = hideIso && S.rounds[hideIso] && S.rounds[hideIso].wards && S.rounds[hideIso].wards[wid];
  const used = new Set(((today && today.lines)||[]).map(l => l && l.codeId).filter(Boolean));
  return Object.keys(hits).filter(id => !used.has(id) && codeById(id)).sort((a,b) => (hits[b]-hits[a]) || a.localeCompare(b)).map(id => {
    const list = samples[id]||[];
    const unitCounts = {box:0, ea:0};
    list.forEach(s => { unitCounts[s.unit==="ea"?"ea":"box"]++; });
    const unit = unitCounts.ea>unitCounts.box ? "ea" : "box";
    const qty = medianInt(list.filter(s => (s.unit||"box")===unit).map(s => s.qty));
    return {codeId:id, hits:hits[id], qty: qty==null?1:qty, unit, code:codeById(id)};
  });
}

function trolleyItems(z){

    if (!e || e.status==="nothing") return;

function tickKey(day, wid, cid){ return day+"|"+wid+"|"+cid; }
function movedFromDays(line){
  const v = line && line.movedFrom;

function movedFromLabel(line){

function tagMovedFrom(line, fromIso){

function upcomingDeliveryDays(ward, afterIso, horizon){
  const out = [];
  const n = horizon==null ? 14 : horizon;
  for (let i=1; i<=n; i++){
    const iso = addDays(afterIso, i);

function nextDeliveryDay(ward, afterIso){

function ensureRound(iso){

function ensureWardEntry(iso, wid){
  const r = ensureRound(iso);
  const w = wardById(wid);
  if (!r.wards[wid]) r.wards[wid] = {status:"pending", lines:[], siteId:w ? w.siteId : null};
  else if (w && !r.wards[wid].siteId) r.wards[wid].siteId = w.siteId;

function linesMatch(a, b){

function openLinesOn(iso, wid){
  const e = S.rounds[iso] && S.rounds[iso].wards[wid];

  return ((e && e.lines)||[]).filter(l => l && l.codeId && !ticks[tickKey(iso, wid, l.codeId)]);

function findLine(lines, codeId, unit){

}
let pendingTransfer = null;
function moveLines(fromIso, toIso, wid, srcLines){
  if (!srcLines || !srcLines.length){ toast("Nothing to move"); return null; }
  if (!toIso || toIso<=fromIso){ toast("Pick a later day"); return null; }
  if (!confirmLiveChange(siteOfWard(wid))) return null;
  const src = S.rounds[fromIso] && S.rounds[fromIso].wards[wid];
  if (!src){ toast("Nothing to move"); return null; }
  const dest = ensureWardEntry(toIso, wid);
  const rec = {fromIso, toIso, wid, items:[], dest:[], destStatusBefore: dest.status || "pending"};
  if (dest.status==="nothing") dest.status = "pending";
  if (!dest.lines) dest.lines = [];
  srcLines.forEach(srcLine => {
    const unit = lineUnit(srcLine);
    const qty = qtyNum(srcLine.qty);
    rec.items.push({codeId:srcLine.codeId, qty:srcLine.qty, unit, code:srcLine.code||"", name:srcLine.name||"", movedFrom:srcLine.movedFrom||null, index:(src.lines||[]).indexOf(srcLine)});
    const existing = findLine(dest.lines, srcLine.codeId, unit);
    if (existing){
      rec.dest.push({codeId:srcLine.codeId, unit, created:false, hadQty:existing.qty, movedFromBefore: existing.movedFrom==null ? null : JSON.parse(JSON.stringify(existing.movedFrom))});
      if (qty!=null) existing.qty = (qtyNum(existing.qty)||0) + qty;
      tagMovedFrom(existing, fromIso);
    } else {
      const neu = {codeId:srcLine.codeId, qty:srcLine.qty, unit, code:srcLine.code||"", name:srcLine.name||""};
      stampLine(neu);
      tagMovedFrom(neu, fromIso);
      dest.lines.push(neu);
      rec.dest.push({codeId:srcLine.codeId, unit, created:true});
    }
    if (S.trolley[fromIso]) delete S.trolley[fromIso][tickKey(fromIso, wid, srcLine.codeId)];
  });
  const drop = new Set(srcLines.map(l => l.codeId+"|"+lineUnit(l)));
  src.lines = (src.lines||[]).filter(l => !drop.has(l.codeId+"|"+lineUnit(l)));
  S.undoMove = rec;
  shareAfterMove(rec);
  save(); shareKick();
  return rec;
}
function undoMove(){
  const rec = S.undoMove;
  if (!rec){ toast("Nothing to undo"); return; }
  if (!confirmLiveChange(siteOfWard(rec.wid))) return;
  const dest = S.rounds[rec.toIso] && S.rounds[rec.toIso].wards[rec.wid];
  const src = ensureWardEntry(rec.fromIso, rec.wid);
  if (!src.lines) src.lines = [];
  (rec.dest||[]).forEach(d => {
    if (!dest || !dest.lines) return;
    const line = findLine(dest.lines, d.codeId, d.unit);
    if (!line) return;
    if (d.created){
      dest.lines = dest.lines.filter(l => l!==line);
    } else {
      line.qty = d.hadQty;
      if (d.movedFromBefore==null || d.movedFromBefore==="") delete line.movedFrom;
      else line.movedFrom = d.movedFromBefore;
    }
  });
  (rec.items||[]).forEach(it => {
    const exists = findLine(src.lines, it.codeId, it.unit);
    if (exists){
      const add = qtyNum(it.qty);
      if (add!=null) exists.qty = (qtyNum(exists.qty)||0) + add;
    } else {
      const line = {codeId:it.codeId, qty:it.qty, unit:it.unit, code:it.code||"", name:it.name||""};
      if (it.movedFrom!=null) line.movedFrom = it.movedFrom;
      stampLine(line);
      const idx = (it.index==null || it.index<0) ? src.lines.length : Math.min(it.index, src.lines.length);
      src.lines.splice(idx, 0, line);
    }
  });
  if (dest && rec.destStatusBefore) dest.status = rec.destStatusBefore;
  S.undoMove = null;
  (rec.items||[]).forEach(it => {
    shareTouchLine(rec.toIso, rec.wid, it.codeId, true);
    shareTouchLine(rec.fromIso, rec.wid, it.codeId, false);
    shareTouchTick(rec.fromIso, rec.wid, it.codeId);
  });
  shareTouchWard(rec.fromIso, rec.wid);
  shareTouchWard(rec.toIso, rec.wid);
  save(); shareKick();
  renderStay();
  toast("Move undone");
}
function finishMove(rec){
  if (!rec) return;
  const n = rec.items.length;
  const dest = prettyDate(rec.toIso);
  toast(n===1 ? "Moved to " + dest : "Moved " + n + " items to " + dest, {undo:true});
  renderStay();
}

function applyRemoteCloseout(row){
  if (!row || !row.id) return false;
  const sh = ensureShare();
  if (!tsNewer(row.updated_at, sh.closeoutAt[row.id])) {
    shareRemoteAt.closeouts[row.id] = row.updated_at;
    return false;
  }
  if (row.deleted){
    sh.closeoutAt[row.id] = row.updated_at;
    shareRemoteAt.closeouts[row.id] = row.updated_at;
    return false; /* never delete a saved close-out locally */
  }
  if (!Array.isArray(S.closeouts)) S.closeouts = [];
  const totals = parseMoved(row.totals) || row.totals || [];
  let rec = S.closeouts.find(c => c.id===row.id);
  if (!rec){
    rec = {id:row.id};
    S.closeouts.push(rec);
  }
  rec.day = row.day;
  rec.siteId = row.site_id;
  rec.savedAt = row.saved_at || row.updated_at;
  rec.actor = row.actor || "";
  rec.totals = totals;
  rec.updatedAt = row.updated_at;
  sh.closeoutAt[row.id] = row.updated_at;
  shareRemoteAt.closeouts[row.id] = row.updated_at;
  return true;
}

function loadTrolleyRows(siteId, iso){
  const sid = siteId || currentSiteId();
  const bag = {};
  const r = S.rounds[iso];
  if (r){
    Object.entries(r.wards||{}).forEach(([wid, e]) => {
      const w = wardById(wid);
      if (!w || w.siteId!==sid) return;
      (e.lines||[]).forEach(l => {
        if (!l || !l.codeId) return;
        const c = codeById(l.codeId);
        if (!c) return;
        const key = l.codeId;
        if (!bag[key]) bag[key] = {c, box:0, ea:0};
        const n = qtyNum(l.qty);
        if (n==null) return;
        if (lineUnit(l)==="ea") bag[key].ea += n;
        else bag[key].box += n;
      });
    });
  }
  const order = codeOrder(sid);
  const rows = [];
  const seen = new Set();
  order.forEach(id => {
    if (bag[id]){ rows.push(bag[id]); seen.add(id); }
  });
  Object.keys(bag).forEach(id => { if (!seen.has(id)) rows.push(bag[id]); });
  return rows;
}

function stockUnit(u){ return u==="ea" ? "ea" : "box"; }
function stockCodes(siteId){
  return siteCodes(siteId).filter(c => !c.tickOnly);
}
function parsePackFromText(text){
  const m = String(text||"").match(/(\d+)\s*[x×]\s*\d+/i);
  if (!m) return null;
  const n = Number(m[1]);
  return (Number.isFinite(n) && n>=2) ? n : null;
}
function packSize(c){
  if (!c) return null;
  const over = Number(c.eachPerBox);
  if (Number.isFinite(over) && over>=2) return Math.floor(over);
  return parsePackFromText([c.code, c.name, c.note].filter(Boolean).join(" "));
}
function rawUnitBag(){ return {box:0, ea:0}; }
function addUnitBag(a, b){
  return {box:(a.box||0)+(b.box||0), ea:(a.ea||0)+(b.ea||0)};
}
function normalizeUnits(u, pack){
  const bag = {box:(u&&u.box)||0, ea:(u&&u.ea)||0, pack:pack||null};
  if (!pack) return bag;
  const total = bag.box*pack + bag.ea;
  bag.total = total;
  if (total>=0){
    bag.box = Math.floor(total/pack);
    bag.ea = total % pack;
  } else {
    const abs = Math.abs(total);
    bag.box = -Math.floor(abs/pack);
    bag.ea = -(abs % pack);
  }
  return bag;
}
function onHandBoxes(u){
  if (u && u.pack && u.total!=null) return Math.floor(u.total / u.pack);
  return (u && u.box) || 0;
}
function formatOnHand(u){
  return onHandBoxes(u) + " box";
}
function formatMoved(u){
  const box = (u && u.box)||0, ea = (u && u.ea)||0;
  if (!box && !ea) return "0";
  if (!ea) return box + " box";
  if (!box) return ea + " ea";
  return box + " box, " + ea + " ea";
}
function formatStockQty(u){
  /* Remaining / delivered stock as full boxes plus loose packets, from a single packet total. */
  if (!u) return "0";
  const pack = u.pack || null;
  if (pack && u.total!=null){
    const total = Number(u.total)||0;
    const sign = total<0 ? "-" : "";
    const abs = Math.abs(total);
    const box = Math.floor(abs / pack);
    const rem = abs % pack;
    if (!box && !rem) return "0";
    if (!rem) return sign + box + " box";
    if (!box) return sign + rem + " ea";
    return sign + box + " box + " + rem + " ea";
  }
  const box = (u.box)||0, ea = (u.ea)||0;
  if (!box && !ea) return "0";
  if (!ea) return box + " box" + (pack ? "" : " (no pack size)");
  if (!box) return ea + " ea";
  return box + " box + " + ea + " ea" + (pack ? "" : " (no pack size)");
}
function stockRowSpend(u){
  if (u && u.pack && u.total!=null){
    return {packets:u.total, known:true, boxesOnly:0, pack:u.pack, mixedPacks:false, packs:[u.pack]};
  }
  const s = emptySpend();
  s.known = false;
  s.boxesOnly = (u && u.box)||0;
  return s;
}
function formatStockTotal(rows, field){
  const spend = (rows||[]).reduce((acc, r) => mergeSpend(acc, stockRowSpend(r[field])), emptySpend());
  if (spend.known && !spend.mixedPacks && spend.pack){
    return formatStockQty({pack:spend.pack, total:spend.packets});
  }
  return formatSpend(spend);
}
function onHandIsZero(u){ return ((u&&u.box)||0)===0 && ((u&&u.ea)||0)===0; }
function onHandIsNeg(u){
  if (u && u.pack && u.total!=null) return u.total<0;
  return ((u&&u.box)||0)<0 || ((u&&u.ea)||0)<0;
}
function formatStockSavedAt(iso){
  if (!iso) return "Not yet saved";
  const txt = new Intl.DateTimeFormat("en-AU",{timeZone:TZ, weekday:"short", day:"numeric", month:"short", hour:"numeric", minute:"2-digit", hour12:true}).format(new Date(iso));
  return "Last saved " + txt;
}
function tickTotalsForSite(siteId, store, dayPred){
  const s = store || S;
  const bag = {};
  const wards = s.wards||[];
  Object.keys(s.trolley||{}).forEach(day => {
    if (dayPred && !dayPred(day)) return;
    const ticks = s.trolley[day]||{};
    Object.keys(ticks).forEach(key => {
      if (!ticks[key]) return;
      const parts = String(key).split("|");
      if (parts.length!==3) return;
      const wid = parts[1], cid = parts[2];
      const w = wards.find(x => x.id===wid);
      if (!w || w.siteId!==siteId) return;
      const e = s.rounds && s.rounds[day] && s.rounds[day].wards && s.rounds[day].wards[wid];
      const line = ((e && e.lines)||[]).find(l => l.codeId===cid);
      if (!line) return;
      const k = cid+"|"+stockUnit(lineUnit(line));
      bag[k] = (bag[k]||0) + usageQty(line.qty);
    });
  });
  return bag;
}
function initStocktakeFromExisting(s){
  [SITE_POW, SITE_CH].forEach(siteId => {
    if (s.stocktake[siteId] && s.stocktake[siteId].baseline) return;
    const baseline = {};
    (s.codes||[]).forEach(c => {
      if (c.siteId!==siteId || c.tickOnly) return;
      const n = Number(c.stock);
      if (Number.isFinite(n) && n!==0){
        const bag = {box:0, ea:0};
        bag[stockUnit(c.unit)] = n;
        baseline[c.id] = bag;
      }
    });
    s.stocktake[siteId] = {savedAt:null, baseline, tickedAtSave: tickTotalsForSite(siteId, s)};
  });
}
function ensureStocktake(siteId){
  if (!S.stocktake) S.stocktake = {};
  if (!S.stocktake[siteId] || !S.stocktake[siteId].baseline){
    initStocktakeFromExisting(S);
  }
  if (!S.stocktake[siteId]) S.stocktake[siteId] = {savedAt:null, baseline:{}, tickedAtSave:{}};
  return S.stocktake[siteId];
}
function deliveriesSince(siteId, savedAt){
  return (S.stockDeliveries||[]).filter(d => d.siteId===siteId && (!savedAt || String(d.addedAt||"") > savedAt));
}
function stockStartUnits(siteId, codeId){
  const st = ensureStocktake(siteId);
  const u = Object.assign({box:0, ea:0}, (st.baseline||{})[codeId]||{});
  deliveriesSince(siteId, st.savedAt).forEach(d => {
    if (d.codeId!==codeId) return;
    const unit = stockUnit(d.unit);
    u[unit] = (u[unit]||0) + (Number(d.qty)||0);
  });
  return u;
}
function deliveredSinceUnits(siteId, codeId){
  const st = ensureStocktake(siteId);
  const nowT = tickTotalsForSite(siteId);
  const thenT = st.tickedAtSave||{};
  return {
    box: (nowT[codeId+"|box"]||0) - (thenT[codeId+"|box"]||0),
    ea: (nowT[codeId+"|ea"]||0) - (thenT[codeId+"|ea"]||0)
  };
}
function zonedIsoFromTimestamp(ts){
  if (!ts) return null;
  const parts = {};
  for (const p of new Intl.DateTimeFormat("en-AU",{timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).formatToParts(new Date(ts))){
    if (p.type!=="literal") parts[p.type] = p.value;
  }
  return (parts.year && parts.month && parts.day) ? (parts.year+"-"+parts.month+"-"+parts.day) : null;
}
function stockStartUnitsBeforeDay(siteId, codeId, isoDay){
  const st = ensureStocktake(siteId);
  const u = Object.assign({box:0, ea:0}, (st.baseline||{})[codeId]||{});
  deliveriesSince(siteId, st.savedAt).forEach(d => {
    if (d.codeId!==codeId) return;
    const dDay = (d.date && /^\d{4}-\d{2}-\d{2}$/.test(d.date)) ? d.date : zonedIsoFromTimestamp(d.addedAt);
    if (dDay && dDay >= isoDay) return;
    const unit = stockUnit(d.unit);
    u[unit] = (u[unit]||0) + (Number(d.qty)||0);
  });
  return u;
}
function deliveredBeforeDay(siteId, codeId, isoDay){
  const st = ensureStocktake(siteId);
  const savedDay = zonedIsoFromTimestamp(st.savedAt);
  if (savedDay && savedDay >= isoDay) return {box:0, ea:0};
  const nowT = tickTotalsForSite(siteId, S, day => day < isoDay);
  const thenT = st.tickedAtSave||{};
  return {
    box: (nowT[codeId+"|box"]||0) - (thenT[codeId+"|box"]||0),
    ea: (nowT[codeId+"|ea"]||0) - (thenT[codeId+"|ea"]||0)
  };
}
function deliveredOnDay(siteId, codeId, isoDay){
  const all = deliveredSinceUnits(siteId, codeId);
  const before = deliveredBeforeDay(siteId, codeId, isoDay);
  return {box:(all.box||0)-(before.box||0), ea:(all.ea||0)-(before.ea||0)};
}
function onHandUnits(siteId, codeId){
  const u = stockStartUnits(siteId, codeId);
  const d = deliveredSinceUnits(siteId, codeId);
  u.box = (u.box||0) - (d.box||0);
  u.ea = (u.ea||0) - (d.ea||0);
  return normalizeUnits(u, packSize(codeById(codeId)));
}
function knownStockItem(siteId, c){
  const st = ensureStocktake(siteId);
  const restored = (S.stockRestored && S.stockRestored[siteId]) || {};
  const u = onHandUnits(siteId, c.id);
  return !!(st.baseline && st.baseline[c.id]) || !onHandIsZero(u) || restored[c.id]
    || (S.stockDeliveries||[]).some(d => d.siteId===siteId && d.codeId===c.id);
}
function remainingRows(siteId){
  const rows = [];
  stockCodes(siteId).forEach(c => {
    if (!knownStockItem(siteId, c)) return;
    const pack = packSize(c);
    const today = zonedNow().iso;
    const startBag = stockStartUnitsBeforeDay(siteId, c.id, today);
    const before = deliveredBeforeDay(siteId, c.id, today);
    startBag.box = (startBag.box||0) - (before.box||0);
    startBag.ea = (startBag.ea||0) - (before.ea||0);
    const start = normalizeUnits(startBag, pack);
    const delivered = normalizeUnits(deliveredOnDay(siteId, c.id, today), pack);
    const onhand = onHandUnits(siteId, c.id);
    rows.push({code:c, pack, start, delivered, onhand});
  });
  return rows;
}
function remainingTotals(rows){
  const tot = {start:rawUnitBag(), delivered:rawUnitBag(), onhand:rawUnitBag()};
  rows.forEach(r => {
    tot.start = addUnitBag(tot.start, r.start);
    tot.delivered = addUnitBag(tot.delivered, r.delivered);
    tot.onhand = addUnitBag(tot.onhand, r.onhand);
  });
  return tot;
}
function syncCodeStockFromOnHand(){
  [SITE_POW, SITE_CH].forEach(siteId => {
    if (!S.stocktake || !S.stocktake[siteId]) return;
    stockCodes(siteId).forEach(c => {
      const u = onHandUnits(siteId, c.id);
      c.stock = onHandBoxes(u);
    });
  });
}
function stockDraftValue(siteId, codeId){
  const d = (S.stockDraft && S.stockDraft[siteId]) || {};
  return d[codeId]==null ? "" : d[codeId];
}
function setStockDraft(siteId, codeId, value){
  if (!S.stockDraft) S.stockDraft = {};
  if (!S.stockDraft[siteId]) S.stockDraft[siteId] = {};
  S.stockDraft[siteId][codeId] = value;
}
function deliveryDraft(siteId){
  if (!S.stockDeliveryDraft) S.stockDeliveryDraft = {};
  const d = S.stockDeliveryDraft[siteId] || {};
  if (!S.stockDeliveryDraft[siteId]){
    S.stockDeliveryDraft[siteId] = {codeId:d.codeId||"", qty:d.qty||"", unit:d.unit||"box", date:d.date||zonedNow().iso};
  }
  const cur = S.stockDeliveryDraft[siteId];
  if (!cur.date) cur.date = zonedNow().iso;
  if (!cur.unit) cur.unit = "box";
  return cur;
}
function applyStocktakeDraft(siteId){
  const st = ensureStocktake(siteId);
  const draft = (S.stockDraft && S.stockDraft[siteId]) || {};
  const baseline = {};
  Object.keys(st.baseline||{}).forEach(id => {
    const u = onHandUnits(siteId, id);
    baseline[id] = {box:u.box||0, ea:u.ea||0};
  });
  let any = false;
  Object.keys(draft).forEach(cid => {
    const raw = draft[cid];
    if (raw==="" || raw==null) return;
    const n = Number(raw);
    if (!Number.isFinite(n) || n<0) return;
    const c = codeById(cid);
    if (!c || c.siteId!==siteId || c.tickOnly) return;
    any = true;
    const bag = {box:0, ea:0};
    bag[stockUnit(c.unit)] = n;
    baseline[cid] = bag;
  });
  if (!any) return false;
  st.baseline = baseline;
  st.savedAt = new Date().toISOString();
  st.tickedAtSave = tickTotalsForSite(siteId);
  S.stockDraft[siteId] = {};
  if (S.stockRestored) S.stockRestored[siteId] = {};
  syncCodeStockFromOnHand();
  shareTouchStocktake(siteId);
  save();
  toast("Stocktake saved");
  renderStay();
  shareKick();
  return true;
}
function saveStocktake(siteId){
  if (!confirmLiveChange(siteId)) return;
  const draft = (S.stockDraft && S.stockDraft[siteId]) || {};
  const any = Object.keys(draft).some(cid => {
    const raw = draft[cid];
    if (raw==="" || raw==null) return false;
    const n = Number(raw);
    return Number.isFinite(n) && n>=0 && codeById(cid) && codeById(cid).siteId===siteId && !codeById(cid).tickOnly;
  });
  if (!any){ toast("Enter a count first"); return; }
  const go = () => { applyStocktakeDraft(siteId); };
  if (typeof navigator!=="undefined" && navigator.onLine){
    shareSync().then(go).catch(go);
  } else go();
}
function addStockDelivery(siteId){

  const date = (d.date && /^\d{4}-\d{2}-\d{2}$/.test(d.date)) ? d.date : zonedNow().iso;
  if (!S.stockDeliveries) S.stockDeliveries = [];

  };

  if (S.stockRestored && S.stockRestored[siteId]) delete S.stockRestored[siteId][c.id];
  syncCodeStockFromOnHand();

  save();

}
function restoreStockItem(siteId, codeId){

function renderOnHandSite(siteId){
  const site = siteById(siteId);
  const title = site ? site.name : siteId;
  const st = ensureStocktake(siteId);
  const restored = (S.stockRestored && S.stockRestored[siteId]) || {};
  const q = stockQuery.trim().toLowerCase();
  const rows = [];
  const unused = [];
  stockCodes(siteId).forEach(c => {
    const u = onHandUnits(siteId, c.id);
    const known = (st.baseline && st.baseline[c.id]) || !onHandIsZero(u) || restored[c.id]
      || (S.stockDeliveries||[]).some(d => d.siteId===siteId && d.codeId===c.id);
    if (!known) return;
    const nm = (displayCode(c)+" "+(displayMeta(c)||"")+" "+(c.note||"")).toLowerCase();
    if (q && !nm.includes(q)) return;
    const zero = onHandIsZero(u);
    const neg = onHandIsNeg(u);
    const low = onHandBoxes(u) <= 5;
    const hide = zero && !neg && !restored[c.id];
    const meta = displayMeta(c);
    const row = `<div class="oh-row ${hide|| (zero&&!neg)?"stock-unused":""}" data-cid="${esc(c.id)}" data-name="${esc(nm)}">
      <div class="grow"><div class="code">${esc(displayCode(c))} ${kclBadge(c)}</div>
        <div class="muted">${meta?esc(meta):""}${c.note?" · "+esc(c.note):""}</div></div>
      <div class="oh-qty ${low?"oh-neg":""}">${esc(formatStockQty(u))}</div>
      ${hide?`<button type="button" class="btn ghost" data-act="stock-restore" data-site="${esc(siteId)}" data-cid="${esc(c.id)}">Bring back</button>`:""}
    </div>`;
    if (hide) unused.push(row);
    else rows.push(row);
  });
  const hist = (S.stockDeliveries||[]).filter(d => d.siteId===siteId).slice().sort((a,b) => String(b.addedAt||"").localeCompare(String(a.addedAt||""))).slice(0,8);
  const histLabel = hist.length
    ? `<p class="muted" style="margin:10px 0 0">Recent deliveries</p><ul class="deliv-hist">${hist.map(d => `<li>${esc(prettyDate(d.date))} · ${esc(d.code||d.name||"Item")} · ${esc(String(d.qty))} ${esc(d.unit)}</li>`).join("")}</ul>`
    : `<p class="muted" style="margin:10px 0 0">No added deliveries yet.</p>`;
  return `<div class="card" data-oh-site="${esc(siteId)}">
    <h2>${esc(title)}</h2>
    <p class="saved-at">${esc(formatStockSavedAt(st.savedAt))}</p>
    ${rows.join("") || (unused.length?"":'<div class="muted">No items on hand.</div>')}
    ${unused.length?`<div class="notinuse-head">Not in use</div>${unused.join("")}`:""}
    ${histLabel}
  </div>`;
}

function ensureDraft(z){
  const siteId = currentSiteId();
  if (draftOrder && draftOrder.date===z.iso && draftOrder.siteId===siteId){
    if (!draftOrder.manualQty){
      (draftOrder.lines||[]).forEach(l => { l.qty = ""; });
      draftOrder.manualQty = 1;
      const prev = {};
      (draftOrder.lines||[]).forEach(l => { prev[l.codeId] = {qty:l.qty, unit:"box"}; });
      draftOrder.lines = orderCatalogLines(siteId, prev);
    } else {
      (draftOrder.lines||[]).forEach(l => { l.unit = "box"; });
      const prev = {};
      (draftOrder.lines||[]).forEach(l => {
        let edited = !!l.edited;
        if (!draftOrder.parFill && l.qty!="" && l.qty!=null && String(l.qty)!==String(l.suggested||"")) edited = true;
        prev[l.codeId] = {qty:l.qty, unit:"box", edited};
      });
      draftOrder.lines = orderCatalogLines(siteId, prev);
      draftOrder.parFill = 1;
    }
    return draftOrder;
  }
  draftOrder = {
    date: z.iso,
    siteId,
    urgent: !(isOrderDay(z)),
    expectedDelivery: defaultDelivery(z.iso, !(isOrderDay(z))),
    manualQty: 1,
    parFill: 1,
    lines: orderCatalogLines(siteId, null)
  };
  return draftOrder;
}

    <div class="btnrow">
      <button class="btn ok block" data-act="order-send" ${sent?"disabled":""}>${sent?"Already marked sent today":"Mark as sent"}</button>

    ${renderPastOrders()}

function renderPastOrders(){
  const sid = currentSiteId();
  const list = S.orders.filter(o => !o.siteId || o.siteId===sid);
  if (!list.length) return "";
  const rows = [...list].reverse().slice(0,8).map(o => {
    const n = (o.lines||[]).reduce((s,l)=>s+(Number(l.qty)||0),0);
    return `<div class="line"><div class="grow"><div>${esc(prettyDate(o.sentDate||o.date))}${o.urgent?" · urgent":""}</div>
      <div class="muted">${(o.lines||[]).length} lines · ${n} items · delivery ${esc(shortDate(o.expectedDelivery))}</div></div></div>`;
  }).join("");
  return `<h3>Recent orders</h3><div class="card">${rows}</div>`;
}

function orderMessage(d){
  const name = (S.settings.partnerName||"").trim();
  const title = d.urgent ? "URGENT stock order" : "Stock order";
  const site = siteById(d.siteId);
  const lines = (d.lines||[]).map(l => formatOrderLineText(l, codeById(l.codeId))).filter(Boolean);
  const parts = [
    title,
    prettyDate(d.date),
    "Delivery: " + prettyDate(d.expectedDelivery)
  ];
  if (site && site.name) parts.push("Site: " + site.name);
  parts.push("");
  parts.push(lines.join("\n") || "(no lines)");
  parts.push("");
  parts.push(lines.length + (lines.length===1?" line":" lines"));
  if (name) parts.push("For " + name);
  return parts.join("\n");
}

function renderHistory(z, pop){
  function rankBlock(title, bag, allowSeed){
    const ids = rankedIds(bag, []);
    const visible = ids.filter(id => {
      const st = bag[id]||{};
      return (st.qty||0)>0 || (st.hits||0)>0 || (allowSeed && (st.seed||0)>0);
    });
    if (!visible.length) return `<p class="muted">No usage yet.</p>`;
    const max = Math.max(1, ...visible.map(id => (bag[id]||{}).qty||0));
    return visible.slice(0,15).map((id,i) => {
      const c = codeById(id); if (!c) return "";
      const st = bag[id];
      const pct = Math.round((st.qty||0)/max*100);
      const qtyLabel = (st.qty||0) ? String(st.qty) : "notes";
      return `<div class="rank"><span class="muted" style="width:1.2em">${i+1}</span>
        <div class="grow"><div class="code">${esc(displayCode(c))} ${esc(c.name||"")}</div>
          <div class="bar"><span style="width:${pct}%"></span></div></div>
        <span class="muted">${esc(qtyLabel)}</span></div>`;
    }).join("");
  }
  const siteBlocks = S.sites.map(s => {
    return `<div class="card"><h2>${esc(s.name)} — most used</h2>${rankBlock(s.name, pop.bySite[s.id]||{}, s.id===SITE_CH)}</div>`;
  }).join("");
  const wardBlocks = enabledWards().map(w => {
    const bag = pop.byWard[w.id]||{};
    if (!Object.keys(bag).length) return "";
    return `<div class="card"><h2>${esc(w.name)}</h2>${rankBlock(w.name, bag, false)}</div>`;
  }).join("") || `<div class="card muted">No per-ward usage yet.</div>`;

  const note = `<p class="phone-note noprint">Day and week records are shared, so you and your colleague can view POW and Children's — including past weeks — on this phone. A copy is also kept here for offline use.</p>`;
  const todayNote = (historyRangeKind()==="day" && historyAnchor(z)===z.iso) ? `<p class="phone-note noprint">Today’s list is still editable on the Round tab. This view is read-only.</p>` : "";
  const exportUi = `${note}${renderHistExport(z)}${todayNote}${renderHistorySheet(z)}`;

  if (route.day && historyRangeKind()==="day"){
    return `
      ${exportUi}
      <div class="btnrow noprint" style="margin-top:0">
        <a class="btn" href="#history" style="text-decoration:none;display:inline-flex;align-items:center">All days</a>
        <a class="btn" href="#report" style="text-decoration:none;display:inline-flex;align-items:center">Weekly delivery report</a>
      </div>
      ${brandFoot()}
    `;
  }

  const days = recordedDays();
  const mondays = Array.from(new Set(days.map(mondayOf))).sort().reverse();
  const weekRows = mondays.map(m => {
    const bag = weekGrandBag(m);
    const tag = mondayOf(z.iso)===m ? " · this week" : "";
    return `<a class="dayrow" href="#report/${esc(m)}"><span class="grow"><div>Week of ${esc(prettyDate(m))}${esc(tag)}</div><div class="muted">${esc(shortDate(m))} – ${esc(shortDate(addDays(m,4)))} · ${esc(formatSpend(bag))}</div></span><span aria-hidden="true">›</span></a>`;
  }).join("") || `<p class="muted">No weeks recorded yet. Finish a ward on the Round tab and it is saved here and shared automatically.</p>`;
  const dayRows = days.map(day => {
    const rep = dayReport(day, "all");
    const nW = rep.wards.length;
    const tag = day===z.iso ? " · today" : "";
    return `<a class="dayrow" href="#history/${esc(day)}"><span class="grow"><div>${esc(prettyDate(day))}${esc(tag)}</div><div class="muted">${nW} ward${nW===1?"":"s"} · ${esc(formatSpend(rep.spend))}</div></span><span aria-hidden="true">›</span></a>`;
  }).join("") || `<p class="muted">No deliveries recorded yet. Finish a ward on the Round tab and it is saved here automatically.</p>`;

  return `
    ${exportUi}
    <div class="noprint">
    <h3>Past weeks</h3>
    <div class="daylist">${weekRows}</div>
    <h3>Past days</h3>
    <div class="daylist">${dayRows}</div>
    <h3>Overall popularity</h3>
    <div class="card">${rankBlock("Overall", pop.overall, true)}</div>
    <h3>Per site</h3>
    ${siteBlocks}
    <h3>Per ward</h3>
    ${wardBlocks}
    </div>
    ${brandFoot()}
  `;
}

function openWard(id){
  location.hash = "round/" + encodeURIComponent(id);
}
function addCodeToWard(wid, cid){
  if (!confirmLiveChange(siteOfWard(wid))) return;
  const ww = wardById(wid); if (ww) touchRun(ww.siteId);
  sfx("tick"); buzz(8);
  const r = todayRound();
  const e = wardEntry(r, wid);
  const line = e.lines.find(l => l.codeId===cid);
  if (line){
    const n = qtyNum(line.qty);
    line.qty = (n==null ? 1 : n+1);
  } else {
    e.lines.push({codeId:cid, qty:1, unit:"box"});
    if (e.status==="nothing") e.status="pending";
  }
  touchEntry(wid, e);
  shareTouchLine(r.date || zonedNow().iso, wid, cid, false);
  shareTouchWard(r.date || zonedNow().iso, wid);
  markLineEntered(wid, cid);
  const keepSearch = route.page==="round-ward";
  fluidQuery = "";
  save(); renderStay(); shareKick();
  const ln = document.querySelector('.line[data-cid="' + (window.CSS && CSS.escape ? CSS.escape(cid) : cid) + '"]');
  if (ln) ln.classList.add("pulse");
  if (keepSearch){
    const inp = document.querySelector('input[data-act="filter-fluid"]');
    if (inp){ inp.value = ""; inp.focus(); const clr=document.querySelector('[data-act=clear-fluid-search]'); if (clr) clr.hidden = true; }
  }
}
function changeQty(wid, cid, dir){
  if (!confirmLiveChange(siteOfWard(wid))) return;
  const e = wardEntry(todayRound(), wid);
  const line = e.lines.find(l => l.codeId===cid);
  if (!line) return;
  sfx("tick"); buzz(6);
  const n = qtyNum(line.qty);
  if (dir<0){
    if (n==null || n<=1) line.qty = "";
    else line.qty = n-1;
  } else {
    line.qty = (n==null ? 1 : n+1);
  }
  touchEntry(wid, e);
  shareTouchLine(zonedNow().iso, wid, cid, false);
  shareTouchWard(zonedNow().iso, wid);
  markLineEntered(wid, cid);
  save(); renderStay(); shareKick();
}
function toggleLineUnit(wid, cid){
  if (!confirmLiveChange(siteOfWard(wid))) return;
  const e = wardEntry(todayRound(), wid);
  const line = e.lines.find(l => l.codeId===cid);
  if (!line) return;
  line.unit = lineUnit(line)==="ea" ? "box" : "ea";
  touchEntry(wid, e);
  shareTouchLine(zonedNow().iso, wid, cid, false);
  shareTouchWard(zonedNow().iso, wid);
  markLineEntered(wid, cid);
  save(); renderStay(); shareKick();
}
function removeLine(wid, cid){
  if (!confirmLiveChange(siteOfWard(wid))) return;
  const e = wardEntry(todayRound(), wid);
  e.lines = e.lines.filter(l => l.codeId!==cid);
  touchEntry(wid, e);
  shareTouchLine(zonedNow().iso, wid, cid, true);
  shareTouchWard(zonedNow().iso, wid);
  save(); renderStay(); shareKick();
}
function markWard(wid, status){
  if (!confirmLiveChange(siteOfWard(wid))) return;
  const e = wardEntry(todayRound(), wid);
  const mw = wardById(wid); if (mw) touchRun(mw.siteId);
  if ((status==="checked" || status==="nothing") && e.status===status){
    e.status = "pending";
    touchEntry(wid, e);
    shareTouchWard(zonedNow().iso, wid);
    save(); shareKick();
    renderStay();
    return;
  }
  e.status = status;
  touchEntry(wid, e);
  shareTouchWard(zonedNow().iso, wid);
  save(); shareKick();
  if (status==="checked" || status==="nothing"){
    const ww = wardById(wid);
    const wards = scheduledWards(ww ? ww.siteId : currentSiteId(), zonedNow().iso);
    const i = wards.findIndex(w => w.id===wid);
    const next = wards.slice(Math.max(i,0)+ (i<0?0:1)).find(w => {
      const x = todayRound().wards[w.id];
      return !isDone(x);
    });
    if (next){ openWard(next.id); return; }
    location.hash = "round";
    return;
  }
  render();
}
function markLineEntered(wid, cid){
  /* Entering a fluid on a ward marks it delivered so stock deducts immediately. */
  const day = zonedNow().iso;
  if (!S.trolley[day]) S.trolley[day] = {};
  const key = tickKey(day, wid, cid);
  if (!S.trolley[day][key]){
    S.trolley[day][key] = true;
    shareTouchTick(day, wid, cid);
  }
  syncCodeStockFromOnHand();
}
function tickItem(wid, cid){
  if (!confirmLiveChange(siteOfWard(wid))) return;
  const day = zonedNow().iso;
  if (!S.trolley[day]) S.trolley[day] = {};
  const key = tickKey(day, wid, cid);
  S.trolley[day][key] = !S.trolley[day][key];
  if (S.trolley[day][key]){ sfx("tick"); buzz(8); }
  syncCodeStockFromOnHand();
  shareTouchTick(day, wid, cid);
  save(); renderStay(); shareKick();
  maybeWardAllTicked(wid, day);
}
function maybeWardAllTicked(wid, day){
  const r = S.rounds[day];
  const e = r && r.wards && r.wards[wid];
  const lines = (e && e.lines) || [];
  if (!lines.length) return;
  const ticks = S.trolley[day]||{};
  if (!lines.every(l => l && l.codeId && ticks[tickKey(day, wid, l.codeId)])) return;
  if (REDUCED) return;
  const old = document.querySelector(".ward-pop");
  if (old) old.remove();
  const el = document.createElement("div");
  el.className = "ward-pop";
  el.textContent = "✓";
  el.setAttribute("aria-hidden","true");
  document.body.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
}
function changeStock(cid, dir){
  const c = codeById(cid); if (!c) return;
  const siteId = c.siteId || currentSiteId();
  const cur = stockDraftValue(siteId, cid);
  const n = cur==="" || cur==null ? 0 : Number(cur)||0;
  const next = Math.max(0, n+dir);
  setStockDraft(siteId, cid, String(next));
  save(); renderStay();
}

function rebuildDraftKeepEdits(z, siteId){
  const prev = {};
  if (draftOrder) draftOrder.lines.forEach(l => {
    prev[l.codeId]={qty:l.qty, unit:"box", edited:!!l.edited, suggested:l.suggested};
  });
  draftOrder = {
    date: z.iso,
    siteId,
    urgent: draftOrder ? draftOrder.urgent : !isOrderDay(z),
    expectedDelivery: draftOrder && draftOrder.siteId===siteId ? draftOrder.expectedDelivery : defaultDelivery(z.iso, draftOrder?draftOrder.urgent:!isOrderDay(z)),
    manualQty: 1,
    parFill: 1,
    lines: orderCatalogLines(siteId, prev)
  };
}

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  let ok=false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  ta.remove();
  return ok;
}
function waLink(text){
  const digits = String(S.settings.waNumber||"").replace(/\D+/g,"");
  const q = "text=" + encodeURIComponent(text);
  return digits ? ("https://wa.me/" + digits + "?" + q) : ("https://wa.me/?" + q);
}

function exportBackup(){
  const payload = {
    format: "ward-run-backup",
    version: 2,
    exportedAt: new Date().toISOString(),
    data: S
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fluid-run-backup-" + zonedNow().iso + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast("Backup downloaded");
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(String(reader.result));
      if (!obj || (obj.format!=="ward-run-backup" && obj.format!=="fluid-run-backup") || !obj.data) throw new Error("Not a Fluid Run backup");
      if (!confirm("Replace all data on this phone with the backup? This cannot be undone.")) return;
      S = obj.data;
      migrate(S);
      draftOrder = null;
      save(); render();
      toast("Backup imported");
    }catch(e){
      toast("Could not import that file");
    }
  };
  reader.readAsText(file);
}

function promptDlg(title, fields, onOk){
  const dlg = document.getElementById("dlg");
  const body = fields.map((f,i) => `<div class="field"><label>${esc(f.label)}</label>
    <input id="dlg-f${i}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}" ${f.attr||""}></div>`).join("");
  dlg.innerHTML = `<h2 id="dlgTitle">${esc(title)}</h2>${body}
    <div class="btnrow"><button class="btn" data-dlg="cancel">Cancel</button>
    <button class="btn primary" data-dlg="ok">Save</button></div>`;
  const cancel = () => { dlg.close(); dlg.innerHTML=""; };
  dlg.querySelector("[data-dlg=cancel]").onclick = cancel;
  dlg.querySelector("[data-dlg=ok]").onclick = () => {
    const values = fields.map((_,i) => dlg.querySelector("#dlg-f"+i).value);
    cancel();
    onOk(values);
  };
  dlg.showModal();
  const first = dlg.querySelector("input");
  if (first) first.focus();
}

function maybeNotify(z){
  if (!("Notification" in window) || Notification.permission!=="granted") return;
  if (!isOrderDay(z) || !beforeCutoff(z) || orderSentOn(z.iso)) return;
  const key = "ward-run-notified-"+z.iso;
  if (sessionStorage.getItem(key)) return;
  try{
    new Notification("Fluid Run", {
      body: "Send today’s restock list before "+(S.settings.orderHour||11)+":00.",
      icon: "icons/icon-192.png",
      tag: "ward-run-order-day"
    });
    sessionStorage.setItem(key,"1");
  }catch(e){}
}

function newCode(code, name, siteId){
  return {id:"c-"+slug(code||name||"x")+"-"+uid(""), code:code||"", name:name||"", note:"", kcl:false, tickOnly:!code, unit:"box", par:0, stock:0, siteId:siteId||currentSiteId(), seed:0};
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  const z = zonedNow();

  if (act==="back"){
    if (route.page==="round-ward") location.hash="round";
    else if (route.page==="history" && route.day) location.hash="history";
    else if (route.page==="closeouts" && route.day) location.hash="closeouts";
    else if (route.page==="closeouts" || route.page==="spotcheck") location.hash="trolleys";
    else location.hash="more";
    return;
  }
  if (act==="week-prev" || act==="week-next"){
    const ziso = zonedNow().iso;
    const cur = (route.week && /^\d{4}-\d{2}-\d{2}$/.test(route.week)) ? mondayOf(route.week) : mondayOf(ziso);
    const next = addDays(cur, act==="week-next" ? 7 : -7);
    location.hash = "report/" + next;
    return;
  }
  if (act==="report-layout"){
    const id = b.dataset.id;
    reportLayout = (id==="ward" || id==="grid" || id==="item") ? id : "item";
    render();
    return;
  }
  if (act==="export-week-xlsx"){ exportWeekXlsx(reportMonday()); return; }
  if (act==="print-report"){ window.print(); return; }
  if (act==="hist-range"){
    const id = b.dataset.id;
    histRange = (id==="week" || id==="month") ? id : "day";
    if (histRange==="day" && !histAnchor && route.day) histAnchor = route.day;
    render();
    return;
  }
  if (act==="hist-week-prev" || act==="hist-week-next"){
    const cur = mondayOf(historyAnchor());
    histRange = "week";
    histAnchor = addDays(cur, act==="hist-week-next" ? 7 : -7);
    render();
    return;
  }
  if (act==="export-hist-xlsx"){ exportHistoryXlsx(); return; }
  if (act==="print-hist"){ window.print(); return; }
  if (act==="copy-report"){
    copyText(reportPlainText(reportMonday(), reportLayout||"day")).then(ok => toast(ok ? "Copied as text" : "Copy failed — long-press to copy"));
    return;
  }
  if (act==="celebrate-close"){ clearTimeout(celebrateTimer); document.getElementById("celebrate").classList.remove("show"); return; }
  if (act==="share-retry"){ shareKick(); return; }
  if (act==="set-staff-choice"){
    if (setStaffChoice(b.dataset.name)){
      const dlg = document.getElementById("dlg");
      if (dlg && dlg.open){ dlg.close(); dlg.innerHTML=""; }
      renderStay(); shareKick();
    }
    return;
  }
  if (act==="sound"){ G.sound = !G.sound; gSave(); render(); if (G.sound) sfx("done"); toast(G.sound ? "Tick sound on" : "Tick sound off"); return; }
  if (act==="haptic"){ G.haptic = !hapticOn(); gSave(); render(); if (hapticOn()) buzz(15); toast(hapticOn() ? "Haptic on" : "Haptic off"); return; }
  if (act==="closeout-save"){
    const rec = saveDailyCloseout(currentSiteId());
    if (rec) render();
    return;
  }
  if (act==="capture-barcode"){
    const cid = b.dataset.cid;
    const siteId = b.dataset.site || currentSiteId();
    openScanner(siteId, (c, raw) => {
      if (cid && c && c.id!==cid){
        /* User scanned a box after picking a specific missing item — link that barcode to the picked item. */
        linkBarcode(raw, cid, true);
        shareKick();
        const picked = codeById(cid);
        toast("Linked to " + displayCode(picked||c));
      } else {
        if (raw && c) { linkBarcode(raw, c.id, true); shareKick(); }
        toast("Linked " + displayCode(c));
      }
      renderStay();
    }, "Scan the box barcode");
    return;
  }
  if (act==="order-copy-closeout"){
    const text = renderOrderCloseoutText(zonedNow());
    copyText(text).then(ok => toast(ok ? "Close-out order copied" : "Could not copy"));
    return;
  }
  if (act==="spot-pick"){
    const sid = currentSiteId();
    const draft = (S.spotDraft = S.spotDraft || {});
    if (!draft[sid]) draft[sid] = {picked:[], counts:{}};
    const have = new Set(draft[sid].picked||[]);
    promptDlg("Add a fluid to count", [{label:"Code or name", placeholder:"e.g. 0063 or glucose"}], ([q]) => {
      q = String(q||"").trim().toLowerCase();
      if (!q) return;
      const c = stockCodes(sid).find(x => fluidSearchText(x).includes(q) || displayCode(x).toLowerCase()===q);
      if (!c){ toast("No matching fluid"); return; }
      if (!have.has(c.id)) draft[sid].picked.push(c.id);
      save(); render();
    });
    return;
  }
  if (act==="spot-drop"){
    const sid = currentSiteId();
    const draft = (S.spotDraft && S.spotDraft[sid]) || {picked:[], counts:{}};
    draft.picked = (draft.picked||[]).filter(id => id!==b.dataset.cid);
    if (draft.counts) delete draft.counts[b.dataset.cid];
    save(); renderStay();
    return;
  }
  if (act==="game-reset"){
    if (!confirm("Reset XP, badges and best times? Your stock data is not touched.")) return;
    localStorage.removeItem(GSTORE); gLoad(); render(); toast("Game stats reset"); return;
  }
  if (act==="scan-ward"){
    const ward = wardById(b.dataset.wid); if (!ward) return;
    openScanner(ward.siteId, (c) => { addCodeToWard(ward.id, c.id); toast("Added " + displayCode(c) + " to " + ward.name); }, "Scan for " + ward.name);
    return;
  }
  if (act==="scan-stock"){
    openScanner(currentSiteId(), (c) => {
      stockQuery = displayCode(c);
      render();
      const row = document.querySelector('.stockrow[data-cid="' + (window.CSS && CSS.escape ? CSS.escape(c.id) : c.id) + '"]');
      if (row){ row.classList.add("flash"); row.scrollIntoView({block:"center"}); }
      toast("Found " + displayCode(c) + (c.name ? " · " + c.name : ""));
    }, "Scan to find an item");
    return;
  }
  if (act==="export-xlsx"){ exportXlsx(); return; }
  if (act==="export-csv"){ exportCsv(); return; }
  if (act==="set-site") setCurrentSite(b.dataset.id);
  if (act==="open-ward") openWard(b.dataset.id);
  if (act==="suggest-add"){ addSuggested(b.dataset.wid, b.dataset.cid, b.dataset.qty, b.dataset.unit); return; }
  if (act==="suggest-more"){ usualExpanded[b.dataset.wid] = !usualExpanded[b.dataset.wid]; renderStay(); return; }
  if (act==="add-code") addCodeToWard(b.dataset.wid, b.dataset.cid);
  if (act==="ward-pane"){
    wardPane = b.dataset.pane==="notes" ? "notes" : "codes";
    renderStay();
    if (wardPane==="codes"){
      const inp = document.querySelector('input[data-act="filter-fluid"]');
      if (inp && fluidQuery) inp.focus();
    }
    return;
  }
  if (act==="clear-fluid-search"){
    fluidQuery = "";
    const inp = document.querySelector('input[data-act="filter-fluid"]');
    if (inp){
      inp.value = "";
      inp.dispatchEvent(new Event("input", {bubbles:true}));
      inp.focus();
    }
    return;
  }
  if (act==="jump-ward"){
    const el = document.getElementById("trolley-" + b.dataset.wid);
    if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
    document.querySelectorAll(".wardjumps [data-act=jump-ward]").forEach(x => x.classList.toggle("on", x.dataset.wid===b.dataset.wid));
    return;
  }
  if (act==="load-tick") toggleTrolleyLoaded(b.dataset.wid, b.dataset.cid);
  if (act==="load-tick-ward") toggleWardTrolleyLoaded(b.dataset.wid);
  if (act==="qty") changeQty(b.dataset.wid, b.dataset.cid, Number(b.dataset.dir));
  if (act==="line-unit") toggleLineUnit(b.dataset.wid, b.dataset.cid);
  if (act==="remove-line") removeLine(b.dataset.wid, b.dataset.cid);
  if (act==="mark") markWard(b.dataset.wid, b.dataset.status);
  if (act==="tick") tickItem(b.dataset.wid, b.dataset.cid);
  if (act==="carry-over"){ beginCarryOver(b.dataset.wid, z.iso); return; }
  if (act==="transfer-unticked"){ beginTransferUnticked(b.dataset.wid, z.iso); return; }
  if (act==="transfer-one"){ beginTransferOne(b.dataset.wid, b.dataset.cid, z.iso); return; }
  if (act==="undo-move"){ undoMove(); return; }
  if (act==="transfer-pick"){
    const iso = b.dataset.iso;
    const pick = pendingTransfer && pendingTransfer.onPick;
    closeDayPicker();
    if (pick) pick(iso);
    return;
  }
  if (act==="transfer-any"){
    const inp = document.getElementById("transfer-any");
    const iso = inp && inp.value;
    const fromIso = pendingTransfer && pendingTransfer.fromIso;
    if (!iso || (fromIso && iso<=fromIso)){ toast("Pick a later day"); return; }
    const pick = pendingTransfer && pendingTransfer.onPick;
    closeDayPicker();
    if (pick) pick(iso);
    return;
  }
  if (act==="stock") changeStock(b.dataset.cid, Number(b.dataset.dir));
  if (act==="stock-save"){ saveStocktake(b.dataset.site || currentSiteId()); return; }
  if (act==="stock-delivery-add"){ addStockDelivery(b.dataset.site || currentSiteId()); return; }
  if (act==="stock-delivery-unit"){
    const siteId = b.dataset.site || currentSiteId();
    const d = deliveryDraft(siteId);
    d.unit = stockUnit(d.unit)==="ea" ? "box" : "ea";
    save(); renderStay(); return;
  }
  if (act==="stock-restore"){ restoreStockItem(b.dataset.site, b.dataset.cid); return; }
  if (act==="other-code"){
    const ward = wardById(b.dataset.wid);
    const sid = ward ? ward.siteId : currentSiteId();
    promptDlg("Add a code", [{label:"Code", value:"", placeholder:"e.g. 7113"}], ([code]) => {
      code = String(code||"").trim();
      if (!code) return;
      let c = siteCodes(sid).find(x => !x.tickOnly && x.code.toLowerCase()===code.toLowerCase())
        || siteCodes(sid).find(x => displayCode(x).toLowerCase()===code.toLowerCase());
      if (!c){
        c = newCode(code, "", sid);
        S.codes.push(c);
      }
      addCodeToWard(b.dataset.wid, c.id);
    });
  }
  if (act==="urgent"){
    const d = ensureDraft(z);
    d.urgent = b.checked;
    d.expectedDelivery = defaultDelivery(z.iso, d.urgent);
    save(); renderStay();
  }
  if (act==="order-qty"){
    const d = ensureDraft(z);
    const line = d.lines.find(l => l.codeId===b.dataset.cid);
    if (!line) return;
    const next = Math.max(0, (Number(line.qty)||0) + Number(b.dataset.dir));
    line.qty = next===0 ? "" : next;
    line.unit = "box";
    line.edited = true;
    save(); renderStay();
  }
  if (act==="order-unit"){
    const d = ensureDraft(z);
    const line = d.lines.find(l => l.codeId===b.dataset.cid);
    if (!line) return;
    line.unit = lineUnit(line)==="ea" ? "box" : "ea";
    save(); renderStay();
  }
  if (act==="order-remove"){
    const d = ensureDraft(z);
    d.lines = d.lines.filter(l => l.codeId!==b.dataset.cid);
    save(); renderStay();
  }
  if (act==="order-add"){
    const sid = currentSiteId();
    promptDlg("Add to order", [{label:"Code", placeholder:"e.g. 7113"},{label:"Quantity", value:"1", attr:"inputmode=\"numeric\""}], ([code, qty]) => {
      code = String(code||"").trim();
      const q = Math.max(0, Number(qty)||0);
      if (!code || !q) return;
      let c = siteCodes(sid).find(x => !x.tickOnly && x.code.toLowerCase()===code.toLowerCase())
        || siteCodes(sid).find(x => displayCode(x).toLowerCase()===code.toLowerCase());
      if (!c){ c = newCode(code, "", sid); S.codes.push(c); save(); }
      const d = ensureDraft(z);
      const line = d.lines.find(l => l.codeId===c.id);
      if (line){ line.qty = q; line.unit = "box"; } else d.lines.push({codeId:c.id, qty:q||"", unit:"box"});
      save(); renderStay();
    });
  }
  if (act==="order-refresh"){
    const d = ensureDraft(z);
    rebuildDraftKeepEdits(z, d.siteId);
    save(); renderStay();
    toast("Order amounts updated from par and on hand");
  }
  if (act==="order-copy"){
    const text = orderMessage(ensureDraft(z));
    copyText(text).then(ok => toast(ok ? "Message copied" : "Copy failed — long-press to copy"));
  }
  if (act==="order-share"){
    const text = orderMessage(ensureDraft(z));
    const url = waLink(text);
    if (navigator.share){
      navigator.share({text}).catch(()=>{ window.location.href = url; });
    } else {
      window.location.href = url;
    }
  }
  if (act==="order-send"){
    const d = ensureDraft(z);
    const sentLines = (d.lines||[]).filter(orderHasQty);
    if (!sentLines.length){ toast("Type a quantity on at least one line"); return; }
    S.orders.push({
      id: uid("o-"),
      date: d.date,
      sentAt: new Date().toISOString(),
      sentDate: z.iso,
      urgent: !!d.urgent,
      expectedDelivery: d.expectedDelivery,
      siteId: d.siteId,
      lines: sentLines.map(l => ({codeId:l.codeId, qty:l.qty, unit:"box"})),
      message: orderMessage(Object.assign({}, d, {lines:sentLines}))
    });
    save();
    render();
    toast("Order logged · delivery " + shortDate(d.expectedDelivery));
    /* points UI removed; stored game data is left in place */
  }
  if (act==="export") exportBackup();
  if (act==="import"){
    const inp = document.getElementById("import-file");
    if (inp) inp.click();
  }
  if (act==="ward-move"){
    const sid = currentSiteId();
    const list = S.wards.filter(w => w.siteId===sid && !isRetiredWard(w)).sort((a,b)=>a.order-b.order);
    const i = list.findIndex(w => w.id===b.dataset.id);
    const j = i + Number(b.dataset.dir);
    if (i<0 || j<0 || j>=list.length) return;
    const tmp = list[i]; list[i]=list[j]; list[j]=tmp;
    list.forEach((w,k)=>w.order=k);
    list.forEach(w => shareTouchWardDef(w));
    save(); render(); shareKick();
  }
  if (act==="ward-day"){
    const w = wardById(b.dataset.id); if (!w) return;
    const d = Number(b.dataset.day);
    if (w.onCall) w.onCall = false;
    let days = Array.isArray(w.days) ? w.days.slice() : [0,1,2,3,4,5,6];
    if (days.includes(d)) days = days.filter(x => x!==d);
    else days = days.concat([d]).sort((a,c)=>a-c);
    w.days = days;
    shareTouchWardDef(w);
    save(); render(); shareKick();
    return;
  }
  if (act==="ward-add" || act==="add-round-ward"){
    promptDlg("Add a ward", [{label:"Ward name", placeholder:"e.g. 4n"}], ([name]) => {
      const w = addCustomWard(name, currentSiteId());
      if (w) render();
    });
  }
  if (act==="star-fluid"){
    ev.preventDefault();
    ev.stopPropagation();
    const sid = currentSiteId();
    toggleStar(sid, b.dataset.cid);
    renderStay();
    return;
  }
  if (act==="toggle-prabin"){
    S.settings.showPrabinArea = !!b.checked;
    if (!S.settings.showPrabinArea && S.settings.currentSiteId===SITE_PRABIN){
      S.settings.currentSiteId = SITE_CH;
    }
    save();
    render();
    return;
  }
  if (act==="code-add"){
    const sid = currentSiteId();
    promptDlg("Add code", [{label:"Code"},{label:"Name (optional)"}], ([code,name]) => {
      code = String(code||"").trim(); if (!code) return;
      if (siteCodes(sid).some(c => !c.tickOnly && c.code.toLowerCase()===code.toLowerCase())){ toast("That code is already on the list"); return; }
      S.codes.push(newCode(code, String(name||"").trim(), sid));
      save(); render();
    });
  }
  if (act==="site-add"){
    promptDlg("Add site", [{label:"Site name", placeholder:"A short label you choose"}], ([name]) => {
      name = String(name||"").trim(); if (!name) return;
      S.sites.push({id:"s-"+uid(""), name});
      save(); render();
    });
  }
  if (act==="site-del"){
    if (S.sites.length<=1) return;
    const fallback = S.sites.find(s => s.id!==b.dataset.id);
    S.wards.forEach(w => { if (w.siteId===b.dataset.id) w.siteId = fallback.id; });
    S.codes.forEach(c => { if (c.siteId===b.dataset.id) c.siteId = fallback.id; });
    S.sites = S.sites.filter(s => s.id!==b.dataset.id);
    if (S.settings.currentSiteId===b.dataset.id) S.settings.currentSiteId = fallback.id;
    draftOrder = null;
    save(); render();
  }
  if (act==="notify-ask"){
    if (!("Notification" in window)){ toast("Notifications are not available in this browser"); return; }
    Notification.requestPermission().then(p => {
      toast(p==="granted" ? "Reminders on for order days" : "Permission not granted");
      maybeNotify(zonedNow());
    });
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  const act = t.dataset && t.dataset.act;
  if (!act) return;
  const z = zonedNow();
  if (act==="delivery"){ ensureDraft(z).expectedDelivery = t.value; save(); }
  if (act==="ward-on"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.enabled = t.checked;
    shareTouchWardDef(w);
    save(); render(); shareKick();
  }
  if (act==="ward-oncall"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.onCall = t.checked;
    if (w.onCall) w.days = [];
    else if (!Array.isArray(w.days) || !w.days.length) w.days = (w.siteId===SITE_POW || w.siteId===SITE_PRABIN) ? [2,4] : [1,2,3,4,5];
    shareTouchWardDef(w);
    save(); render(); shareKick();
  }
  if (act==="code-par"){
    const c = codeById(t.dataset.id); if (!c) return;
    setCodePar(c, t.value);
  }
  if (act==="stock-delivery-code"){
    deliveryDraft(t.dataset.site || currentSiteId()).codeId = t.value;
    save();
  }
  if (act==="stock-delivery-date"){
    deliveryDraft(t.dataset.site || currentSiteId()).date = t.value;
    save();
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  const act = t.dataset && t.dataset.act;
  if (!act) return;
  if (act==="filter-stock"){
    stockQuery = t.value;
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll(".stockrow, .oh-row, .par-row").forEach(row => {
      row.style.display = !q || (row.dataset.name||"").includes(q) ? "" : "none";
    });
  }
  if (act==="spot-count"){
    const sid = currentSiteId();
    if (!S.spotDraft) S.spotDraft = {};
    if (!S.spotDraft[sid]) S.spotDraft[sid] = {picked:[], counts:{}};
    S.spotDraft[sid].counts[t.dataset.cid] = t.value;
    save();
    /* Update variance label without a full re-render so the caret stays put. */
    const row = t.closest(".co-row");
    if (row){
      const n = t.value==="" ? null : Number(t.value);
      const c = codeById(t.dataset.cid);
      const u = c ? onHandUnits(sid, c.id) : null;
      const expBox = u ? onHandBoxes(u) : 0;
      let el = row.querySelector(".var-ok, .var-short, .var-over, .muted:last-child");
      /* rebuild last status node after the input */
      const nodes = [...row.querySelectorAll("span, input")];
    }
    renderStay();
    const inp = document.querySelector('input[data-act=spot-count][data-cid="'+t.dataset.cid+'"]');
    if (inp){ inp.focus(); }
    return;
  }
  if (act==="filter-fluid"){
    fluidQuery = t.value;
    const q = t.value.trim().toLowerCase();
    let any = false;
    document.querySelectorAll(".codewrap").forEach(row => {
      const show = !q || (row.dataset.name||"").includes(q);
      row.style.display = show ? "" : "none";
      if (show) any = true;
    });
    document.querySelectorAll(".fluid-group, .favblock").forEach(block => {
      const vis = Array.from(block.querySelectorAll(".codewrap")).some(el => el.style.display !== "none");
      block.style.display = vis ? "" : "none";
    });
    const nom = document.querySelector(".fluid-nomatch");
    if (nom){ if (q && !any) nom.removeAttribute("hidden"); else nom.setAttribute("hidden",""); }
    const clr = document.querySelector('[data-act=clear-fluid-search]');
    if (clr) clr.hidden = !t.value;
  }
  if (act==="stock-count"){
    setStockDraft(t.dataset.site || currentSiteId(), t.dataset.cid, t.value);
    save();
  }
  if (act==="order-qty-in"){
    const d = ensureDraft(zonedNow());
    const line = d.lines.find(l => l.codeId===t.dataset.cid);
    if (!line) return;
    line.qty = t.value;
    line.unit = "box";
    line.edited = true;
    save();
  }
  if (act==="stock-delivery-qty"){
    deliveryDraft(t.dataset.site || currentSiteId()).qty = t.value;
    save();
  }
  if (act==="ward-name"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.name = t.value;
    shareTouchWardDef(w);
    save(); shareKick();
  }
  if (act==="ward-building"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.building = t.value;
    shareTouchWardDef(w);
    save(); shareKick();
  }
  if (act==="ward-notes"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.notes = t.value;
    shareTouchWardDef(w);
    save(); shareKick();
  }
  if (act==="ward-private"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.privateNote = t.value; save();
  }
  if (act==="code-code"){
    const c = codeById(t.dataset.id); if (!c || c.tickOnly) return;
    c.code = t.value; save();
  }
  if (act==="code-name"){
    const c = codeById(t.dataset.id); if (!c) return;
    c.name = t.value; save();
  }
  if (act==="site-name"){
    const s = siteById(t.dataset.id); if (!s) return;
    s.name = t.value; save(); render();
  }
  if (act==="set-partner"){ S.settings.partnerName = t.value; save(); }
  if (act==="set-wa"){ S.settings.waNumber = t.value; save(); }
  if (act==="code-par"){
    const c = codeById(t.dataset.id); if (!c) return;
    setCodePar(c, t.value);
  }
  if (act==="code-pack"){
    const c = codeById(t.dataset.id); if (!c || c.tickOnly) return;
    const n = Number(t.value);
    if (t.value==="" || !Number.isFinite(n) || n<=0) delete c.eachPerBox;
    else c.eachPerBox = Math.floor(n);
    shareTouchPack && shareTouchPack(c);
    save();
    shareKick();
  }
});

document.addEventListener("change", (ev) => {
  if (ev.target && ev.target.id==="import-file" && ev.target.files && ev.target.files[0]){
    importBackup(ev.target.files[0]);
    ev.target.value = "";
  }
  const t = ev.target;
  if (t && t.dataset && t.dataset.act==="history-date"){
    const v = String(t.value||"");
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)){
      histRange = "day";
      histAnchor = v;
      location.hash = "history/" + v;
    }
  }
  if (t && t.dataset && t.dataset.act==="hist-export-day"){
    const v = String(t.value||"");
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)){
      histRange = "day";
      histAnchor = v;
      if (route.page==="history" && route.day) location.hash = "history/" + v;
      else render();
    }
  }
  if (t && t.dataset && t.dataset.act==="hist-export-month"){
    const v = String(t.value||"");
    if (/^\d{4}-\d{2}$/.test(v)){
      histRange = "month";
      histAnchor = v + "-01";
      render();
    }
  }
});

document.addEventListener("keydown", (ev) => {
  const t = ev.target;
  if (!t || !t.dataset || t.dataset.act!=="filter-fluid") return;
  if (ev.key!=="Enter") return;
  ev.preventDefault();
  const vis = Array.from(document.querySelectorAll(".codewrap")).filter(el => el.style.display !== "none");
  if (vis.length!==1) return;
  const btn = vis[0].querySelector('[data-act=add-code]');
  if (btn) btn.click();
});

window.addEventListener("hashchange", () => {
  if (!/^#stock/.test(location.hash)) stockQuery = "";
  if (!/^#round\//.test(location.hash)){ fluidQuery = ""; wardPane = "codes"; }
  const raw = (location.hash||"").replace(/^#/, "");
  if (raw.indexOf("history/")===0){
    const day = decodeURIComponent(raw.slice(8));
    if (/^\d{4}-\d{2}-\d{2}$/.test(day)){
      histRange = "day";
      histAnchor = day;
    }
  }
  clearTimeout(toastTimer);
  document.getElementById("toast").classList.remove("show");
  render();
  if (S && S.settings){
    S.settings.lastHash = (location.hash||"").replace(/^#/, "") || "round";
    if (resumeScroll==null) S.settings.lastScroll = window.scrollY || document.documentElement.scrollTop || 0;
    save();
  }
});
window.addEventListener("pageshow", render);
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="hidden") flushSave(); });
window.addEventListener("pagehide", flushSave);
window.addEventListener("scroll", () => {
  if (!S || !S.settings) return;
  S.settings.lastScroll = window.scrollY || document.documentElement.scrollTop || 0;
  S.settings.lastHash = (location.hash||"").replace(/^#/, "") || "round";
  save();
}, {passive:true});

document.addEventListener("pointerdown", (ev) => { lastTap = {x:ev.clientX, y:ev.clientY}; }, true);
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
load();
gLoad();
if (!location.hash){
  const last = S && S.settings && S.settings.lastHash;
  if (last){
    resumeScroll = Number(S.settings.lastScroll)||0;
    location.hash = "#" + last;
    setTimeout(() => { resumeScroll = null; }, 500);
  } else {
    location.hash = "#round";
  }
} else render();

if (/[?&]e2e=1(?:&|$)/.test(location.search)){
  window.__fr = {applyRemoteBarcode, linkBarcode, renderOrderCloseoutText, zonedNow, bLoad, bSave, latestCloseout, saveDailyCloseout, missingBarcodeCodes, render, save, codeById, setCodePar, S, patch(fn){ fn(S, G); save(); }};
}
if ("serviceWorker" in navigator && !/e2e=1/.test(location.search)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
if (!staffName()) setTimeout(() => askStaffName(false), 0);
shareStart();
})();
</script>
</body>
</html>
