function wardFromDef(def, i, siteId, enabled){
  const w = {id:def.id, name:def.name, order:i, siteId:siteId, enabled:enabled!==false, building:def.building||"", notes:def.notes||"", privateNote:"", onCall:!!def.onCall};
  if (w.onCall) w.days = [];
  else if (def.days) w.days = def.days.slice();
  else if (siteId===SITE_POW) w.days = [2,4];
  return w;
}
function applyPowDef(w, def, i){
  w.id = def.id;
  w.name = def.name;
  w.order = i;
  w.siteId = SITE_POW;
  w.building = def.building||"";
  w.notes = def.notes||"";
  w.onCall = !!def.onCall;
  w.days = w.onCall ? [] : (def.days ? def.days.slice() : [2,4]);
  if (w.privateNote == null) w.privateNote = "";
  if (w.enabled == null) w.enabled = true;
}
function isPowPlaceholder(w){
  if (!w) return false;
  return POW_PLACEHOLDERS.some(p => p.id===w.id || String(w.name||"").toLowerCase()===p.name.toLowerCase());
}
function wardIsOnCall(w){ return !!(w && w.onCall); }
function wardScheduledOn(w, dow){
  if (!w || w.enabled===false) return false;
  if (w.onCall) return false;
  if (!Array.isArray(w.days)) return true;
  return w.days.includes(dow);
}
function scheduledWards(siteId, iso){
  const sid = siteId || currentSiteId();
  const dow = dowOf(iso || zonedNow().iso);
  return S.wards.filter(w => w.enabled && w.siteId===sid && wardScheduledOn(w, dow)).sort((a,b)=>a.order-b.order);
}
function onCallWards(siteId){
  const sid = siteId || currentSiteId();
  return S.wards.filter(w => w.enabled && w.siteId===sid && w.onCall).sort((a,b)=>a.order-b.order);
}
function fmtDays(w){
  if (!w) return "";
  if (w.onCall) return "On call";
  if (!Array.isArray(w.days)) return "Every day";
  if (!w.days.length) return "Not scheduled";
  if (w.days.length===3 && w.days[0]===1 && w.days[1]===3 && w.days[2]===5) return "Mon, Wed, Fri";
  if (w.days.length===2 && w.days[0]===2 && w.days[1]===4) return "Tue, Thu";
  if (w.days.length===1) return DAY_LABELS[w.days[0]] + " only";
  return w.days.map(d => DAY_LABELS[d]).join(", ");
}
function buildingRank(name){
  const i = POW_BUILDINGS.indexOf(name||"");
  return i < 0 ? 99 : i;
}
function groupByBuilding(wards){
  const map = new Map();
  wards.forEach(w => {
    const b = w.building || "";
    if (!map.has(b)) map.set(b, []);
    map.get(b).push(w);
  });
  return [...map.entries()].sort((a,b) => buildingRank(a[0]) - buildingRank(b[0]) || (a[0]||"").localeCompare(b[0]||""));
}

function defaultState(){
  const wards = [];
  POW_WARD_DEFS.forEach((w,i) => wards.push(wardFromDef(w,i,SITE_POW,true)));
  CH_WARD_DEFS.forEach((w,i) => wards.push({id:w.id, name:w.name, order:i, siteId:SITE_CH, enabled:true}));
  CH_EXTRA_WARDS.forEach((w,i) => wards.push({id:w.id, name:w.name, order:CH_WARD_DEFS.length+i, siteId:SITE_CH, enabled:false}));
  const codes = [];
  POW_CATALOG.forEach(p => {
    codes.push({id:"c-pow-"+p.code, code:p.code, name:p.name||"", note:p.note||"", kcl:!!p.kcl, tickOnly:false, unit:"box", par:0, stock:0, siteId:SITE_POW, seed:0});
  });
  const seedAt = Object.fromEntries(CH_SEED.map((c,i)=>[c, CH_SEED.length-i]));
  CH_CODES.forEach(code => {
    codes.push({id:"c-"+code, code, name:powNameFor(code), note:"", kcl:false, tickOnly:false, unit:"box", par:0, stock:0, siteId:SITE_CH, seed:seedAt[code]||0});
  });
  CH_TICKS.forEach(name => {
    codes.push({id:"c-"+slug(name), code:"", name, note:"", kcl:false, tickOnly:true, unit:"box", par:0, stock:0, siteId:SITE_CH, seed:0});
  });
  return {
    version: 2,
    appVersion: VERSION,
    powWardSeed: POW_WARD_SEED,
    sites: [
      {id:SITE_POW, name:"POW"},
      {id:SITE_CH, name:"Children's"}
    ],
    wards,
    codes,
    settings: {
      partnerName: "",
      waNumber: "",
      orderWeekdays: [2,4],
      orderHour: 11,
      currentSiteId: SITE_CH
    },
    rounds: {},
    orders: [],
    trolley: {}
  };
}

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if (!raw){ S = defaultState(); save(); return; }
    S = JSON.parse(raw);
    migrate(S);
    save();
  }catch(e){
    S = defaultState();
  }
}
function siteExists(s, id){ return (s.sites||[]).some(x => x.id===id); }
function findSiteCode(s, siteId, code){
  const bare = bareProductCode(code);
  return (s.codes||[]).find(c => c.siteId===siteId && !c.tickOnly && bareProductCode(c.code)===bare);
}
function findTick(s, siteId, name){
  const n = String(name||"").toLowerCase();
  return (s.codes||[]).find(c => c.siteId===siteId && (c.tickOnly || !c.code) && String(c.name||"").toLowerCase()===n);
}

function migrate(s){
  if (!s.sites) s.sites = [];
  if (!s.wards) s.wards = [];
  if (!s.codes) s.codes = [];
  if (!s.rounds) s.rounds = {};
  if (!s.orders) s.orders = [];
  if (!s.trolley) s.trolley = {};
  if (!s.settings) s.settings = {};
  const st = s.settings;
  if (st.partnerName == null) st.partnerName = "";
  if (st.waNumber == null) st.waNumber = "";
  if (!st.orderWeekdays) st.orderWeekdays = [2,4];
  if (st.orderHour == null) st.orderHour = 11;

  if (!siteExists(s, SITE_POW)) s.sites.push({id:SITE_POW, name:"POW"});
  else {
    const pow = s.sites.find(x => x.id===SITE_POW);
    if (pow && (!pow.name || pow.name==="Main")) pow.name = "POW";
  }
  if (!siteExists(s, SITE_CH)) s.sites.push({id:SITE_CH, name:"Children's"});
  else {
    const ch = s.sites.find(x => x.id===SITE_CH);
    if (ch && !ch.name) ch.name = "Children's";
  }
  const powS = s.sites.find(x => x.id===SITE_POW);
  const chS = s.sites.find(x => x.id===SITE_CH);
  const rest = s.sites.filter(x => x.id!==SITE_POW && x.id!==SITE_CH && x.id!=="s-main");
  s.sites = [powS, chS, ...rest].filter(Boolean);

  const chIds = new Set(CH_WARD_DEFS.concat(CH_EXTRA_WARDS).map(w => w.id));
  const chNames = new Set(CH_WARD_DEFS.concat(CH_EXTRA_WARDS).map(w => w.name.toLowerCase()));
  Object.keys(CH_RENAME).forEach(k => chNames.add(k.toLowerCase()));
  chNames.add("rec 2 room a"); chNames.add("rec 2 room b");

  s.wards.forEach((w,i) => {
    if (w.order == null) w.order = i;
    if (w.enabled == null) w.enabled = true;
    if (CH_RENAME[w.name]) w.name = CH_RENAME[w.name];
    if (isOt2Name(w.name)) w.enabled = false;
    if (!w.siteId || w.siteId==="s-main" || !siteExists(s, w.siteId)){
      w.siteId = SITE_CH;
    }
  });
  s.orders.forEach(o => {
    if (!o.siteId || o.siteId==="s-main") o.siteId = SITE_CH;
  });

  const haveId = new Set(s.wards.map(w => w.id));
  const haveName = new Set(s.wards.filter(w => w.siteId===SITE_CH).map(w => String(w.name||"").toLowerCase()));
  CH_WARD_DEFS.forEach((def, i) => {
    if (isOt2Name(def.name)) return;
    const exists = haveId.has(def.id) || haveName.has(def.name.toLowerCase());
    if (exists){
      const w = s.wards.find(x => x.id===def.id) || s.wards.find(x => x.siteId===SITE_CH && String(x.name).toLowerCase()===def.name.toLowerCase());
      if (w && w.siteId!==SITE_CH) w.siteId = SITE_CH;
      return;
    }
    s.wards.push({id:def.id, name:def.name, order:i, siteId:SITE_CH, enabled:true});
    haveId.add(def.id); haveName.add(def.name.toLowerCase());
  });
  CH_EXTRA_WARDS.forEach((def, i) => {
    if (haveId.has(def.id) || haveName.has(def.name.toLowerCase())) return;
    s.wards.push({id:def.id, name:def.name, order:CH_WARD_DEFS.length+i, siteId:SITE_CH, enabled:false});
  });
  const chIndex = Object.fromEntries(CH_WARD_DEFS.concat(CH_EXTRA_WARDS).map((w,i)=>[w.id,i]));
  const chByName = Object.fromEntries(CH_WARD_DEFS.concat(CH_EXTRA_WARDS).map((w,i)=>[w.name.toLowerCase(),i]));
  Object.keys(CH_RENAME).forEach(k => { chByName[k.toLowerCase()] = chByName[CH_RENAME[k].toLowerCase()]; });
  const chWards = s.wards.filter(w => w.siteId===SITE_CH);
  const known = chWards.filter(w => chIndex[w.id]!=null || chByName[String(w.name||"").toLowerCase()]!=null)
    .sort((a,b) => (chIndex[a.id]??chByName[String(a.name||"").toLowerCase()]??99) - (chIndex[b.id]??chByName[String(b.name||"").toLowerCase()]??99));
  const unknown = chWards.filter(w => !known.includes(w)).sort((a,b)=>a.order-b.order);
  known.concat(unknown).forEach((w,i) => { w.order = i; });

  const seed = Number(s.powWardSeed)||0;
  if (seed < POW_WARD_SEED){
    s.wards.forEach(w => {
      if (w.siteId===SITE_POW && isPowPlaceholder(w)) w.enabled = false;
    });
    const haveId = new Set(s.wards.map(w => w.id));
    POW_WARD_DEFS.forEach((def,i) => {
      let w = s.wards.find(x => x.id===def.id);
      if (!w){
        s.wards.push(wardFromDef(def,i,SITE_POW,true));
        haveId.add(def.id);
      } else {
        applyPowDef(w, def, i);
        if (w.enabled == null) w.enabled = true;
      }
    });
    s.powWardSeed = POW_WARD_SEED;
  }
  const powOfficial = new Set(POW_WARD_DEFS.map(d => d.id));
  const powKnown = s.wards.filter(w => w.siteId===SITE_POW && powOfficial.has(w.id))
    .sort((a,b) => (POW_WARD_DEFS.findIndex(d => d.id===a.id)) - (POW_WARD_DEFS.findIndex(d => d.id===b.id)));
  const powRest = s.wards.filter(w => w.siteId===SITE_POW && !powOfficial.has(w.id)).sort((a,b)=>(a.order||0)-(b.order||0));
  powKnown.concat(powRest).forEach((w,i) => { w.order = i; });
  s.wards.forEach(w => {
    if (w.building == null) w.building = "";
    if (w.notes == null) w.notes = "";
    if (w.privateNote == null) w.privateNote = "";
    if (w.onCall == null) w.onCall = false;
  });

  s.sites = s.sites.filter(x => x.id!=="s-main");

  s.codes.forEach(c => {
    if (c.par == null) c.par = 0;
    if (c.stock == null) c.stock = 0;
    if (c.name == null) c.name = "";
    if (c.note == null) c.note = "";
    if (c.kcl == null) c.kcl = false;
    if (c.tickOnly == null) c.tickOnly = !String(c.code||"").trim() && !!c.name;
    if (c.seed == null) c.seed = 0;
    if (!c.unit || c.unit==="EA" || c.unit==="ea") c.unit = "box";
    if (!c.siteId || c.siteId==="s-main") c.siteId = SITE_CH;
  });

  const seedAt = Object.fromEntries(CH_SEED.map((c,i)=>[c, CH_SEED.length-i]));
  CH_CODES.forEach(code => {
    let c = findSiteCode(s, SITE_CH, code);
    if (!c){
      c = {id:"c-"+code, code, name:powNameFor(code), note:"", kcl:false, tickOnly:false, unit:"box", par:0, stock:0, siteId:SITE_CH, seed:seedAt[code]||0};
      s.codes.push(c);
    } else {
      if (!c.name) c.name = powNameFor(code);
      if (seedAt[code] && !c.seed) c.seed = seedAt[code];
      if (bareProductCode(c.code)===code && c.code.toUpperCase()!==code) c.code = code;
    }
  });
  CH_TICKS.forEach(name => {
    let c = findTick(s, SITE_CH, name);
    if (!c){
      s.codes.push({id:"c-"+slug(name), code:"", name, note:"", kcl:false, tickOnly:true, unit:"box", par:0, stock:0, siteId:SITE_CH, seed:0});
    } else {
      c.tickOnly = true;
      c.name = name;
      if (c.code && c.code.toLowerCase()===name.toLowerCase()) c.code = "";
    }
  });
  POW_CATALOG.forEach(p => {
    let c = findSiteCode(s, SITE_POW, p.code);
    if (!c){
      s.codes.push({id:"c-pow-"+p.code, code:p.code, name:p.name||"", note:p.note||"", kcl:!!p.kcl, tickOnly:false, unit:"box", par:0, stock:0, siteId:SITE_POW, seed:0});
    } else {
      if (!c.name) c.name = p.name||"";
      if (p.note && !c.note) c.note = p.note;
      if (p.kcl) c.kcl = true;
    }
  });

  Object.values(s.rounds).forEach(round => {
    Object.entries(round.wards||{}).forEach(([wid, entry]) => {
      const w = (s.wards||[]).find(x => x.id===wid);
      if (w && !entry.siteId) entry.siteId = w.siteId;
      (entry.lines||[]).forEach(line => {
        if (!line.unit || line.unit==="EA") line.unit = "box";
        const c = (s.codes||[]).find(x => x.id===line.codeId);
        if (c){
          if (!line.code) line.code = displayCode(c);
          if (line.name==null || line.name==="") line.name = c.name||"";
        }
      });
    });
  });
  (s.orders||[]).forEach(o => {
    (o.lines||[]).forEach(line => {
      if (!line.unit || line.unit==="EA") line.unit = "box";
    });
  });

  if (!st.currentSiteId || st.currentSiteId==="s-main" || !siteExists(s, st.currentSiteId)){
    st.currentSiteId = SITE_CH;
  }
  s.version = Math.max(Number(s.version)||1, 2);
  s.appVersion = VERSION;
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(S)); }
  catch(e){ toast("Could not save — storage may be full"); }
}

function currentSiteId(){
  const id = S.settings && S.settings.currentSiteId;
  if (id && siteById(id)) return id;
  return (S.sites[0]&&S.sites[0].id) || SITE_POW;
}
function setCurrentSite(id){
  if (!siteById(id)) return;
  S.settings.currentSiteId = id;
  draftOrder = null;
  save();
  if (route.page==="round-ward"){
    const w = wardById(route.wardId);
    if (!w || w.siteId!==id){ location.hash = "round"; return; }
  }
  render();
}
function enabledWards(){
  const sid = currentSiteId();
  return S.wards.filter(w => w.enabled && w.siteId===sid).sort((a,b)=>a.order-b.order);
}
function siteCodes(siteId){
  const sid = siteId || currentSiteId();
  return S.codes.filter(c => c.siteId===sid);
}
function wardById(id){ return S.wards.find(w => w.id===id); }
function codeById(id){ return S.codes.find(c => c.id===id); }
function siteById(id){ return S.sites.find(s => s.id===id); }
function codeOrder(siteId){
  return siteCodes(siteId).slice().sort((a,b) => (b.seed||0)-(a.seed||0) || String(a.code||a.name).localeCompare(String(b.code||b.name))).map(c => c.id);
}

function todayRound(){
  const day = zonedNow().iso;
  if (!S.rounds[day]){
    S.rounds[day] = {date:day, wards:{}};
  }
  return S.rounds[day];
}
function wardEntry(round, wardId){
  if (!round.wards[wardId]) round.wards[wardId] = {status:"pending", lines:[]};
  return round.wards[wardId];
}

function qtyNum(q){
  if (q==="" || q==null) return null;
  const n = Number(q);
  return Number.isFinite(n) ? n : null;
}
function usageQty(q){
  const n = qtyNum(q);
  return n==null ? 1 : n;
}

function popularity(){
  const overall = {};
  const byWard = {};
  const bySite = {};
  function bump(bag, id, qty, day){
    if (!bag[id]) bag[id] = {qty:0, hits:0, last:"", seed:0};
    bag[id].qty += qty;
    bag[id].hits += 1;
    if (day > bag[id].last) bag[id].last = day;
  }
  Object.values(S.rounds).forEach(round => {
    const day = round.date;
    Object.entries(round.wards||{}).forEach(([wid, entry]) => {
      const ward = wardById(wid);
      const siteId = ward ? ward.siteId : SITE_CH;
      if (!byWard[wid]) byWard[wid] = {};
      if (!bySite[siteId]) bySite[siteId] = {};
      (entry.lines||[]).forEach(line => {
        const q = usageQty(line.qty);
        bump(overall, line.codeId, q, day);
        bump(byWard[wid], line.codeId, q, day);
        bump(bySite[siteId], line.codeId, q, day);
      });
    });
  });
  S.codes.forEach(c => {
    if (!c.seed) return;
    const sid = c.siteId;
    if (!bySite[sid]) bySite[sid] = {};
    if (!overall[c.id]) overall[c.id] = {qty:0, hits:0, last:"", seed:c.seed};
    else overall[c.id].seed = c.seed;
    if (!bySite[sid][c.id]) bySite[sid][c.id] = {qty:0, hits:0, last:"", seed:c.seed};
    else bySite[sid][c.id].seed = c.seed;
  });
  return {overall, byWard, bySite};
}
function rankedIds(bag, fallback){
  const ids = Object.keys(bag||{});
  ids.sort((a,b) => {
    const A = bag[a]||{}, B = bag[b]||{};
    return (B.qty||0)-(A.qty||0) || (B.hits||0)-(A.hits||0) || String(B.last||"").localeCompare(String(A.last||"")) || (B.seed||0)-(A.seed||0) || a.localeCompare(b);
  });
  (fallback||[]).forEach(id => { if (!ids.includes(id)) ids.push(id); });
  return ids;
}
function codesForWard(wardId, pop){
  const w = wardById(wardId);
  const sid = w ? w.siteId : currentSiteId();
  const wardRank = rankedIds(pop.byWard[wardId]||{}, rankedIds(pop.bySite[sid]||pop.overall, codeOrder(sid)));
  return wardRank.map(id => codeById(id)).filter(c => c && c.siteId===sid);
}

function lastDeliveryDateFor(today, siteId){
  let last = null;
  S.orders.forEach(o => {
    if (!o.sentAt) return;
    if (siteId && o.siteId && o.siteId!==siteId) return;
    const d = o.expectedDelivery;
    if (d && d <= today && (!last || d > last)) last = d;
  });
  return last;
}
function usageSince(sinceIso, siteId){
  const bag = {};
  Object.values(S.rounds).forEach(round => {
    if (sinceIso && round.date <= sinceIso) return;
    Object.entries(round.wards||{}).forEach(([wid, entry]) => {
      const ward = wardById(wid);
      if (siteId && ward && ward.siteId !== siteId) return;
      (entry.lines||[]).forEach(line => {
        bag[line.codeId] = (bag[line.codeId]||0) + usageQty(line.qty);
      });
    });
  });
  return bag;
}
function defaultDelivery(iso, urgent){
  if (urgent) return addDays(iso, 1);
  const dow = dowOf(iso);
  if (dow===2 || dow===4) return addDays(iso, 1);
  for (let i=1;i<=8;i++){
    const next = addDays(iso, i);
    const d = dowOf(next);
    if (d===3 || d===5) return next;
  }
  return addDays(iso, 1);
}
function suggestOrder(siteId){
  const today = zonedNow().iso;
  const last = lastDeliveryDateFor(today, siteId);
  const used = usageSince(last, siteId);
  const pop = popularity();
  const sitePop = pop.bySite[siteId] || pop.overall;
  const lines = [];
  siteCodes(siteId).forEach(c => {
    const usage = used[c.id]||0;
    const low = Math.max(0, (Number(c.par)||0) - (Number(c.stock)||0));
    const qty = usage + low;
    if (qty > 0) lines.push({codeId:c.id, qty, usage, low, unit:"box"});
  });
  const order = rankedIds(sitePop, codeOrder(siteId));
  const idx = Object.fromEntries(order.map((id,i)=>[id,i]));
  lines.sort((a,b) => (idx[a.codeId]??999) - (idx[b.codeId]??999));
  return {last, lines};
}

function isOrderDay(z){
  return (S.settings.orderWeekdays||[2,4]).includes(z.dow);
}
function beforeCutoff(z){
  return z.hour < (S.settings.orderHour||11);
}
function orderSentOn(iso){
  const sid = currentSiteId();
  return S.orders.some(o => o.sentAt && o.sentDate === iso && (!o.siteId || o.siteId===sid));
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function parseRoute(){
  const h = (location.hash||"#round").replace(/^#/, "");
  const parts = h.split("/");
  const page = parts[0] || "round";
  if (page==="round" && parts[1]) route = {page:"round-ward", wardId:decodeURIComponent(parts[1]), day:null, week:null};
  else if (page==="history") route = {page:"history", wardId:null, day:parts[1] ? decodeURIComponent(parts[1]) : null, week:null};
  else if (page==="report") route = {page:"report", wardId:null, day:null, week:parts[1] ? decodeURIComponent(parts[1]) : null};
  else if (page==="setup") route = {page:"setup", wardId:null, day:null, week:null};
  else route = {page, wardId:null, day:null, week:null};
}

function render(){
  parseRoute();
  const z = zonedNow();
  clearTimeout(toastTimer);
  document.getElementById("toast").classList.remove("show");
  renderBar(z);
  renderBanners(z);
  const view = document.getElementById("view");
  const page = route.page;
  if (page==="round") view.innerHTML = renderRoundList(z);
  else if (page==="round-ward") view.innerHTML = renderRoundWard(z);
  else if (page==="trolleys") view.innerHTML = renderTrolleys(z);
  else if (page==="stock") view.innerHTML = renderStock();
  else if (page==="order") view.innerHTML = renderOrder(z);
  else if (page==="history" || page==="more") view.innerHTML = renderMore(z);
  else if (page==="report") view.innerHTML = renderReport(z);
  else if (page==="setup") view.innerHTML = renderSetup();
  else view.innerHTML = renderRoundList(z);
  const navPage = (page==="round-ward") ? "round" : (page==="history"||page==="setup"||page==="report") ? "more" : page;
  document.querySelectorAll("nav.tabbar a").forEach(a => a.classList.toggle("on", a.dataset.nav===navPage));
  requestAnimationFrame(() => window.scrollTo(0, 0));
  maybeNotify(z);
}

function renderSiteToggle(){
  if (!S.sites || S.sites.length<2) return "";
  const cur = currentSiteId();
  return `<div class="sitetog" role="tablist" aria-label="Site">${S.sites.map(s =>
    `<button type="button" role="tab" aria-selected="${s.id===cur?"true":"false"}" class="${s.id===cur?"on":""}" data-act="set-site" data-id="${esc(s.id)}">${esc(s.name)}</button>`
  ).join("")}</div>`;
}

function renderBar(z){
  const bar = document.getElementById("appbar");
  const back = route.page==="round-ward" || route.page==="setup" || route.page==="history" || route.page==="report";
  let title = "Ward Run";
  let sub = shortDate(z.iso);
  if (route.page==="round-ward"){
    const w = wardById(route.wardId);
    title = w ? w.name : "Ward";
    sub = shortDate(z.iso);
  } else if (route.page==="trolleys") title = "Trolleys";
  else if (route.page==="stock") title = "Storage stock";
  else if (route.page==="order") title = "Order";
  else if (route.page==="setup") title = "Setup";
  else if (route.page==="history") title = route.day ? shortDate(route.day) : "History";
  else if (route.page==="report") title = "Weekly report";
  else if (route.page==="more") title = "More";
  let extra = "";
  if (route.page==="round" || route.page==="round-ward"){
    const r = todayRound();
    const wards = scheduledWards(currentSiteId(), z.iso);
    const done = wards.filter(w => isDone(r.wards[w.id])).length;
    const pct = wards.length ? Math.round(done/wards.length*100) : 0;
    extra = `<div class="progress" style="width:72px" title="${done} of ${wards.length}"><span style="width:${pct}%"></span></div>`;
    if (route.page==="round") sub = shortDate(z.iso) + " · " + done + " of " + wards.length;
  }
  const site = siteById(currentSiteId());
  if (site && route.page!=="round-ward") sub = (sub ? sub + " · " : "") + site.name;
  extra = ""; /* v1.2: progress lives in the hero ring and the ward header */
  const gchips = `<span class="gchip" title="Level">Lv ${levelInfo(totalXp()).level}</span>` +
    `<button type="button" class="gchip snd" data-act="sound" aria-pressed="${G.sound?"true":"false"}" aria-label="${G.sound?"Sound and vibration on, tap to mute":"Muted, tap for sound and vibration"}">${G.sound?"🔊":"🔇"}</button>`;
  const siteTog = (route.page==="report") ? "" : renderSiteToggle();
  bar.innerHTML =
    (back ? `<button class="back" data-act="back" aria-label="Back">‹</button>` : "") +
    `<div class="grow"><h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p></div>${extra}${gchips}` +
    siteTog;
}

function renderBanners(z){
  const el = document.getElementById("banners");
  if (route.page==="report" || route.page==="history" || route.page==="setup"){ el.innerHTML=""; return; }
  if (!isOrderDay(z) || orderSentOn(z.iso)){ el.innerHTML=""; return; }
  const hour = S.settings.orderHour||11;
  const name = S.settings.partnerName || "your partner";
  if (beforeCutoff(z)){
    el.innerHTML = `<div class="banner" role="status"><b>Order day</b>Send ${esc(name)} the restock list before ${hour}:00.</div>`;
  } else {
    el.innerHTML = `<div class="banner late" role="status"><b>Order may be late</b>Today’s list has not been marked as sent yet.</div>`;
  }
}

function unitToggle(act, extra, unit){
  const on = unit==="ea";
  const attrs = Object.entries(extra||{}).map(([k,v]) => `data-${k}="${esc(v)}"`).join(" ");
  return `<button type="button" class="unitbtn${on?" on":""}" data-act="${esc(act)}" ${attrs} aria-pressed="${on?"true":"false"}" aria-label="${on?"Single packets, tap for boxes":"Boxes, tap for single packets"}">${on?"ea":"box"}</button>`;
}

function renderWardButton(w, r, pop, medal, extraCls){
  const e = r.wards[w.id];
  const status = e ? e.status : "pending";
  const n = e ? (e.lines||[]).length : 0;
  let chip = `<span class="chip idle">To do</span>`;
  let meta = "Not started";
  if (status==="nothing"){ chip = `<span class="chip">Nothing needed</span>`; meta="Checked, nothing needed"; }
  else if (status==="checked"){ chip = `<span class="chip ok">Checked</span>`; meta = n + (n===1?" code":" codes"); }
  else if (n){ chip = `<span class="chip warn">In progress</span>`; meta = n + (n===1?" code":" codes"); }
  const top = (pop.byWard[w.id] && Object.keys(pop.byWard[w.id]).length)
    ? codesForWard(w.id, pop).slice(0,2).map(c=>displayCode(c)).join(", ")
    : "";
  if (top && status==="pending" && !n) meta = "Often: " + top;
  const done = isDone(e);
  const cls = (done ? " done" : (n ? " prog" : "")) + (extraCls ? " "+extraCls : "");
  if (done) chip = chip + ` <span class="chip xp">+${wardXp(e)}</span>`;
  const day = `<span class="daychip">${esc(fmtDays(w))}</span>`;
  const note = w.notes ? `<div class="wardnote">${esc(w.notes)}</div>` : "";
  return `<button class="ward${cls}" data-act="open-ward" data-id="${esc(w.id)}">
    <span class="medal" aria-hidden="true">${done?"✓":medal}</span>
    <div class="grow"><div class="name">${esc(w.name)}</div><div class="muted">${day}${esc(meta)}</div>${note}</div>
    ${chip}
  </button>`;
}
function renderBuildingGroups(wards, r, pop, startAt){
  let i = startAt||0;
  const groups = groupByBuilding(wards);
  const showHeads = groups.length>1 || (groups.length===1 && groups[0][0]);
  return groups.map(([bldg, list]) => {
    const head = showHeads ? `<div class="bldg">${esc(bldg || "Other")}</div>` : "";
    const rows = list.map(w => { i += 1; return renderWardButton(w, r, pop, i); }).join("");
    return head + rows;
  }).join("");
}
function renderRoundList(z){
  const r = todayRound();
  const pop = popularity();
  const wards = scheduledWards(currentSiteId(), z.iso);
  const call = onCallWards(currentSiteId());
  if (!wards.length && !call.length) return `<div class="card empty">No wards on the round yet. Add or turn some on in Setup.</div>`;
  const next = wards.find(w => !isDone(r.wards[w.id]));
  const nextBtn = next ? `<button type="button" class="nextup" data-act="open-ward" data-id="${esc(next.id)}"><span aria-hidden="true">🚀</span><span class="grow"><small>Next up</small>${esc(next.name)}</span><span class="arrow" aria-hidden="true">›</span></button>` : "";
  const scheduled = wards.length
    ? renderBuildingGroups(wards, r, pop, 0)
    : `<div class="card empty">No scheduled wards today.</div>`;
  const callBlock = call.length ? (
    `<div class="oncall-sec"><div class="bldg oncall-head">On call<p>Not on today’s run. Open only if they need something.</p></div>` +
    call.map(w => renderWardButton(w, r, pop, "○", "oncall")).join("") +
    `</div>`
  ) : "";
  return renderHero(z) + nextBtn + scheduled + callBlock + brandFoot();
}

function renderRoundWard(z){
  const w = wardById(route.wardId);
  if (!w) return `<div class="card empty">That ward was not found.</div>`;
  const r = todayRound();
  const e = wardEntry(r, w.id);
  const pop = popularity();
  const codes = codesForWard(w.id, pop);
  const used = new Set((e.lines||[]).map(l => l.codeId));
  const topIds = new Set(Object.keys(pop.byWard[w.id]||{}));
  const lineHtml = (e.lines||[]).map(l => {
    const c = codeById(l.codeId);
    if (!c) return "";
    const q = l.qty==null||l.qty==="" ? "—" : String(l.qty);
    const u = lineUnit(l);
    const meta = displayMeta(c);
    const note = c.note ? ` <span class="shelfnote">${esc(c.note)}</span>` : "";
    return `<div class="line" data-cid="${esc(c.id)}">
      <div class="grow"><div class="code">${esc(displayCode(c))} ${kclBadge(c)}</div>
        <div class="muted">${esc(meta||u)}${note}</div>${varChip(lineVariance(w.id, l, z.iso), "ward")}</div>
      <div class="unitpair">
        <div class="stepper">
          <button type="button" data-act="qty" data-dir="-1" data-wid="${esc(w.id)}" data-cid="${esc(c.id)}" aria-label="Decrease">−</button>
          <div class="q">${esc(q)}</div>
          <button type="button" data-act="qty" data-dir="1" data-wid="${esc(w.id)}" data-cid="${esc(c.id)}" aria-label="Increase">+</button>
        </div>
        ${unitToggle("line-unit", {wid:w.id, cid:c.id}, u)}
      </div>
      <button class="btn ghost" data-act="remove-line" data-wid="${esc(w.id)}" data-cid="${esc(c.id)}" aria-label="Remove">✕</button>
    </div>`;
  }).join("") || `<div class="muted">Tap a code to add one box. Quantity is optional. Tap box/ea beside the count for single packets.</div>`;
  const codeBtns = codes.map((c,i) => {
    const hot = i<3 && (topIds.has(c.id) || (c.seed||0)>0);
    const sub = c.tickOnly ? "" : (c.name?`<span class="cn">${esc(c.name)}</span>`:"") + kclMark(c) + (c.note?`<span class="cn shelfnote">${esc(c.note)}</span>`:"");
    return `<button type="button" class="codebtn${used.has(c.id)?" on":""}${hot?" hot":""}${c.kcl?" kcl":""}" data-act="add-code" data-wid="${esc(w.id)}" data-cid="${esc(c.id)}">
      ${esc(displayCode(c))}${sub}
    </button>`;
  }).join("");
  const st = e.status;
  const sp = siteProgress(w.siteId);
  const pct = sp.total ? Math.round(sp.done/sp.total*100) : 0;
  const gain = st==="nothing" ? XP_WARD : wardXp(e);
  return `
    <div class="wardhead"><span class="chip xp">${sp.done}/${sp.total} wards</span><div class="progress"><span style="width:${pct}%"></span></div><span class="chip xp">+${gain} XP</span></div>
    ${w.building||w.onCall||Array.isArray(w.days)||w.notes ? `<div class="card notesbox" style="min-height:0;padding:10px 12px">${w.building?`<div class="muted">${esc(w.building)}</div>`:""}<div><span class="daychip">${esc(fmtDays(w))}</span></div>${w.notes?`<div class="wardnote" style="margin-top:6px">${esc(w.notes)}</div>`:""}</div>`:""}
    <div class="privbox"><label for="priv-note">Private note (stays on this phone)</label>
      <textarea id="priv-note" data-act="ward-private" data-id="${esc(w.id)}" rows="2" placeholder="Extra notes stay on this phone only.">${esc(w.privateNote||"")}</textarea>
      <p class="muted" style="margin:6px 0 0">Extra notes stay on this phone only.</p>
    </div>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn big ${st==="nothing"?"warn":""}" data-act="mark" data-wid="${esc(w.id)}" data-status="nothing">Nothing needed</button>
      <button class="btn big grow ${st==="checked"?"ok":"primary"}" data-act="mark" data-wid="${esc(w.id)}" data-status="checked">Mark checked ✓</button>
    </div>
    <div class="card" style="margin-top:12px"><h2>This ward</h2>${lineHtml}</div>
    <button type="button" class="scanbtn" data-act="scan-ward" data-wid="${esc(w.id)}"><span aria-hidden="true">📷</span>Scan barcode</button>
    <h3>Codes — most used first</h3>
    <div class="codes">${codeBtns}</div>
    <div class="btnrow">
      <button class="btn block" data-act="other-code" data-wid="${esc(w.id)}">Other code…</button>
    </div>
    ${st!=="pending" ? `<div class="btnrow"><button class="btn ghost block" data-act="mark" data-wid="${esc(w.id)}" data-status="pending">Clear checked state</button></div>`:""}
  `;
}

function trolleyItems(z){
  const r = S.rounds[z.iso];
  if (!r) return [];
  const groups = [];
  enabledWards().forEach(w => {
    const e = r.wards[w.id];
    if (!e || e.status==="nothing") return;
    const lines = (e.lines||[]).filter(l => codeById(l.codeId));
    if (!lines.length) return;
    groups.push({ward:w, lines});
  });
  return groups;
}
function tickKey(day, wid, cid){ return day+"|"+wid+"|"+cid; }

function renderTrolleys(z){
  const groups = trolleyItems(z);
  if (!groups.length) return `<div class="card empty">No pick list yet. Add codes on today’s round first.</div>` + brandFoot();
  const ticks = S.trolley[z.iso] || {};
  return groups.map(g => {
    const total = g.lines.length;
    const done = g.lines.filter(l => ticks[tickKey(z.iso,g.ward.id,l.codeId)]).length;
    const rows = g.lines.map(l => {
      const c = codeById(l.codeId);
      const key = tickKey(z.iso,g.ward.id,l.codeId);
      const on = !!ticks[key];
      const u = lineUnit(l);
      const q = l.qty==null||l.qty==="" ? u : ("× "+l.qty+" "+u);
      return `<button type="button" class="tickrow ${on?"done":"open"}" data-act="tick" data-wid="${esc(g.ward.id)}" data-cid="${esc(c.id)}">
        <span class="tick" aria-hidden="true">${on?"✓":""}</span>
        <span class="grow"><span class="code">${esc(displayCode(c))}</span> ${esc(c.name||"")} ${c.kcl?'<span class="chip kcl">KCl</span>':''}
          <div class="muted">${esc(q)}${c.note?" · "+esc(c.note):""}</div></span>
      </button>`;
    }).join("");
    return `<section class="trolley">
      <h2>${esc(g.ward.name)} <span class="chip ${done===total?"ok":"warn"}">${done}/${total}</span></h2>
      ${rows}
    </section>`;
  }).join("") + brandFoot();
}

function renderStock(){
  const qid = "stock-q";
  const q = stockQuery.trim().toLowerCase();

        <div class="muted">${esc(displayMeta(c)||"box")} · par ${esc(c.par||0)}${low?' <span class="low">LOW</span>':''}${c.note?" · "+esc(c.note):""}</div>${v.status==="nopar"?"":varChip(v,"store")}</div>
      <div class="stepper">

        <div class="q">${esc(c.stock||0)}</div>
        <button type="button" data-act="stock" data-dir="1" data-cid="${esc(c.id)}" aria-label="Increase stock">+</button>

function ensureDraft(z){
  const siteId = currentSiteId();
  if (draftOrder && draftOrder.date===z.iso && draftOrder.siteId===siteId) return draftOrder;
  const sug = suggestOrder(siteId);
  draftOrder = {
    date: z.iso,
    siteId,
    urgent: !(isOrderDay(z)),
    expectedDelivery: defaultDelivery(z.iso, !(isOrderDay(z))),
    lines: sug.lines.map(l => ({codeId:l.codeId, qty:l.qty, usage:l.usage, low:l.low, unit:l.unit||"box"}))
  };
  return draftOrder;
}

function renderOrder(z){
  const d = ensureDraft(z);
  const sugMeta = suggestOrder(d.siteId);
  const lines = d.lines.map(l => {
    const c = codeById(l.codeId);
    if (!c) return "";
    const hint = [];
    if (l.usage) hint.push("used "+l.usage+" since last delivery");
    if (l.low) hint.push("low by "+l.low);
    const u = lineUnit(l);
    return `<div class="line">
      <div class="grow"><div class="code">${esc(displayCode(c))} ${kclBadge(c)}</div><div class="muted">${esc((c.name||"")+(hint.length?" · "+hint.join(", "):""))}</div></div>
      <div class="unitpair">
        <div class="stepper">
          <button type="button" data-act="order-qty" data-dir="-1" data-cid="${esc(c.id)}">−</button>
          <div class="q">${esc(l.qty)}</div>
          <button type="button" data-act="order-qty" data-dir="1" data-cid="${esc(c.id)}">+</button>
        </div>
        ${unitToggle("order-unit", {cid:c.id}, u)}
      </div>
      <button class="btn ghost" data-act="order-remove" data-cid="${esc(c.id)}" aria-label="Remove">✕</button>
    </div>`;
  }).join("") || `<div class="muted">No suggested lines. Add a code, or log today’s usage first.</div>`;
  const since = sugMeta.last ? "Usage counted since last delivery ("+shortDate(sugMeta.last)+")." : "No delivery logged yet — suggestions use all recorded usage plus low stock.";
  const sent = orderSentOn(z.iso);
  return `
    <div class="card">
      <label class="row" style="gap:8px"><input type="checkbox" data-act="urgent" ${d.urgent?"checked":""}> Urgent order</label>
      <div class="field"><label>Expected delivery</label>
        <input type="date" data-act="delivery" value="${esc(d.expectedDelivery)}">
        <p class="muted">${esc(prettyDate(d.expectedDelivery))} (Australia/Sydney)</p>
      </div>
      <p class="muted">${esc(since)} Lines are sorted by this site’s most-used codes. WhatsApp shows box or ea.</p>
    </div>
    <div class="card"><h2>To order</h2>${lines}</div>
    <div class="btnrow">
      <button class="btn" data-act="order-add">Add code…</button>
      <button class="btn" data-act="order-refresh">Recalculate</button>
    </div>
    <div class="btnrow">
      <button class="btn" data-act="order-copy">Copy message</button>
      <button class="btn primary" data-act="order-share">Share to WhatsApp</button>
    </div>
    <div class="btnrow">
      <button class="btn ok block" data-act="order-send" ${sent?"disabled":""}>${sent?"Already marked sent today":"Mark as sent"}</button>
    </div>
    ${renderPastOrders()}
  `;
}
function renderPastOrders(){
  const sid = currentSiteId();
  const list = S.orders.filter(o => !o.siteId || o.siteId===sid);
  if (!list.length) return "";
  const rows = [...list].reverse().slice(0,8).map(o => {
    const n = (o.lines||[]).reduce((s,l)=>s+(Number(l.qty)||0),0);
    return `<div class="line"><div class="grow"><div>${esc(prettyDate(o.sentDate||o.date))}${o.urgent?" · urgent":""}</div>
      <div class="muted">${(o.lines||[]).length} lines · ${n} items · delivery ${esc(shortDate(o.expectedDelivery))}</div></div></div>`;
  }).join("");
  return `<h3>Recent orders</h3><div class="card">${rows}</div>`;
}

function orderMessage(d){
  const name = (S.settings.partnerName||"").trim();
  const title = d.urgent ? "URGENT stock order" : "Stock order";
  const site = siteById(d.siteId);
  const lines = d.lines.map(l => {
    const c = codeById(l.codeId);
    if (!c) return "";
    const label = (c.tickOnly || !c.code) ? (c.name||"") : (c.code + (c.name?" "+c.name:""));
    return label + " x " + l.qty + " " + lineUnit(l);
  }).filter(Boolean);
  const parts = [
    title,
    prettyDate(d.date),
    "Delivery: " + prettyDate(d.expectedDelivery)
  ];
  if (site && site.name) parts.push("Site: " + site.name);
  parts.push("");
  parts.push(lines.join("\n") || "(no lines)");
  parts.push("");
  parts.push(lines.length + (lines.length===1?" line":" lines"));
  if (name) parts.push("For " + name);
  return parts.join("\n");
}

function renderMore(z){
  const pop = popularity();
  return `
    <div class="btnrow" style="margin-top:0">
      <a class="btn primary" href="#report" style="text-decoration:none;display:inline-flex;align-items:center">Weekly delivery report</a>
      <a class="btn" href="#history" style="text-decoration:none;display:inline-flex;align-items:center">History</a>
      <a class="btn" href="#setup" style="text-decoration:none;display:inline-flex;align-items:center">Setup</a>
    </div>
    ${route.page==="more" ? renderTrophies(z) : ""}
    ${route.page==="history" ? renderHistory(z, pop) : ""}
  `;
}

function renderHistory(z, pop){
  function rankBlock(title, bag, allowSeed){
    const ids = rankedIds(bag, []);
    const visible = ids.filter(id => {
      const st = bag[id]||{};
      return (st.qty||0)>0 || (st.hits||0)>0 || (allowSeed && (st.seed||0)>0);
    });
    if (!visible.length) return `<p class="muted">No usage yet.</p>`;
    const max = Math.max(1, ...visible.map(id => (bag[id]||{}).qty||0));
    return visible.slice(0,15).map((id,i) => {
      const c = codeById(id); if (!c) return "";
      const st = bag[id];
      const pct = Math.round((st.qty||0)/max*100);
      const qtyLabel = (st.qty||0) ? String(st.qty) : "notes";
      return `<div class="rank"><span class="muted" style="width:1.2em">${i+1}</span>
        <div class="grow"><div class="code">${esc(displayCode(c))} ${esc(c.name||"")}</div>
          <div class="bar"><span style="width:${pct}%"></span></div></div>
        <span class="muted">${esc(qtyLabel)}</span></div>`;
    }).join("");
  }
  const siteBlocks = S.sites.map(s => {
    return `<div class="card"><h2>${esc(s.name)} — most used</h2>${rankBlock(s.name, pop.bySite[s.id]||{}, s.id===SITE_CH)}</div>`;
  }).join("");
  const wardBlocks = enabledWards().map(w => {
    const bag = pop.byWard[w.id]||{};
    if (!Object.keys(bag).length) return "";
    return `<div class="card"><h2>${esc(w.name)}</h2>${rankBlock(w.name, bag, false)}</div>`;
  }).join("") || `<div class="card muted">No per-ward usage yet.</div>`;

  const note = `<p class="phone-note">Each day’s list is saved automatically on this phone. Opening the link on another phone starts a fresh history.</p>`;
  const picker = `<label class="muted" for="hist-date">Open a day</label>
    <input id="hist-date" class="hist-date" type="date" data-act="history-date" value="${esc(route.day||z.iso)}">`;

  if (route.day){
    const rep = dayReport(route.day, "all");
    const todayNote = route.day===z.iso ? `<p class="phone-note">Today’s list is still editable on the Round tab. This view is read-only.</p>` : "";
    return `
      ${note}
      ${picker}
      ${todayNote}
      <div class="card rpt" id="day-sheet">
        <div class="rpt-head"><h2>Delivered fluids – ${esc(prettyDate(route.day))}</h2>
          <div class="muted">All sites</div></div>
        ${renderDayBlock(rep, true)}
      </div>
      <div class="btnrow noprint" style="margin-top:0">
        <a class="btn" href="#history" style="text-decoration:none;display:inline-flex;align-items:center">All days</a>
        <a class="btn" href="#report" style="text-decoration:none;display:inline-flex;align-items:center">Weekly delivery report</a>
      </div>
      ${brandFoot()}
    `;
  }

  const days = recordedDays();
  const dayRows = days.map(day => {
    const rep = dayReport(day, "all");
    const nW = rep.wards.length;
    const tag = day===z.iso ? " · today" : "";
    return `<a class="dayrow" href="#history/${esc(day)}"><span class="grow"><div>${esc(prettyDate(day))}${esc(tag)}</div><div class="muted">${nW} ward${nW===1?"":"s"} · ${esc(fmtUnitBag(rep.units))}</div></span><span aria-hidden="true">›</span></a>`;
  }).join("") || `<p class="muted">No deliveries recorded yet. Finish a ward on the Round tab and it is saved here automatically.</p>`;

  return `
    ${note}
    ${picker}
    <h3>Past days</h3>
    <div class="daylist">${dayRows}</div>
    <h3>Overall popularity</h3>
    <div class="card">${rankBlock("Overall", pop.overall, true)}</div>
    <h3>Per site</h3>
    ${siteBlocks}
    <h3>Per ward</h3>
    ${wardBlocks}
    ${brandFoot()}
  `;
}

function renderReport(z){
  let monday = route.week && /^\d{4}-\d{2}-\d{2}$/.test(route.week) ? mondayOf(route.week) : mondayOf(z.iso);
  const siteFilter = (reportSite && reportSite!=="") ? reportSite : "all";
  const days = weekReports(monday, siteFilter);
  const weekBag = days.reduce((acc, d) => addUnits(acc, d.units), {box:0, ea:0});
  const heading = "Delivered fluids – week of " + weekHeading(monday);
  const showSite = siteFilter==="all";
  const siteBtns = [`<button type="button" data-act="report-site" data-id="all" class="${siteFilter==="all"?"on":""}">All</button>`]
    .concat((S.sites||[]).map(s => `<button type="button" data-act="report-site" data-id="${esc(s.id)}" class="${siteFilter===s.id?"on":""}">${esc(s.name)}</button>`))
    .join("");
  const body = days.map(rep => renderDayBlock(rep, showSite)).join("");
  return `
    <div class="weeknav noprint">
      <button type="button" class="btn" data-act="week-prev" aria-label="Previous week">‹</button>

function openWard(id){
  location.hash = "round/" + encodeURIComponent(id);
}
function addCodeToWard(wid, cid){
  const ww = wardById(wid); if (ww) touchRun(ww.siteId);
  sfx("tick"); buzz(8);
  const r = todayRound();
  const e = wardEntry(r, wid);
  const line = e.lines.find(l => l.codeId===cid);
  if (line){
    const n = qtyNum(line.qty);
    line.qty = (n==null ? 1 : n+1);
  } else {
    e.lines.push({codeId:cid, qty:1, unit:"box"});
    if (e.status==="nothing") e.status="pending";
  }
  touchEntry(wid, e);
  save(); render();
  const ln = document.querySelector('.line[data-cid="' + (window.CSS && CSS.escape ? CSS.escape(cid) : cid) + '"]');
  if (ln) ln.classList.add("pulse");
}
function changeQty(wid, cid, dir){
  const e = wardEntry(todayRound(), wid);
  const line = e.lines.find(l => l.codeId===cid);
  if (!line) return;
  sfx("tick"); buzz(6);
  const n = qtyNum(line.qty);
  if (dir<0){
    if (n==null || n<=1) line.qty = "";
    else line.qty = n-1;
  } else {
    line.qty = (n==null ? 1 : n+1);
  }
  touchEntry(wid, e);
  save(); render();
}
function toggleLineUnit(wid, cid){
  const e = wardEntry(todayRound(), wid);
  const line = e.lines.find(l => l.codeId===cid);
  if (!line) return;
  line.unit = lineUnit(line)==="ea" ? "box" : "ea";
  touchEntry(wid, e);
  save(); render();
}
function removeLine(wid, cid){
  const e = wardEntry(todayRound(), wid);
  e.lines = e.lines.filter(l => l.codeId!==cid);
  touchEntry(wid, e);
  save(); render();
}
function markWard(wid, status){
  const e = wardEntry(todayRound(), wid);
  const wasDone = isDone(e);
  const mw = wardById(wid); if (mw) touchRun(mw.siteId);
  e.status = status;
  if (status==="nothing") e.lines = [];
  touchEntry(wid, e);
  save();
  if (!wasDone && isDone(e)) gameWardDone(wid);
  if (status==="checked" || status==="nothing"){
    const ww = wardById(wid);
    const wards = scheduledWards(ww ? ww.siteId : currentSiteId(), zonedNow().iso);
    const i = wards.findIndex(w => w.id===wid);
    const next = wards.slice(Math.max(i,0)+ (i<0?0:1)).find(w => {
      const x = todayRound().wards[w.id];
      return !isDone(x);
    });
    if (next){ openWard(next.id); return; }
    location.hash = "round";
    return;
  }
  render();
}
function tickItem(wid, cid){
  const day = zonedNow().iso;
  if (!S.trolley[day]) S.trolley[day] = {};
  const key = tickKey(day, wid, cid);
  S.trolley[day][key] = !S.trolley[day][key];
  if (S.trolley[day][key]){ sfx("tick"); buzz(8); floatText("+1 XP"); }
  save(); render();
}
function changeStock(cid, dir){
  const c = codeById(cid); if (!c) return;
  const n = Number(c.stock)||0;
  c.stock = Math.max(0, n+dir);
  save(); render();
}

function rebuildDraftKeepEdits(z, siteId){
  const prev = {};
  if (draftOrder) draftOrder.lines.forEach(l => { prev[l.codeId]={qty:l.qty, unit:lineUnit(l)}; });
  const sug = suggestOrder(siteId);
  draftOrder = {
    date: z.iso,
    siteId,
    urgent: draftOrder ? draftOrder.urgent : !isOrderDay(z),
    expectedDelivery: draftOrder && draftOrder.siteId===siteId ? draftOrder.expectedDelivery : defaultDelivery(z.iso, draftOrder?draftOrder.urgent:!isOrderDay(z)),
    lines: sug.lines.map(l => ({
      codeId:l.codeId,
      qty: prev[l.codeId]!=null?prev[l.codeId].qty:l.qty,
      usage:l.usage, low:l.low,
      unit: prev[l.codeId]!=null?prev[l.codeId].unit:(l.unit||"box")
    }))
  };
}

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  let ok=false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  ta.remove();
  return ok;
}
function waLink(text){
  const digits = String(S.settings.waNumber||"").replace(/\D+/g,"");
  const q = "text=" + encodeURIComponent(text);
  return digits ? ("https://wa.me/" + digits + "?" + q) : ("https://wa.me/?" + q);
}

function exportBackup(){
  const payload = {
    format: "ward-run-backup",
    version: 2,
    exportedAt: new Date().toISOString(),
    data: S
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ward-run-backup-" + zonedNow().iso + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast("Backup downloaded");
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(String(reader.result));
      if (!obj || obj.format!=="ward-run-backup" || !obj.data) throw new Error("Not a Ward Run backup");
      if (!confirm("Replace all data on this phone with the backup? This cannot be undone.")) return;
      S = obj.data;
      migrate(S);
      draftOrder = null;
      save(); render();
      toast("Backup imported");
    }catch(e){
      toast("Could not import that file");
    }
  };
  reader.readAsText(file);
}

function promptDlg(title, fields, onOk){
  const dlg = document.getElementById("dlg");
  const body = fields.map((f,i) => `<div class="field"><label>${esc(f.label)}</label>
    <input id="dlg-f${i}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}" ${f.attr||""}></div>`).join("");
  dlg.innerHTML = `<h2 id="dlgTitle">${esc(title)}</h2>${body}
    <div class="btnrow"><button class="btn" data-dlg="cancel">Cancel</button>
    <button class="btn primary" data-dlg="ok">Save</button></div>`;
  const cancel = () => { dlg.close(); dlg.innerHTML=""; };
  dlg.querySelector("[data-dlg=cancel]").onclick = cancel;
  dlg.querySelector("[data-dlg=ok]").onclick = () => {
    const values = fields.map((_,i) => dlg.querySelector("#dlg-f"+i).value);
    cancel();
    onOk(values);
  };
  dlg.showModal();
  const first = dlg.querySelector("input");
  if (first) first.focus();
}

function maybeNotify(z){
  if (!("Notification" in window) || Notification.permission!=="granted") return;
  if (!isOrderDay(z) || !beforeCutoff(z) || orderSentOn(z.iso)) return;
  const key = "ward-run-notified-"+z.iso;
  if (sessionStorage.getItem(key)) return;
  try{
    new Notification("Ward Run", {
      body: "Send today’s restock list before "+(S.settings.orderHour||11)+":00.",
      icon: "icons/icon-192.png",
      tag: "ward-run-order-day"
    });
    sessionStorage.setItem(key,"1");
  }catch(e){}
}

function newCode(code, name, siteId){
  return {id:"c-"+slug(code||name||"x")+"-"+uid(""), code:code||"", name:name||"", note:"", kcl:false, tickOnly:!code, unit:"box", par:0, stock:0, siteId:siteId||currentSiteId(), seed:0};
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  const z = zonedNow();

  if (act==="back"){
    if (route.page==="round-ward") location.hash="round";
    else if (route.page==="history" && route.day) location.hash="history";
    else location.hash="more";
    return;
  }
  if (act==="week-prev" || act==="week-next"){
    const ziso = zonedNow().iso;
    const cur = (route.week && /^\d{4}-\d{2}-\d{2}$/.test(route.week)) ? mondayOf(route.week) : mondayOf(ziso);
    const next = addDays(cur, act==="week-next" ? 7 : -7);
    location.hash = "report/" + next;
    return;
  }
  if (act==="report-site"){
    reportSite = b.dataset.id || "all";
    render();
    return;
  }
  if (act==="print-report"){ window.print(); return; }
  if (act==="copy-report"){
    const ziso = zonedNow().iso;
    const mon = (route.week && /^\d{4}-\d{2}-\d{2}$/.test(route.week)) ? mondayOf(route.week) : mondayOf(ziso);
    copyText(reportPlainText(mon, reportSite||"all")).then(ok => toast(ok ? "Copied as text" : "Copy failed — long-press to copy"));
    return;
  }
  if (act==="celebrate-close"){ clearTimeout(celebrateTimer); document.getElementById("celebrate").classList.remove("show"); return; }
  if (act==="sound"){ G.sound = !G.sound; gSave(); render(); if (G.sound){ sfx("done"); buzz(15); } toast(G.sound ? "Sound and vibration on" : "Muted"); return; }
  if (act==="game-reset"){
    if (!confirm("Reset XP, badges and best times? Your stock data is not touched.")) return;
    localStorage.removeItem(GSTORE); gLoad(); render(); toast("Game stats reset"); return;
  }
  if (act==="scan-ward"){
    const ward = wardById(b.dataset.wid); if (!ward) return;
    openScanner(ward.siteId, (c) => { addCodeToWard(ward.id, c.id); toast("Added " + displayCode(c) + " to " + ward.name); }, "Scan for " + ward.name);
    return;
  }
  if (act==="scan-stock"){
    openScanner(currentSiteId(), (c) => {
      stockQuery = displayCode(c);
      render();
      const row = document.querySelector('.stockrow[data-cid="' + (window.CSS && CSS.escape ? CSS.escape(c.id) : c.id) + '"]');
      if (row){ row.classList.add("flash"); row.scrollIntoView({block:"center"}); }
      toast("Found " + displayCode(c) + (c.name ? " · " + c.name : ""));
    }, "Scan to find an item");
    return;
  }
  if (act==="export-xlsx"){ exportXlsx(); return; }
  if (act==="export-csv"){ exportCsv(); return; }
  if (act==="set-site") setCurrentSite(b.dataset.id);
  if (act==="open-ward") openWard(b.dataset.id);
  if (act==="add-code") addCodeToWard(b.dataset.wid, b.dataset.cid);
  if (act==="qty") changeQty(b.dataset.wid, b.dataset.cid, Number(b.dataset.dir));
  if (act==="line-unit") toggleLineUnit(b.dataset.wid, b.dataset.cid);
  if (act==="remove-line") removeLine(b.dataset.wid, b.dataset.cid);
  if (act==="mark") markWard(b.dataset.wid, b.dataset.status);
  if (act==="tick") tickItem(b.dataset.wid, b.dataset.cid);
  if (act==="stock") changeStock(b.dataset.cid, Number(b.dataset.dir));
  if (act==="other-code"){
    const ward = wardById(b.dataset.wid);
    const sid = ward ? ward.siteId : currentSiteId();
    promptDlg("Add a code", [{label:"Code", value:"", placeholder:"e.g. 7113"}], ([code]) => {
      code = String(code||"").trim();
      if (!code) return;
      let c = siteCodes(sid).find(x => !x.tickOnly && x.code.toLowerCase()===code.toLowerCase())
        || siteCodes(sid).find(x => displayCode(x).toLowerCase()===code.toLowerCase());
      if (!c){
        c = newCode(code, "", sid);
        S.codes.push(c);
      }
      addCodeToWard(b.dataset.wid, c.id);
    });
  }
  if (act==="urgent"){
    const d = ensureDraft(z);
    d.urgent = b.checked;
    d.expectedDelivery = defaultDelivery(z.iso, d.urgent);
    render();
  }
  if (act==="order-qty"){
    const d = ensureDraft(z);
    const line = d.lines.find(l => l.codeId===b.dataset.cid);
    if (!line) return;
    line.qty = Math.max(0, (Number(line.qty)||0) + Number(b.dataset.dir));
    if (line.qty===0) d.lines = d.lines.filter(l => l.codeId!==b.dataset.cid);
    render();
  }
  if (act==="order-unit"){
    const d = ensureDraft(z);
    const line = d.lines.find(l => l.codeId===b.dataset.cid);
    if (!line) return;
    line.unit = lineUnit(line)==="ea" ? "box" : "ea";
    render();
  }
  if (act==="order-remove"){
    const d = ensureDraft(z);
    d.lines = d.lines.filter(l => l.codeId!==b.dataset.cid);
    render();
  }
  if (act==="order-add"){
    const sid = currentSiteId();
    promptDlg("Add to order", [{label:"Code", placeholder:"e.g. 7113"},{label:"Quantity", value:"1", attr:"inputmode=\"numeric\""}], ([code, qty]) => {
      code = String(code||"").trim();
      const q = Math.max(0, Number(qty)||0);
      if (!code || !q) return;
      let c = siteCodes(sid).find(x => !x.tickOnly && x.code.toLowerCase()===code.toLowerCase())
        || siteCodes(sid).find(x => displayCode(x).toLowerCase()===code.toLowerCase());
      if (!c){ c = newCode(code, "", sid); S.codes.push(c); save(); }
      const d = ensureDraft(z);
      const line = d.lines.find(l => l.codeId===c.id);
      if (line) line.qty = q; else d.lines.push({codeId:c.id, qty:q, usage:0, low:0, unit:"box"});
      render();
    });
  }
  if (act==="order-refresh"){
    const d = ensureDraft(z);
    rebuildDraftKeepEdits(z, d.siteId);
    render();
    toast("Suggestions recalculated");
  }
  if (act==="order-copy"){
    const text = orderMessage(ensureDraft(z));
    copyText(text).then(ok => toast(ok ? "Message copied" : "Copy failed — long-press to copy"));
  }
  if (act==="order-share"){
    const text = orderMessage(ensureDraft(z));
    const url = waLink(text);
    if (navigator.share){
      navigator.share({text}).catch(()=>{ window.location.href = url; });
    } else {
      window.location.href = url;
    }
  }
  if (act==="order-send"){
    const d = ensureDraft(z);
    if (!d.lines.length){ toast("Add at least one line"); return; }
    S.orders.push({
      id: uid("o-"),
      date: d.date,
      sentAt: new Date().toISOString(),
      sentDate: z.iso,
      urgent: !!d.urgent,
      expectedDelivery: d.expectedDelivery,
      siteId: d.siteId,
      lines: d.lines.map(l => ({codeId:l.codeId, qty:l.qty, unit:lineUnit(l)})),
      message: orderMessage(d)
    });
    save();
    render();
    toast("Order logged · delivery " + shortDate(d.expectedDelivery));
    gameOrderSent(z, d.siteId);
  }
  if (act==="export") exportBackup();
  if (act==="import"){
    const inp = document.getElementById("import-file");
    if (inp) inp.click();
  }
  if (act==="ward-move"){
    const sid = currentSiteId();
    const list = S.wards.filter(w => w.siteId===sid).sort((a,b)=>a.order-b.order);
    const i = list.findIndex(w => w.id===b.dataset.id);
    const j = i + Number(b.dataset.dir);
    if (i<0 || j<0 || j>=list.length) return;
    const tmp = list[i]; list[i]=list[j]; list[j]=tmp;
    list.forEach((w,k)=>w.order=k);
    save(); render();
  }
  if (act==="ward-day"){
    const w = wardById(b.dataset.id); if (!w) return;
    const d = Number(b.dataset.day);
    if (w.onCall) w.onCall = false;
    let days = Array.isArray(w.days) ? w.days.slice() : [0,1,2,3,4,5,6];
    if (days.includes(d)) days = days.filter(x => x!==d);
    else days = days.concat([d]).sort((a,c)=>a-c);
    w.days = days;
    save(); render();
    return;
  }
  if (act==="ward-add"){
    promptDlg("Add ward", [{label:"Abbreviation", placeholder:"e.g. 4n"}], ([name]) => {
      name = String(name||"").trim(); if (!name) return;
      const id = "w-"+slug(name)+"-"+uid("");
      const sid = currentSiteId();
      const max = S.wards.filter(w=>w.siteId===sid).reduce((m,w)=>Math.max(m,w.order),-1);
      const w = {id, name, order:max+1, siteId:sid, enabled:true, building:"", notes:"", privateNote:"", onCall:false};
      if (sid===SITE_POW) w.days = [2,4];
      S.wards.push(w);
      save(); render();
    });
  }
  if (act==="code-add"){
    const sid = currentSiteId();
    promptDlg("Add code", [{label:"Code"},{label:"Name (optional)"}], ([code,name]) => {
      code = String(code||"").trim(); if (!code) return;
      if (siteCodes(sid).some(c => !c.tickOnly && c.code.toLowerCase()===code.toLowerCase())){ toast("That code is already on the list"); return; }
      S.codes.push(newCode(code, String(name||"").trim(), sid));
      save(); render();
    });
  }
  if (act==="site-add"){
    promptDlg("Add site", [{label:"Site name", placeholder:"A short label you choose"}], ([name]) => {
      name = String(name||"").trim(); if (!name) return;
      S.sites.push({id:"s-"+uid(""), name});
      save(); render();
    });
  }
  if (act==="site-del"){
    if (S.sites.length<=1) return;
    const fallback = S.sites.find(s => s.id!==b.dataset.id);
    S.wards.forEach(w => { if (w.siteId===b.dataset.id) w.siteId = fallback.id; });
    S.codes.forEach(c => { if (c.siteId===b.dataset.id) c.siteId = fallback.id; });
    S.sites = S.sites.filter(s => s.id!==b.dataset.id);
    if (S.settings.currentSiteId===b.dataset.id) S.settings.currentSiteId = fallback.id;
    draftOrder = null;
    save(); render();
  }
  if (act==="notify-ask"){
    if (!("Notification" in window)){ toast("Notifications are not available in this browser"); return; }
    Notification.requestPermission().then(p => {
      toast(p==="granted" ? "Reminders on for order days" : "Permission not granted");
      maybeNotify(zonedNow());
    });
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  const act = t.dataset && t.dataset.act;
  if (!act) return;
  const z = zonedNow();
  if (act==="delivery"){ ensureDraft(z).expectedDelivery = t.value; }
  if (act==="ward-on"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.enabled = t.checked; save(); render();
  }
  if (act==="ward-oncall"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.onCall = t.checked;
    if (w.onCall) w.days = [];
    else if (!Array.isArray(w.days) || !w.days.length) w.days = (w.siteId===SITE_POW) ? [2,4] : [1,2,3,4,5];
    save(); render();
  }
  if (act==="code-par"){
    const c = codeById(t.dataset.id); if (!c) return;
    c.par = Math.max(0, Number(t.value)||0); save();
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  const act = t.dataset && t.dataset.act;
  if (!act) return;
  if (act==="filter-stock"){
    stockQuery = t.value;
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll(".stockrow").forEach(row => {
      row.style.display = !q || (row.dataset.name||"").includes(q) ? "" : "none";
    });
  }
  if (act==="ward-name"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.name = t.value; save();
  }
  if (act==="ward-building"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.building = t.value; save();
  }
  if (act==="ward-notes"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.notes = t.value; save();
  }
  if (act==="ward-private"){
    const w = wardById(t.dataset.id); if (!w) return;
    w.privateNote = t.value; save();
  }
  if (act==="code-code"){
    const c = codeById(t.dataset.id); if (!c || c.tickOnly) return;
    c.code = t.value; save();
  }
  if (act==="code-name"){
    const c = codeById(t.dataset.id); if (!c) return;
    c.name = t.value; save();
  }
  if (act==="site-name"){
    const s = siteById(t.dataset.id); if (!s) return;
    s.name = t.value; save(); render();
  }
  if (act==="set-partner"){ S.settings.partnerName = t.value; save(); }
  if (act==="set-wa"){ S.settings.waNumber = t.value; save(); }
  if (act==="code-par"){
    const c = codeById(t.dataset.id); if (!c) return;
    c.par = Math.max(0, Number(t.value)||0); save();
  }
});

document.addEventListener("change", (ev) => {
  if (ev.target && ev.target.id==="import-file" && ev.target.files && ev.target.files[0]){
    importBackup(ev.target.files[0]);
    ev.target.value = "";
  }
  const t = ev.target;
  if (t && t.dataset && t.dataset.act==="history-date"){
    const v = String(t.value||"");
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) location.hash = "history/" + v;
  }
});

window.addEventListener("hashchange", () => {
  if (!/^#stock/.test(location.hash)) stockQuery = "";
  clearTimeout(toastTimer);
  document.getElementById("toast").classList.remove("show");
  render();
});
window.addEventListener("pageshow", render);

document.addEventListener("pointerdown", (ev) => { lastTap = {x:ev.clientX, y:ev.clientY}; }, true);
load();
gLoad();
if (!location.hash) location.hash = "#round";
else render();

if ("serviceWorker" in navigator && !/e2e=1/.test(location.search)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
})();
</script>
</body>
</html>
